  <link rel="stylesheet" href="bw-theme.css">
  <style>
    /* ألوان وخطوط المنصة (تعمل حتى لو فُتحت الصفحة وحدها من الجهاز) */
    :root { --bw-night: #0c2440; --bw-navy: #12345a; --bw-sea: #1d5c8f; --bw-gold: #e3a92b; --bw-gold-soft: #fbefd2; --bw-paper: #f5f8fb; --bw-line: #dbe5ee; }
    body { margin: 0; font-family: "IBM Plex Sans Arabic", Tahoma, Arial, sans-serif; background: var(--bw-paper); }

    #timer { background: var(--bw-gold); color: var(--bw-night); }
    #timer.urgent { background: #fbe6e2; color: #c2412f; }
    @media (max-width: 700px) { #bw-shell .bws-brand b, #bw-shell .bws-title { display: none; } #bw-shell .bws-back { font-size: 0; padding: 7px 10px; line-height: 1; } #bw-shell .bws-back::before { content: "☰"; font-size: 18px; } }

    #timer { display: inline-block; font: 700 16px "Readex Pro", sans-serif; border-radius: 10px; padding: 6px 14px; min-width: 70px; text-align: center; direction: ltr; }
    .card { background: #fff; border: 1px solid var(--bw-line); border-radius: 20px; padding: 22px; margin-bottom: 16px; }

    .btn:disabled { opacity: .45; cursor: default; }
    .btn.gold { background: var(--bw-gold); color: var(--bw-night); }
    .btn.soft { background: #eaf2f9; color: var(--bw-navy); }
    .btn.ghost { background: #fff; color: var(--bw-navy); box-shadow: inset 0 0 0 1.5px var(--bw-line); }
    .btn.red { background: #fbe6e2; color: #b4321f; }
    .btn.sm { padding: 7px 12px; font-size: 13.5px; border-radius: 10px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    /* الواجهة */
    .hero { background: var(--bw-night) radial-gradient(circle at 1.5px 1.5px, #ffffff12 1.5px, transparent 0) 0 0 / 26px 26px; color: #fff; border-radius: 22px; padding: 26px; margin-bottom: 16px; box-shadow: -8px 8px 0 var(--bw-gold); }
    .hero .tag { display: inline-block; background: var(--bw-gold); color: var(--bw-night); font-weight: 700; font-size: 13px; border-radius: 99px; padding: 2px 12px; }
    .hero h1 { margin: 10px 0 6px; font-size: clamp(26px, 4vw, 38px); line-height: 1.3; }
    .hero p { margin: 0; color: #c3d3e4; }
    .bank { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; margin-top: 18px; background: #ffffff12; border-radius: 16px; padding: 14px 16px; }
    .bank b { font-family: "Readex Pro", sans-serif; font-size: 26px; color: var(--bw-gold); }
    .bank .track { height: 10px; background: #ffffff26; border-radius: 99px; overflow: hidden; }

    .chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip { font: 600 15px "IBM Plex Sans Arabic", Tahoma, sans-serif; border: 1.5px solid var(--bw-line); background: #fff; color: #142338; border-radius: 14px; padding: 10px 16px; cursor: pointer; min-width: 64px; text-align: center; }
    .chip small { display: block; font-size: 12px; color: #5a6b80; font-weight: 500; }
    .chip.on { background: var(--bw-navy); border-color: var(--bw-navy); color: #fff; }
    .chip.on small { color: #c3d3e4; }
    .build { display: grid; grid-template-columns: 1fr 1fr 1.3fr; gap: 14px; margin-top: 12px; }
    .opt-g { background: var(--bw-paper); border: 1px solid var(--bw-line); border-radius: 16px; padding: 14px; }

    .resume { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--bw-gold-soft); color: #6b4a00; border-radius: 16px; padding: 12px 16px; margin-bottom: 16px; font-weight: 600; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    /* الاختبار */
    .qwrap { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 16px; align-items: start; }
    .qhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; color: #5a6b80; font-weight: 600; font-size: 14.5px; margin-bottom: 8px; }
    .qhead .mode { background: #eaf2f9; color: var(--bw-navy); border-radius: 99px; padding: 2px 10px; font-size: 12.5px; }
    .qtrack { height: 6px; background: #e3ebf3; border-radius: 99px; overflow: hidden; margin-bottom: 14px; }
    .qtrack i { display: block; height: 100%; background: linear-gradient(90deg, var(--bw-sea), var(--bw-gold)); border-radius: 99px; transition: width .2s; }
    .qimg { position: relative; background: #fff; border-radius: 14px; overflow: hidden; cursor: zoom-in; min-height: 120px; }
    .qimg img { display: block; width: 100%; height: auto; }
    .qimg .zoom { position: absolute; bottom: 10px; left: 10px; background: #0c2440cc; color: #fff; font-size: 12.5px; border-radius: 99px; padding: 3px 10px; pointer-events: none; }
    .opts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 14px; }
    .opt { font: 700 22px "Readex Pro", sans-serif; border: 2px solid var(--bw-line); background: #fff; color: var(--bw-navy); border-radius: 14px; padding: 12px 0; cursor: pointer; }
    .opt:hover { border-color: var(--bw-sea); }
    .opt.on { background: var(--bw-navy); border-color: var(--bw-navy); color: #fff; }
    .opt.ok { background: #e1f4ea; border-color: #1d8a58; color: #17633f; }
    .opt.no { background: #fbe6e2; border-color: #c2412f; color: #b4321f; }
    .fb { margin-top: 12px; border-radius: 12px; padding: 10px 14px; font-weight: 600; }
    .fb.ok { background: #e1f4ea; color: #17633f; } .fb.no { background: #fbe6e2; color: #b4321f; }
    .qnav { display: flex; gap: 8px; justify-content: space-between; margin-top: 14px; flex-wrap: wrap; }
    .side h3 { margin: 0 0 10px; font-size: 16px; color: var(--bw-navy); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(36px, 1fr)); gap: 6px; }
    .grid button { height: 36px; border-radius: 10px; border: 1.5px solid var(--bw-line); background: #fff; font: 600 13px "IBM Plex Sans Arabic", sans-serif; color: #5a6b80; cursor: pointer; position: relative; }
    .grid button.a { background: #eaf2f9; border-color: #c3d6e8; color: var(--bw-navy); }
    .grid button.f::after { content: ""; position: absolute; top: 3px; left: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--bw-gold); }
    .grid button.c { box-shadow: 0 0 0 2px var(--bw-navy); }
    .grid button.ok { background: #e1f4ea; border-color: #9fd6b9; color: #17633f; } .grid button.no { background: #fbe6e2; border-color: #f0b9ae; color: #b4321f; }
    .legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; font-size: 12.5px; color: #5a6b80; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 4px; vertical-align: middle; }
    .keys { margin-top: 12px; font-size: 12.5px; color: #8494a8; line-height: 1.8; }
    .flagbtn.on { background: var(--bw-gold); color: var(--bw-night); box-shadow: none; }
    /* النتيجة */
    .res { background: var(--bw-night); color: #fff; border-radius: 22px; padding: 24px; margin-bottom: 16px; box-shadow: -8px 8px 0 var(--bw-gold); }
    .res small { color: var(--bw-gold); font-weight: 600; }
    .res h2 { margin: 2px 0 4px; font-size: clamp(28px, 4vw, 40px); font-family: "Readex Pro", sans-serif; }
    .res p { margin: 0; color: #c3d3e4; }
    .kp { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 16px; border-top: 1px solid #ffffff26; }
    .kp div { padding-top: 12px; }
    .kp b { display: block; font-family: "Readex Pro", sans-serif; font-size: 24px; }
    .kp span { color: #c3d3e4; font-size: 13.5px; }
    .advice { margin: 0; padding-inline-start: 20px; line-height: 1.9; }
    .rv { border-top: 1px solid #eef3f8; padding: 14px 0; display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 14px; align-items: center; }
    .rv img { width: 100%; border-radius: 10px; border: 1px solid var(--bw-line); cursor: zoom-in; display: block; }
    .rv .st { font-weight: 700; } .rv .st.ok { color: #17633f; } .rv .st.no { color: #b4321f; } .rv .st.na { color: #8a5a00; }
    .rv .ans { margin-top: 4px; font-size: 14.5px; }
    .hist { display: flex; align-items: flex-end; gap: 8px; height: 140px; border-bottom: 1px solid var(--bw-line); padding-top: 8px; }
    .hist div { flex: 1; max-width: 44px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; height: 100%; font-size: 12px; color: #5a6b80; }
    .hist i { display: block; width: 100%; background: var(--bw-navy); border-radius: 8px 8px 0 0; min-height: 4px; }
    .hist div:last-child i { background: var(--bw-gold); }
    .tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
    .tbl td, .tbl th { padding: 8px 6px; border-bottom: 1px solid #eef3f8; text-align: start; }
    .tbl th { color: #5a6b80; font-weight: 600; }
    /* تكبير الصورة */
    .lb { position: fixed; inset: 0; z-index: 2147483400; background: #0c2440ee; display: grid; place-items: center; padding: 16px; cursor: zoom-out; }
    .lb img { max-width: 100%; max-height: 92vh; border-radius: 12px; background: #fff; }
    .dlg { position: fixed; inset: 0; z-index: 2147483300; background: #0c244099; display: grid; place-items: center; padding: 16px; }
    .dlg > div { background: #fff; border-radius: 18px; padding: 22px; width: min(420px, 100%); border-top: 4px solid var(--bw-gold); }
    .dlg h3 { margin: 0 0 8px; color: var(--bw-navy); }
    .dlg p { margin: 0 0 14px; color: #3b4b60; }
    @media (max-width: 900px) {
      .qwrap { grid-template-columns: 1fr; }
      .side { order: 2; }
      .rv { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      .mw { margin-top: 16px; }
      .card, .hero, .res { padding: 16px; }
      .two { grid-template-columns: 1fr; }
      .kp { grid-template-columns: 1fr 1fr; }
      .opt { font-size: 20px; padding: 10px 0; }
      .qnav .btn { flex: 1; }
      .qimg .zoom { top: 6px; bottom: auto; left: 6px; font-size: 11px; padding: 2px 8px; opacity: .85; }
      .keys { display: none; }
    }
  .qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.qhead .qans{flex:1;font-size:13.5px;color:#42566c;font-weight:600;text-align:center}.qsub{padding:5px 14px!important;font-size:13px!important}

/* ===== الجوال: كل الاختبار في شاشة واحدة ===== */

  body.testing .side { padding: 6px 8px !important; }

فالزاوية الثالثة في المثلث العلوي = ١٨٠ − (٤٥ + ٧٠)، وس مكمّلتها."],[23,1,2,"إنتاج الدانتيل = نسبته من الرسم × ٤٠٠٠."],[24,1,2,"ساوِ الضلعين المتقابلين: ٤ص + ٨ = ٢٠س − ١٦ مع ص = س²، واختر الحل الذي يجعل ص فرديًا، ثم المحيط = ٢(الطول + العرض)."],[25,1,1,"٢^٢٠١٣ = ٢^٢٠١٢ × ٢^١، فقارن الطرفين."],[26,1,1,"اجمع حسب المنازل: الملايين ٦، مئات الألوف ٥، عشرات الألوف ٢، الألوف ٣، المئات ٦، العشرات ٤، الآحاد ٧."],[27,1,0,"احسب الطرف الأيمن: ٤ ÷ (½ × ٩) = ٨ ÷ ٩، إذن س^٥ = ٣٦ × ٨ ÷ ٩ = ٣٢."],[28,1,3,"الأسهم تدل على توازي الضلعين فقط، والتوازي وحده لا يضمن تساوي طوليهما."],[29,1,0,"زاوية القاعدة قائمة، فالمثلث قائم وس = ٩٠ − ٤٠."],[30,1,0,"احسب كل قيمة بترتيب العمليات (الضرب قبل الجمع والطرح): ص = ٤٠ + ٤، س = ١٠ − ١٥."],[31,1,2,"فك الأقواس: (س + ص)² − ٢س ص = س² + ص²، و(س − ص)² + ٢س ص = س² + ص²."],[32,1,1,"ابحث عن أكبر عدد أولي بين ٥٠ و٦٤ (٦٣ = ٧ × ٩ ليس أوليًا)."],[33,1,1,"إذا كان الصفر هو الأكبر فكل الأعداد الأخرى أصغر من الصفر."],[34,1,1,"ثمن القطع الصغيرة = ٥ × ١٠، والباقي من ٢٠٠ يُقسم على ١٥."],[35,1,3,"لكل طالب عمودان؛ ابحث عن الطالب الذي عموداه هما الأعلى معًا."],[36,1,1,"١ كلم = ١٠٠٠ م، فالطول = ٨٠٠٠ م تقريبًا؛ اختر أقرب خيار."],[37,1,2,"العدد المكتوب على صورة ٣ن يقبل القسمة على ٣: اجمع أرقام كل خيار."],[38,1,1,"البعدان: الطول + العرض = ١٠ والطول × العرض = ٢٤، والطول يساوي ٣ أقطار."],[39,1,3,"الفروق: ٢، ٤، ٨، ١٦ تتضاعف، فالفرق التالي ٣٢."],[40,1,2,"المستطيل يتحدد باختيار خطين رأسيين من ٦ خطوط: ٥ + ٤ + ٣ + ٢ + ١."],[41,1,2,"قارن مربع أطول ضلع (٤²) بمجموع مربعي الضلعين الآخرين (٢² + ٣²)."],[42,1,1,"ربّع الطرفين: س + ٣٢ = ٨١."],[43,1,1,"قسّم ١٢٠ على ٩، وأي باقٍ يحتاج صندوقًا إضافيًا."],[44,1,0,"خاصية التجميع: (٣٣ + س) + ٥٦ = (٣٣ + ٥٦) + س، فقارن الطرفين."],[45,1,1,"ابحث عن صورة (أ + ب)² = أ² + ٢أب + ب²، حيث √ص هو الجذر: (٣√ص + ١)²."],[46,1,2,"الأحد إلى الخميس ٥ أيام × ٨ ساعات، أضف ساعات السبت."],[47,1,2,"√٢٠ = ٢√٥، فالمجموع = ٢√٥ + √٥."],[48,1,1,"٠٫٣ ÷ ٠٫٠٣ = ١٠، و٠٫٠٣ ÷ ٠٫٣ = ٠٫١."],[49,1,3,"الكسور لها نفس المقام: (٢ + ٥ + ٥) ÷ س = ١٢ ÷ ٥."],[50,1,1,"كل ورقة = ربعا دائرة نص 75,2,2,"الباقي من قسمة ٣٢ على ١٢."],[76,2,0,"الحدود ٣١ إلى ٣٥ مشتركة، فقارن ٣٠ ÷ ٤ بـ ٣٦ ÷ ٦."],[77,2,1,"سعر البيع = ٩٠ × ١٫٥، وبعد الخصم ٧٠٪ منه، ثم الربح ÷ ٩٠."],[78,2,3,"مجموع العددين ثابت لكن حاصل ضربهما يتغير حسب قيمتيهما (جرّب ٦ و٦ ثم ١ و١١)."],[79,2,3,"عدّ المربعات الصغيرة (٤ + ٣ + ٢ + ١)، ثم المربعات ٢ × ٢ الممكنة داخل الدرج."],[80,2,0,"ابحث عن العمود الذي تتقارب أرقامه في الفصول الأربعة."],[81,2,2,"أ + ب + ج + د = ٨ × ٤، اطرح أ + ب لتحصل على ج + د."],[82,2,1,"كل جزء ٧٢ موقفًا بلون واحد بالترتيب، فقسّم ٣٦٠ على ٧٢ لتعرف رقم الجزء."],[83,2,0,"عند تساوي المحيط تكون الدائرة أكبر الأشكال مساحة."],[84,2,3,"المدة من ٨:٠٥ إلى ١١:٤٥، وجزء الساعة يُحسب ساعة كاملة."],[85,2,1,"العدد = ٣ × (١٠ ÷ ١٥)."],[86,2,1,"نصف المحيط = الطول + العرض = ٣ص + س، فاطرح العرض ٢ص."],[87,2,0,"حوّل إلى كسور غير عادية: ١٦/٣ × ٩/٤."],[88,2,2,"٣٠ سؤالًا تمثل ٦٠٪، فالكل = ٣٠ ÷ ٠٫٦، والباقي = الكل − ٣٠."],[89,2,1,"الربح = ٢٠٪ × ٤٠٠، ثم قارنه بـ ٩٠."],[90,2,1,"اجمع ١ + ٢ + ٣ + … حتى يصل المجموع إلى ٩١."],[91,2,3,"المثلث الكبير مكوّن من ٤ مثلثات متطابقة، والمظلل منها اثنان."],[92,2,1,"زاوية الانكسار بين متوازيين = (١٨٠ − ١١٠) + (١٨٠ − ١٢٠)، ثم ساوِها بـ ١٣س."],[93,2,0,"اقرأ قيم آخر ٣ أعمدة واقسم مجموعها على ٣."],[94,2,2,"الكيلوجرام = ١٠٠٠ جرام، فحوّل إحدى القيمتين إلى وحدة الأخرى."],[95,2,1,"أقل من ٨ تعني الدرجات ٥ و٦ و٧ فقط؛ اجمع أعداد طلابها."],[96,2,2,"أ³ = ٨، ب² = ٤، ج = ٨، والأعداد طبيعية."],[97,2,3,"الشكل لا يحدد قياس الزاوية؛ لا يوجد ما يربطها بـ ٤٢."],[98,2,0,"الخط الداخلي يوازي الضلع الأيسر، فزاويته مع القاعدة = ١٨٠ − ١١٠، ثم ص = ١٨٠ − (٧٠ + ٥٠)."],[99,2,0,"عدّ المربعات التي يغطيها الشكل المظلل تقريبًا (كل مربع ١ سم²) وقارنها بـ ٨."],[100,2,0,"راتب خالد = ٨٠٠٠ × ١٫٢٥، ثم قارنه بـ ٩٨٠٠."],[101,2,2,"بقي ٧/٨ الكتب، فـ ٧/٨ العدد + ١٠ = ٥٢."],[102,2,1,"أكبر قيمة للكسر = أكبر بسط ÷ أصغر مقام = ١٢٩٦ ÷ ٢٤."],[103,2,1,"فك الأقواس في كل خيار وتحقق: هل يتساوى الطرفان دائمًا؟"],[104,2,3,"الأعداد: ن، ن + ١، …، ن + ٥، ومجموعها ٦ن + ١٥ = ٨٧."],[105,2,0,"مجموع القيم = المتوسط × العدد = ٢٠ × ٤، اطرح منه ١   // ===== مجلد الأخطاء =====
  function errorsView() {
    var E = get(K.err, {}) || {}, arr = Object.keys(E).map(function (k) { return E[k]; }).filter(function (e) { return BY[e.id]; }).sort(function (a, b) { return new Date(b.date) - new Date(a.date); });
    var h = '<div class="card"><div class="row" style="justify-content:space-between"><div><h2>📖 مجلد الأخطاء (' + AR(arr.length) + ')</h2><p class="m">يخرج السؤال من المجلد بعد أن تجيبه صحيحًا ٣ مرات.</p></div><div class="row"><button class="btn" data-a="errtrain"' + (arr.length ? '' : ' disabled') + '>🔁 اختبار الأخطاء</button><button class="btn ghost" data-a="home">رجوع</button></div></div></div>';
    h += '<div class="card">' + (arr.map(function (e) { var q = BY[e.id]; return '<div class="rv"><img src="' + img(e.id) + '" alt="" loading="lazy" data-z="' + e.id + '"><div><div class="ans">' + (e.sel != null ? 'إجابتك: <b style="color:#b4321f">' + L[e.sel] + '</b> · ' : 'لم تُجب · ') + 'الصحيحة: <b style="color:#17633f">' + L[q.c] + '</b></div>' + (e.ok ? '<div class="m" style="color:#17633f">✓ أجبته صحيحًا ' + (e.ok === 1 ? 'مرة' : 'مرتين') + ' من ٣</div>' : '') + '<div class="m">' + esc(MN[q.m] || '') + '</div><button class="btn red sm" style="margin-top:8px" data-del="' + e.id + '">حذف من المجلد</button></div></div>'; }).join('') || '<p class="m">المجلد فارغ. أحسنت!</p>') + '</div>';
    app.innerHTML = h; window.scrollTo(0, 0);
  }

  // ===== لوحة الأسئلة على الجوال =====
  function openMap() {
    var side = app.querySelector('.side'); if (!side) return;
    var d = document.createElement('div'); d.className = 'dlg mapdlg';
    d.innerHTML = '<div><div class="row" style="justify-content:space-between;margin-bottom:8px"><h3 style="margin:0">خريطة الأسئلة</h3><button type="button" class="btn ghost sm" data-x>إغلاق</button></div>' + side.querySelector('.grid').outerHTML + side.querySelector('.legend').outerHTML + '<div class="row" style="margin-top:12px"><button type="button" class="btn red sm" data-end>تسليم الاختبار</button></div></div>';
    d.onclick = function (e) {
      var g = e.target.closest('[data-g]'); if (g) { d.remove(); R.pos = +g.getAttribute('data-g'); save(); return draw(); }
      if (e.target === d || e.target.closest('[data-x]')) return d.remove();
      if (e.target.closest('[data-end]')) { d.remove(); confirmEnd(); }
    };
    document.body.appendChild(d);
  }
  // ===== تكبير الصورة =====
  function zoom(id) { var d = document.createElement('div'); d.className = 'lb'; d.innerHTML = '<img src="' + img(id) + '" alt="">'; d.onclick = function () { d.remove(); }; document.body.appendChild(d); }

  // ===== الأحداث =====
  app.addEventListener('click', function (e) {
    var z = e.target.closest('[data-z]'); if (z) return zoom(z.getAttribute('data-z'));
    var b = e.target.closest('button'); if (!b || b.disabled) return;
    var d = b.dataset;
    if (d.n) { pref.n = +d.n; put(K.pref, pref); [].forEach.call(b.parentNode.children, function (x) { x.classList.toggle('on', x === b); }); return est(); }
    if (d.m) { pref.mode = d.m; if (d.m === 'sim' && !pref.per) pref.per = 60; put(K.pref, pref); return home(); }
    if (d.p !== undefined) { pref.per = +d.p; put(K.pref, pref); [].forEach.call(b.parentNode.children, function (x) { x.classList.toggle('on', x === b); }); return est(); }
    if (d.o !== undefined) return answer(+d.o);
    if (d.g !== undefined) { R.pos = +d.g; save(); return draw(); }
    if (d.mdl) { var M = MODELS[+d.mdl - 1]; if (M) start(M.ids.slice(), { kind: 'model', model: M.id }); return; }
    if (d.rf) return report(lastRes, d.rf);
    if (d.del) { var E = get(K.err, {}) || {}; delete E[d.del]; put(K.err, E); return errorsView(); }
    switch (d.a) {
      case 'start': var p = pick(pref.n); return start(p.ids, { newRound: p.newRound });
      case 'resume': return resume();
      case 'drop': clearRun(); return home();
      case 'reset': if (confirm('سيعود كل البنك لقائمة «لم تُحل». سجل محاولاتك ومجلد الأخطاء يبقيان. متأكد؟')) { put(K.seen, { round: 1, ids: [] }); home(); } return;
      case 'errs': return errorsView();
      case 'errtrain': var ids = shuffle(Object.keys(get(K.err, {}) || {}).map(Number).filter(function (i) { return BY[i]; })).slice(0, 55); if (ids.length) start(ids, { mode: 'train', per: 0, kind: 'errors' }); return;
      case 'home': return home();
      case 'retry': var w = R.ids.filter(function (id, i) { return R.ans[i] !== BY[id].c; }); return start(shuffle(w), { mode: 'train', per: 0, kind: 'errors' });
      case 'prev': if (R.pos) { R.pos--; save(); draw(); } return;
      case 'next': if (R.pos < R.ids.length - 1) { R.pos++; save(); draw(); } return;
      case 'hint': (function () { var q = BY[R.ids[R.pos]]; if (!q || !q.h) return; var d = document.createElement('div'); d.className = 'dlg'; d.innerHTML = '<div><h3>💡 إرشاد</h3><p style="line-height:2;white-space:pre-line">' + esc(q.h) + '</p><button type="button" class="btn" style="width:100%">حسنًا</button></div>'; d.onclick = function (e) { if (e.target === d || e.target.tagName === 'BUTTON') d.remove(); }; document.body.appendChild(d); })(); return;
      case 'flag': if (R.flag[R.pos]) delete R.flag[R.pos]; else R.flag[R.pos] = 1; save(); return draw();
      case 'end': return confirmEnd();
      case 'tolist': if (R.total && !R.paused) R.paused = Math.max(1, left()); save(); stopTimer(); document.body.classList.remove('testing'); R = null; home(); window.scrollTo(0, 0); return;
      case 'map': return openMap();
      case 'pause':
        if (R.paused) { R.t0 = Date.now() - (R.total - R.paused) * 1000; delete R.paused; startTimer(); }
        else { R.paused = left(); stopTimer(); timerEl.classList.remove('hidden'); timerEl.textContent = '⏸ ' + fmt(R.paused); }
        save(); return draw();
    }
  });
  document.addEventListener('keydown', function (e) {
    if (!R || R.done || document.querySelector('.dlg,.lb')) { if (e.key === 'Escape') { var o = document.querySelector('.lb,.dlg'); if (o) o.remove(); } return; }
    if (/^(INPUT|TEXTAREA|SELECT)$/.test((e.target || {}).tagName || '')) return;
    var k = e.key, m = { '1': 0, '2': 1, '3': 2, '4': 3, '١': 0, '٢': 1, '٣': 2, '٤': 3, 'أ': 0, 'ب': 1, 'ج': 2, 'د': 3, 'a': 0, 'b': 1, 'c': 2, 'd': 3 };
    if (m[k] !== undefined) { e.preventDefault(); return answer(m[k]); }
    if (k === 'ArrowLeft') { e.preventDefault(); if (R.pos < R.ids.length - 1) { R.pos++; save(); draw(); } }
    else if (k === 'ArrowRight') { e.preventDefault(); if (R.pos) { R.pos--; save(); draw(); } }
    else if (k === 'f' || k === 'F') { if (R.flag[R.pos]) delete R.flag[R.pos]; else R.flag[R.pos] = 1; save(); draw(); }
  });
  addEventListener('beforeunload', function (e) { if (R && !R.done) { save(); } });
  // يكمل المؤقت من حيث كان عند العودة للصفحة
  var r0 = get(K.run, null);
  if (r0 && r0.ids && !r0.done && r0.total && !r0.paused && Date.now() - r0.t0 >= r0.total * 1000) { R = r0; finish(true); }
  else {
    home();
    // فتح نموذج مباشرة من «خطتي»: namazej mohawsab 2026.html#model=3
    var mh = /^#model=(\d+)$/.exec(location.hash), M0 = mh ? MODELS[+mh[1] - 1] : null;
    if (M0) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { } start(M0.ids.slice(), { kind: 'model', model: M0.id }); }
  }
})();
</script>
