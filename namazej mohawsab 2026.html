  <link rel="stylesheet" href="bw-theme.css">
  <style>
    /* ألوان وخطوط المنصة (تعمل حتى لو فُتحت الصفحة وحدها من الجهاز) */
    :root { --bw-night: #0c2440; --bw-navy: #12345a; --bw-sea: #1d5c8f; --bw-gold: #e3a92b; --bw-gold-soft: #fbefd2; --bw-paper: #f5f8fb; --bw-line: #dbe5ee; }
    body { margin: 0; font-family: "IBM Plex Sans Arabic", Tahoma, Arial, sans-serif; background: var(--bw-paper); }

    #timer { background: var(--bw-gold); color: var(--bw-night); }
    #timer.urgent { background: #fbe6e2; color: #c2412f; }
    @media (max-width: 700px) { #bw-shell .bws-brand b, #bw-shell .bws-title { display: none; } #bw-shell .bws-back { font-size: 0; padding: 7px 10px; line-height: 1; } #bw-shell .bws-back::before { content: "☰"; font-size: 18px; } }

    #timer { display: inline-block; font: 700 16px "Readex Pro", sans-serif; border-radius: 10px; padding: 6px 14px; min-width: 70px; text-align: center; direction: ltr; }
    .card { background: #fff; border: 1px solid var(--bw-line); border-radius: 20px; padding: 22px; margin-bottom: 16px; }

    .btn:disabled { opacity: .45; cursor: default; }
    .btn.gold { background: var(--bw-gold); color: var(--bw-night); }
    .btn.soft { background: #eaf2f9; color: var(--bw-navy); }
    .btn.ghost { background: #fff; color: var(--bw-navy); box-shadow: inset 0 0 0 1.5px var(--bw-line); }
    .btn.red { background: #fbe6e2; color: #b4321f; }
    .btn.sm { padding: 7px 12px; font-size: 13.5px; border-radius: 10px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    /* الواجهة */
    .hero { background: var(--bw-night) radial-gradient(circle at 1.5px 1.5px, #ffffff12 1.5px, transparent 0) 0 0 / 26px 26px; color: #fff; border-radius: 22px; padding: 26px; margin-bottom: 16px; box-shadow: -8px 8px 0 var(--bw-gold); }
    .hero .tag { display: inline-block; background: var(--bw-gold); color: var(--bw-night); font-weight: 700; font-size: 13px; border-radius: 99px; padding: 2px 12px; }
    .hero h1 { margin: 10px 0 6px; font-size: clamp(26px, 4vw, 38px); line-height: 1.3; }
    .hero p { margin: 0; color: #c3d3e4; }
    .bank { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; margin-top: 18px; background: #ffffff12; border-radius: 16px; padding: 14px 16px; }
    .bank b { font-family: "Readex Pro", sans-serif; font-size: 26px; color: var(--bw-gold); }
    .bank .track { height: 10px; background: #ffffff26; border-radius: 99px; overflow: hidden; }

    .chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip { font: 600 15px "IBM Plex Sans Arabic", Tahoma, sans-serif; border: 1.5px solid var(--bw-line); background: #fff; color: #142338; border-radius: 14px; padding: 10px 16px; cursor: pointer; min-width: 64px; text-align: center; }
    .chip small { display: block; font-size: 12px; color: #5a6b80; font-weight: 500; }
    .chip.on { background: var(--bw-navy); border-color: var(--bw-navy); color: #fff; }
    .chip.on small { color: #c3d3e4; }
    .build { display: grid; grid-template-columns: 1fr 1fr 1.3fr; gap: 14px; margin-top: 12px; }
    .opt-g { background: var(--bw-paper); border: 1px solid var(--bw-line); border-radius: 16px; padding: 14px; }

    .resume { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--bw-gold-soft); color: #6b4a00; border-radius: 16px; padding: 12px 16px; margin-bottom: 16px; font-weight: 600; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    /* الاختبار */
    .qwrap { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 16px; align-items: start; }
    .qhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; color: #5a6b80; font-weight: 600; font-size: 14.5px; margin-bottom: 8px; }
    .qhead .mode { background: #eaf2f9; color: var(--bw-navy); border-radius: 99px; padding: 2px 10px; font-size: 12.5px; }
    .qtrack { height: 6px; background: #e3ebf3; border-radius: 99px; overflow: hidden; margin-bottom: 14px; }
    .qtrack i { display: block; height: 100%; background: linear-gradient(90deg, var(--bw-sea), var(--bw-gold)); border-radius: 99px; transition: width .2s; }
    .qimg { position: relative; background: #fff; border-radius: 14px; overflow: hidden; cursor: zoom-in; min-height: 120px; }
    .qimg img { display: block; width: 100%; height: auto; }
    .qimg .zoom { position: absolute; bottom: 10px; left: 10px; background: #0c2440cc; color: #fff; font-size: 12.5px; border-radius: 99px; padding: 3px 10px; pointer-events: none; }
    .opts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 14px; }
    .opt { font: 700 22px "Readex Pro", sans-serif; border: 2px solid var(--bw-line); background: #fff; color: var(--bw-navy); border-radius: 14px; padding: 12px 0; cursor: pointer; }
    .opt:hover { border-color: var(--bw-sea); }
    .opt.on { background: var(--bw-navy); border-color: var(--bw-navy); color: #fff; }
    .opt.ok { background: #e1f4ea; border-color: #1d8a58; color: #17633f; }
    .opt.no { background: #fbe6e2; border-color: #c2412f; color: #b4321f; }
    .fb { margin-top: 12px; border-radius: 12px; padding: 10px 14px; font-weight: 600; }
    .fb.ok { background: #e1f4ea; color: #17633f; } .fb.no { background: #fbe6e2; color: #b4321f; }
    .qnav { display: flex; gap: 8px; justify-content: space-between; margin-top: 14px; flex-wrap: wrap; }
    .side h3 { margin: 0 0 10px; font-size: 16px; color: var(--bw-navy); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(36px, 1fr)); gap: 6px; }
    .grid button { height: 36px; border-radius: 10px; border: 1.5px solid var(--bw-line); background: #fff; font: 600 13px "IBM Plex Sans Arabic", sans-serif; color: #5a6b80; cursor: pointer; position: relative; }
    .grid button.a { background: #eaf2f9; border-color: #c3d6e8; color: var(--bw-navy); }
    .grid button.f::after { content: ""; position: absolute; top: 3px; left: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--bw-gold); }
    .grid button.c { box-shadow: 0 0 0 2px var(--bw-navy); }
    .grid button.ok { background: #e1f4ea; border-color: #9fd6b9; color: #17633f; } .grid button.no { background: #fbe6e2; border-color: #f0b9ae; color: #b4321f; }
    .legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; font-size: 12.5px; color: #5a6b80; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 4px; vertical-align: middle; }
    .keys { margin-top: 12px; font-size: 12.5px; color: #8494a8; line-height: 1.8; }
    .flagbtn.on { background: var(--bw-gold); color: var(--bw-night); box-shadow: none; }
    /* النتيجة */
    .res { background: var(--bw-night); color: #fff; border-radius: 22px; padding: 24px; margin-bottom: 16px; box-shadow: -8px 8px 0 var(--bw-gold); }
    .res small { color: var(--bw-gold); font-weight: 600; }
    .res h2 { margin: 2px 0 4px; font-size: clamp(28px, 4vw, 40px); font-family: "Readex Pro", sans-serif; }
    .res p { margin: 0; color: #c3d3e4; }
    .kp { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 16px; border-top: 1px solid #ffffff26; }
    .kp div { padding-top: 12px; }
    .kp b { display: block; font-family: "Readex Pro", sans-serif; font-size: 24px; }
    .kp span { color: #c3d3e4; font-size: 13.5px; }
    .advice { margin: 0; padding-inline-start: 20px; line-height: 1.9; }
    .rv { border-top: 1px solid #eef3f8; padding: 14px 0; display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 14px; align-items: center; }
    .rv img { width: 100%; border-radius: 10px; border: 1px solid var(--bw-line); cursor: zoom-in; display: block; }
    .rv .st { font-weight: 700; } .rv .st.ok { color: #17633f; } .rv .st.no { color: #b4321f; } .rv .st.na { color: #8a5a00; }
    .rv .ans { margin-top: 4px; font-size: 14.5px; }
    .hist { display: flex; align-items: flex-end; gap: 8px; height: 140px; border-bottom: 1px solid var(--bw-line); padding-top: 8px; }
    .hist div { flex: 1; max-width: 44px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; height: 100%; font-size: 12px; color: #5a6b80; }
    .hist i { display: block; width: 100%; background: var(--bw-navy); border-radius: 8px 8px 0 0; min-height: 4px; }
    .hist div:last-child i { background: var(--bw-gold); }
    .tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
    .tbl td, .tbl th { padding: 8px 6px; border-bottom: 1px solid #eef3f8; text-align: start; }
    .tbl th { color: #5a6b80; font-weight: 600; }
    /* تكبير الصورة */
    .lb { position: fixed; inset: 0; z-index: 2147483400; background: #0c2440ee; display: grid; place-items: center; padding: 16px; cursor: zoom-out; }
    .lb img { max-width: 100%; max-height: 92vh; border-radius: 12px; background: #fff; }
    .dlg { position: fixed; inset: 0; z-index: 2147483300; background: #0c244099; display: grid; place-items: center; padding: 16px; }
    .dlg > div { background: #fff; border-radius: 18px; padding: 22px; width: min(420px, 100%); border-top: 4px solid var(--bw-gold); }
    .dlg h3 { margin: 0 0 8px; color: var(--bw-navy); }
    .dlg p { margin: 0 0 14px; color: #3b4b60; }
    @media (max-width: 900px) {
      .qwrap { grid-template-columns: 1fr; }
      .side { order: 2; }
      .rv { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      .mw { margin-top: 16px; }
      .card, .hero, .res { padding: 16px; }
      .two { grid-template-columns: 1fr; }
      .kp { grid-template-columns: 1fr 1fr; }
      .opt { font-size: 20px; padding: 10px 0; }
      .qnav .btn { flex: 1; }
      .qimg .zoom { top: 6px; bottom: auto; left: 6px; font-size: 11px; padding: 2px 8px; opacity: .85; }
      .keys { display: none; }
    }
  .qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.qhead .qans{flex:1;font-size:13.5px;color:#42566c;font-weight:600;text-align:center}.qsub{padding:5px 14px!important;font-size:13px!important}

/* ===== الجوال: كل الاختبار في شاشة واحدة ===== */

  body.testing .side { padding: 6px 8px !important; }

فالزاوية الثالثة في المثلث العلوي = ١٨٠ − (٤٥ + ٧٠)، وس مكمّلتها."],[23,1,2,"إنتاج الدانتيل = نسبته من الرسم × ٤٠٠٠."],[24,1,2,"ساوِ الضلعين المتقابلين: ٤ص + ٨ = ٢٠س − ١٦ مع ص = س²، واختر الحل الذي يجعل ص فرديًا، ثم المحيط = ٢(الطول + العرض)."],[25,1,1,"٢^٢٠١٣ = ٢^٢٠١٢ × ٢^١، فقارن الطرفين."],[26,1,1,"اجمع حسب المنازل: الملايين ٦، مئات الألوف ٥، عشرات الألوف ٢، الألوف ٣، المئات ٦، العشرات ٤، الآحاد ٧."],[27,1,0,"احسب الطرف الأيمن: ٤ ÷ (½ × ٩) = ٨ ÷ ٩، إذن س^٥ = ٣٦ × ٨ ÷ ٩ = ٣٢."],[28,1,3,"الأسهم تدل على توازي الضلعين فقط، والتوازي وحده لا يضمن تساوي طوليهما."],[29,1,0,"زاوية القاعدة قائمة، فالمثلث قائم وس = ٩٠ − ٤٠."],[30,1,0,"احسب كل قيمة بترتيب العمليات (الضرب قبل الجمع والطرح): ص = ٤٠ + ٤، س = ١٠ − ١٥."],[31,1,2,"فك الأقواس: (س + ص)² − ٢س ص = س² + ص²، و(س − ص)² + ٢س ص = س² + ص²."],[32,1,1,"ابحث عن أكبر عدد أولي بين ٥٠ و٦٤ (٦٣ = ٧ × ٩ ليس أوليًا)."],[33,1,1,"إذا كان الصفر هو الأكبر فكل الأعداد الأخرى أصغر من الصفر."],[34,1,1,"ثمن القطع الصغيرة = ٥ × ١٠، والباقي من ٢٠٠ يُقسم على ١٥."],[35,1,3,"لكل طالب عمودان؛ ابحث عن الطالب الذي عموداه هما الأعلى معًا."],[36,1,1,"١ كلم = ١٠٠٠ م، فالطول = ٨٠٠٠ م تقريبًا؛ اختر أقرب خيار."],[37,1,2,"العدد المكتوب على صورة ٣ن يقبل القسمة على ٣: اجمع أرقام كل خيار."],[38,1,1,"البعدان: الطول + العرض = ١٠ والطول × العرض = ٢٤، والطول يساوي ٣ أقطار."],[39,1,3,"الفروق: ٢، ٤، ٨، ١٦ تتضاعف، فالفرق التالي ٣٢."],[40,1,2,"المستطيل يتحدد باختيار خطين رأسيين من ٦ خطوط: ٥ + ٤ + ٣ + ٢ + ١."],[41,1,2,"قارن مربع أطول ضلع (٤²) بمجموع مربعي الضلعين الآخرين (٢² + ٣²)."],[42,1,1,"ربّع الطرفين: س + ٣٢ = ٨١."],[43,1,1,"قسّم ١٢٠ على ٩، وأي باقٍ يحتاج صندوقًا إضافيًا."],[44,1,0,"خاصية التجميع: (٣٣ + س) + ٥٦ = (٣٣ + ٥٦) + س، فقارن الطرفين."],[45,1,1,"ابحث عن صورة (أ + ب)² = أ² + ٢أب + ب²، حيث √ص هو الجذر: (٣√ص + ١)²."],[46,1,2,"الأحد إلى الخميس ٥ أيام × ٨ ساعات، أضف ساعات السبت."],[47,1,2,"√٢٠ = ٢√٥، فالمجموع = ٢√٥ + √٥."],[48,1,1,"٠٫٣ ÷ ٠٫٠٣ = ١٠، و٠٫٠٣ ÷ ٠٫٣ = ٠٫١."],[49,1,3,"الكسور لها نفس المقام: (٢ + ٥ + ٥) ÷ س = ١٢ ÷ ٥."],[50,1,1,"كل ورقة = ربعا دائرة نص 75,2,2,"الباقي من قسمة ٣٢ على ١٢."],[76,2,0,"الحدود ٣١ إلى ٣٥ مشتركة، فقارن ٣٠ ÷ ٤ بـ ٣٦ ÷ ٦."],[77,2,1,"سعر البيع = ٩٠ × ١٫٥، وبعد الخصم ٧٠٪ منه، ثم الربح ÷ ٩٠."],[78,2,3,"مجموع العددين ثابت لكن حاصل ضربهما يتغير حسب قيمتيهما (جرّب ٦ و٦ ثم ١ و١١)."],[79,2,3,"عدّ المربعات الصغيرة (٤ + ٣ + ٢ + ١)، ثم المربعات ٢ × ٢ الممكنة داخل الدرج."],[80,2,0,"ابحث عن العمود الذي تتقارب أرقامه في الفصول الأربعة."],[81,2,2,"أ + ب + ج + د = ٨ × ٤، اطرح أ + ب لتحصل على ج + د."],[82,2,1,"كل جزء ٧٢ موقفًا بلون واحد بالترتيب، فقسّم ٣٦٠ على ٧٢ لتعرف رقم الجزء."],[83,2,0,"عند تساوي المحيط تكون الدائرة أكبر الأشكال مساحة."],[84,2,3,"المدة من ٨:٠٥ إلى ١١:٤٥، وجزء الساعة يُحسب ساعة كاملة."],[85,2,1,"العدد = ٣ × (١٠ ÷ ١٥)."],[86,2,1,"نصف المحيط = الطول + العرض = ٣ص + س، فاطرح العرض ٢ص."],[87,2,0,"حوّل إلى كسور غير عادية: ١٦/٣ × ٩/٤."],[88,2,2,"٣٠ سؤالًا تمثل ٦٠٪، فالكل = ٣٠ ÷ ٠٫٦، والباقي = الكل − ٣٠."],[89,2,1,"الربح = ٢٠٪ × ٤٠٠، ثم قارنه بـ ٩٠."],[90,2,1,"اجمع ١ + ٢ + ٣ + … حتى يصل المجموع إلى ٩١."],[91,2,3,"المثلث الكبير مكوّن من ٤ مثلثات متطابقة، والمظلل منها اثنان."],[92,2,1,"زاوية الانكسار بين متوازيين = (١٨٠ − ١١٠) + (١٨٠ − ١٢٠)، ثم ساوِها بـ ١٣س."],[93,2,0,"اقرأ قيم آخر ٣ أعمدة واقسم مجموعها على ٣."],[94,2,2,"الكيلوجرام = ١٠٠٠ جرام، فحوّل إحدى القيمتين إلى وحدة الأخرى."],[95,2,1,"أقل من ٨ تعني الدرجات ٥ و٦ و٧ فقط؛ اجمع أعداد طلابها."],[96,2,2,"أ³ = ٨، ب² = ٤، ج = ٨، والأعداد طبيعية."],[97,2,3,"الشكل لا يحدد قياس الزاوية؛ لا يوجد ما يربطها بـ ٤٢."],[98,2,0,"الخط الداخلي يوازي الضلع الأيسر، فزاويته مع القاعدة = ١٨٠ − ١١٠، ثم ص = ١٨٠ − (٧٠ + ٥٠)."],[99,2,0,"عدّ المربعات التي يغطيها الشكل المظلل تقريبًا (كل مربع ١ سم²) وقارنها بـ ٨."],[100,2,0,"راتب خالد = ٨٠٠٠ × ١٫٢٥، ثم قارنه بـ ٩٨٠٠."],[101,2,2,"بقي ٧/٨ الكتب، فـ ٧/٨ العدد + ١٠ = ٥٢."],[102,2,1,"أكبر قيمة للكسر = أكبر بسط ÷ أصغر مقام = ١٢٩٦ ÷ ٢٤."],[103,2,1,"فك الأقواس في كل خيار وتحقق: هل يتساوى الطرفان دائمًا؟"],[104,2,3,"الأعداد: ن، ن + ١، …، ن + ٥، ومجموعها ٦ن + ١٥ = ٨٧."],[105,2,0,"مجموع القيم = المتوسط × العدد = ٢٠ × ٤، اطرح منه ١ نصف، وعلي ربع ما أخذه أحمد؛ اطرحهما من ١٦."],[455,9,3,"إذا كانت النساء ١٠٠ فالرجال ١٥٥، فالنسبة = ١٥٥ : ١٠٠ ثم اختصر."],[456,9,1,"ربح القلم = ١ − ¼ = ¾ ريال، ثم اضرب في ٣٠٠."],[457,9,2,"المعين الواصل بين منتصفات الأضلاع مساحته نصف المربع، والمثلث الذي قاعدته ضلع المربع ورأسه على الضلع المقابل مساحته نصف المربع أيضًا."],[458,9,0,"الضرب أولًا: ٥ × ٤ = ٢٠، ثم الجمع."],[459,9,0,"البسطان متساويان، والمقام الأصغر يعطي الكسر الأكبر (٥² = ٢٥)."],[460,9,0,"٠٫٠٥س = ٠٫١ص، فس ÷ ص = ٠٫١ ÷ ٠٫٠٥."],[461,9,0,"√٩٩ أقل من ١٠، فمجموع الجذرين أقل من ٢٠."],[462,9,1,"فرق مربعين: (١٥ − ١٢)(١٥ + ١٢)."],[463,9,2,"ثلاثة أرباع ١⅓ = ¾ × ⁴⁄₃، وثلثا ١½ = ⅔ × ³⁄₂."],[464,9,0,"٦٦٦٦ ÷ ٢٢ = (٦٦٦٦ ÷ ٢) ÷ ١١ = ٣٣٣٣ ÷ ١١."],[465,9,2,"خذ ١٠٠^١٤ عاملًا مشتركًا: ١٠٠^١٤ × (١٠٠ − ١) ÷ ٩٩."],[466,9,1,"العدد = ٥ مجموعات × ٤ مسارات × ٥ طلاب."],[467,9,3,"المساحة = الطول × العرض = ١٣٥ × ٦٧."],[468,9,1,"اقرأ قيمتي ١٤٢٨ و١٤٢٩، ونسبة الزيادة = الزيادة ÷ قيمة ١٤٢٨."],[469,9,2,"الزاوية ١١٨ خارجية للمثلث الصغير، فتساوي مجموع الزاويتين الداخليتين البعيدتين: ٤٠ + س."],[470,9,3,"النوافذ = ٥ × ٤ × ٣."],[471,9,2,"قطر المستطيل = √(٣² + ٤²) = قطر الدائرة، والمحيط = ط × القطر."],[472,9,1,"الزاوية الثالثة في المثلث = ١٨٠ − (٥٥ + ٥٥)، وس مكمّلتها."],[473,9,0,"س² − ص² = (س − ص)(س + ص)، اختصر (س + ص) ثم وزّع س."],[474,9,2,"ابحث عن الشهر الذي أعمدته الثلاثة الأعلى مجتمعة."],[475,9,3,"الشكل رباعي غير منتظم، ومعرفة زاويتين فقط لا تحدد كل زاوية من الأخريين."],[476,9,2,"المقام ١ + ¼ = ⁵⁄₄، والكسر = ١ ÷ ⁵⁄₄."],[477,9,2,"النسبة = عدد الأوجه الحمراء ÷ ٦."],[478,9,1,"البسط يختصر مع المقام في الحد التالي، فيبقى ١ ÷ ١٠."],[479,9,0,"س = ½ فـ ١/س² = ٤؛ عوّض: (٢ ÷ ٤) × ٤."],[480,9,1,"المتبقي = ١٠ − ١ − ٧ قطع من ١٠."],[481,9,3,"بعد الإنتاج: ٤٠٠ + ¼ × ٤٠٠، ثم باع نصف هذا العدد."],[482,9,3,"المثلثات متشابهة: س ÷ ٩ = ٤ ÷ (٤ + ٦ + ٢)."],[483,9,3,"زاوية كل قطاع مظلل = ١٨٠ − ١٣٥ = ٤٥، فالمظلل = (٩٠ ÷ ٣٦٠) × ط × ٤²."],[484,9,2,"١٠ فضية + ذهبية = ٣ ذهبية، فـ ١٠ فضية = ٢ ذهبية، أي الذهبية = ٥ فضية."],[485,9,1,"بعد الزيادة ١١٠، ثم انقص ١٠٪ من ١١٠ (وليس م  = (١٠ + ٨) − ١٥."],[517,10,3,"احسب ٣٪ من المتقدمين في كل عام وقارنه بعدد المقبولين."],[518,10,3,"عدّ الأعمدة التي يتجاوز ارتفاعها ٧٥٠."],[519,10,0,"في المثلث أ ب ج زاوية ج = ٣٠، وزاوية د ب ج = ٩٠ − ٣٠ = ٦٠، فالمثلث ب د ج قائم في د، وب د ضلع يقابل ٣٠°."],[520,10,1,"٤ × ٤ × ٤ × ٤ × ٤ = ٤⁵، فقارن ٥⁴ بـ ٤⁵."],[521,10,2,"الطلاب الواقفون بين = ٣٠ − (١٠ + أحمد + خالد + ١٠)."],[522,10,3,"خذ ٤³ عاملًا مشتركًا: ٤³ + ٤⁴ = ٤³ × (١ + ٤)."],[523,10,0,"المظلل = مساحة المربع − المثلثين الأبيضين (كل منهما قائم بضلعين ١ و٢)."],[524,10,1,"الحروف ٨ (مركز قياس بدون مسافة)، والحرف الأول يوم الأربعاء، فالأخير بعد ٧ أيام منه."],[525,10,3,"حمل الرجل = ٢٤ ÷ ٢٠ = ١٫٢ طفل، فـ ١٥ رجلًا = ١٥ × ١٫٢ طفل."],[526,10,0,"الفرق ١٢ = جزءان، فالجزء ٦ والعدد الأكبر ٥ أجزاء."],[527,10,0,"الأولى = (١/٥) ÷ (١/٦) = ٦/٥، والثانية مقلوبها ٥/٦."],[528,10,2,"الفروق تتبادل: ٤، ٢، ٢، ٦…؛ أو لاحظ أن كل حد = مجموع الحدين السابقين − ١."],[529,10,2,"اقرأ أعلى نقطة على الخط."],[530,10,0,"نق الكبرى = نصف قطر المربع = ١٠√٢، ونق الصغرى = ١٠؛ المظلل = ط(١٠√٢)² − ط(١٠)²."],[531,10,0,"(√٢^√٢)^√٢ = √٢^(√٢ × √٢) = √٢²."],[532,10,1,"فهد س ومحمد ٢س + ٥، ومجموعهما ١٧."],[533,10,2,"بما أن السعر ينقص كل عام ٥٪، فاضرب في ٠٫٩٥ كل سنة حتى تصل إلى ٥١٤٤٢٥."],[534,10,0,"ضلع المعين = √(٥² + ٤²)، والمحيط = ٤ × الضلع؛ ضلع المربع = ٢٠ ÷ ٤ ومساحته الضلع²."],[535,10,3,"اقرأ الأطوال تحت الأعمدة واختر أصغرها."],[536,10,1,"الكسور تختصر تتابعيًا: الأولى = ١ ÷ ٤، والثانية = ٢ ÷ ٧."],[537,10,0,"١٢ تمثل ٣٠٪ من العدد، فالعدد = ١٢ ÷ ٠٫٣."],[538,10,1,"الصندوق الكبير = ٢٤ ÷ ٢٠ = ١٫٢ صغير، والمساحة المتبقية = ٥ صناديق كبيرة × ١٫٢."],[539,10,2,"محيط الشكل المدرّج = محيط المستطيل المحيط به: ٢ × ((٦ + ٥) + ٧)."],[540,10,2,"٢١٠٠ تمثل ٧٠٪ من السعر الأصلي، فالسعر = ٢١٠٠ ÷ ٠٫٧."],[541,10,3,"كل من س وص أصغر من ع، لكن لا علاقة بين س وص نفسيهما."],[542,10,1,"غير البيضاء = ٤ + ٣ من أصل ١٢."],[543,10,2,"٥³ − ٣³ = ١٢٥ − ٢٧، ثم اقسم على ٤٩."],[544,10,2,"هـ ج نصف ب ج، فالمثلث أ هـ ج ربع متوازي الأضلاع (نصف قاعدة وارتفاع نفسه، ثم نصف)."],[545,10,3,"ابحث عن أعلى نقطة على ],[1203,22,0,"المركز منتصف (١،٠) و(٥،٠)، ونصف القطر ٢، وأ أعلى نقطة فوق المركز."],[1204,22,1,"القوارير تحتاج ١٢ × ١٫٢٥ = ١٥ جالونًا، وكل جالون ٤ كجم."],[1205,22,1,"العدد العلوي يساوي حاصل ضرب العددين السفليين مضافًا إليه عدد يزيد ١ كل شكل: ١ × ٢ + ٨، ٣ × ٤ + ٩، ثم ٥ × ٦ + ؟"],[1206,22,2,"اجمع الأسس: س + ص = ١٤."],[1207,22,3,"ابحث عن المادة التي يكون فيها عمود الإناث أعلى من الذكور."],[1208,22,1,"قطر الكبيرة = ٦ × ٢ = ١٢، وقطر كل صغيرة ١٢ ÷ ٤ = ٣؛ اجمع المحيطات الأربعة."],[1209,22,2,"أصغر س تحقق ذلك: س + ٢ = ٧ أي س = ٥؛ عوّض في ٢س − ٣."],[1210,22,1,"قطر الدائرة = قطر المستطيل = √(٤² + ٣²)."],[1211,23,3,"زاوية الصف السادس ٢٠°، فكل درجة = طالب واحد؛ حوّل زاويتي الأول والثالث إلى طلاب واحسب متوسطهما."],[1212,23,0,"الزاويتان المتقابلتان بالرأس ١٠٠ والمثلث متساوي الساقين، فكل زاوية قاعدة = (١٨٠ − ١٠٠) ÷ ٢."],[1213,23,0,"|(−٣)³| = ٢٧، وقارنه بـ −٢٧."],[1214,23,1,"قطر المربع = ٢√٢ ≈ ٢٫٨٣."],[1215,23,1,"٩^س = س⁶، جرّب س = ٣: ٩³ = ٣⁶."],[1216,23,1,"العددان ن ون + ٢، والفرق ٢، فالمجموع = ٢ × ٢."],[1217,23,2,"اجمع أسس العدد ٢ أولًا: ٢^-٢ × ٢^-٤ = ٢^-٦، ثم اضرب في ٥^-٢."],[1218,23,0,"عدد المسارات = (مسارات أ ← ب) × (مسارات ب ← ج)، أي ٤ × ن = ٢٠."],[1219,23,0,"المجموع س + ٢٥/س يكون أصغر ما يمكن عندما يتساوى الحدان: س = ٢٥/س."],[1220,23,0,"√٥ ≈ ٢٫٢٤، فاطرحه من ٣ وقارن الناتج بـ ١."],[1221,23,1,"المخرج = المدخل² + ١؛ طبّقها على ٦."],[1222,23,1,"شبه المنحرف مقسوم إلى مثلثات متساوية، كل منها قاعدته ٥ وارتفاعه ٣؛ عدّها واضرب."],[1223,23,3,"الشكل لا يوضح أن الضلعين العلوي والسفلي متوازيان، فلا يمكن الجزم بتساوي المثلثين."],[1224,23,1,"ثمن الثوب = ٤٢٠ ÷ ٣، والأثواب الثلاثة الإضافية بنصف الثمن."],[1225,23,1,"للكرة السوداء ٥ أماكن، وتكون بين كرتين حمراوين في كل الأماكن ما عدا الطرفين."],[1226,23,1,"احسب الواردات ÷ الصادرات لكل سنة واختر الأكبر."],[1227,23,3,"وزّع البسط: ٤س/س + ص/س = ٩."],[1228,23,1,"كل واحدة تصنع ١٠٠ ÷ ٥ قالبًا، فاطرح نصيب الغائبة."],[1229,23,2,"حوّل الكل إلى أساس ٢: ٤ = ٢²، ثم اجمع أسس البسط واطرح أسس المقام."],[1230,23,1,"المثلث متساوي الساقين (٥ و٥) وزاوية رأسه ٥٠، فزا
