:root{--navy:#102746;--navy-2:#17385c;--blue:#2469a8;--gold:#d8a93e;--gold-2:#f2c866;--cream:#f7f9fc;--paper:#fff;--ink:#18283a;--muted:#66758a;--line:#dbe3ee;--ok:#16805b;--ok-bg:#e5f6ee;--bad:#c53d4b;--bad-bg:#fff0f1;--shadow:0 18px 50px #10274618}
*{box-sizing:border-box}html{scroll-behavior:smooth}body.quiz-active{overflow:hidden}body.quiz-active .footer{display:none}body{margin:0;background:linear-gradient(180deg,#edf3fa 0,#f7f9fc 42%,#fff 100%);color:var(--ink);font-family:"Cairo",Arial,sans-serif;line-height:1.65}button,select{font:inherit}button{cursor:pointer}.wrap{width:min(1160px,calc(100% - 32px));margin:auto}.hidden{display:none!important}
.top{background:linear-gradient(135deg,var(--navy),#1b4774);color:#fff;border-bottom:4px solid var(--gold);box-shadow:0 6px 20px #10274628}.top-in{min-height:86px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:58px;height:58px;object-fit:contain;border-radius:14px;background:#fff;padding:3px}.brand b{display:block;font-size:21px;line-height:1.25}.brand small{display:block;color:#dce8f6;font-size:12px}.top-pill{text-decoration:none;white-space:nowrap;border:1px solid #ffffff35;background:#ffffff12;color:#fff;border-radius:999px;padding:8px 14px;font-size:13px}
.hero{padding:42px 0 28px;text-align:center}.hero h1{margin:0;color:var(--navy);font-size:clamp(28px,5vw,46px);line-height:1.2}.hero h1 span{color:var(--blue)}.hero p{margin:12px auto 0;color:var(--muted);max-width:650px}.stats{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:22px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 18px;box-shadow:0 5px 18px #1027460d}.stat b{display:block;color:var(--blue);font-size:22px;line-height:1.1}.stat small{color:var(--muted)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:24px;margin:18px 0}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.panel h2{margin:0;color:var(--navy);font-size:22px}.panel h3{margin:0 0 8px;color:var(--navy);font-size:17px}.hint{margin:0;color:var(--muted);font-size:13px}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.control{display:grid;gap:6px}.control label{font-weight:700;color:var(--navy);font-size:14px}.select{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:11px 12px;outline:none}.select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #2469a822}
.btn{border:0;border-radius:12px;padding:11px 17px;background:#e9eef5;color:var(--navy);font-weight:700;transition:.2s}.btn:hover{transform:translateY(-1px);filter:brightness(.98)}.btn.primary{background:var(--blue);color:#fff}.btn.gold{background:var(--gold);color:var(--navy)}.btn.outline{background:#fff;border:1px solid var(--line)}.btn.danger{background:var(--bad-bg);color:var(--bad)}.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.mode-tabs{display:flex;gap:8px;background:#eef3f8;padding:5px;border-radius:13px}.mode-tabs button{border:0;background:transparent;border-radius:9px;padding:8px 14px;color:var(--muted);font-weight:700}.mode-tabs button.active{background:#fff;color:var(--blue);box-shadow:0 2px 8px #10274618}
.models{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:13px}.model{position:relative;text-align:right;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:8px;transition:.2s}.model:hover{border-color:var(--blue);box-shadow:0 12px 24px #2469a81b;transform:translateY(-2px)}.model strong{color:var(--navy);font-size:17px}.model small{color:var(--muted)}.model .model-no{position:absolute;left:14px;top:14px;color:var(--gold);font-weight:700;font-size:14px}.model .btn{justify-self:start;padding:7px 12px;font-size:13px}
.build{background:linear-gradient(135deg,#102746,#1d5685);color:#fff}.build h2,.build label{color:#fff}.build .hint{color:#d8e6f4}.build .select{background:#fff}.build-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;align-items:end}.build-note{border:1px solid #ffffff25;background:#ffffff0e;border-radius:14px;padding:14px;color:#dce8f6;font-size:13px}
.footer{text-align:center;color:var(--muted);font-size:13px;padding:26px 0 44px}.footer img{width:50px;height:50px;object-fit:contain;border-radius:12px;vertical-align:middle;margin-left:8px}
.note-light{color:var(--muted);background:#f7f9fc;border-color:var(--line)}
.center{justify-content:center}
.hidden{display:none!important}
/* ===== شاشة الاختبار: شاشة واحدة بدون تمرير ===== */
body.quiz-active{overflow:hidden}
.qz{position:fixed;left:0;right:0;top:0;height:100vh;height:100dvh;z-index:20;display:flex;flex-direction:column;background:#eef3f9;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overflow:hidden}
.qbar{flex:none;display:flex;align-items:center;gap:8px;padding:7px 12px;background:linear-gradient(135deg,var(--navy),#1b4774);color:#fff;border-bottom:3px solid var(--gold)}
.qlogo{width:34px;height:34px;object-fit:contain;border-radius:9px;background:#fff;padding:2px;flex:none}
.qtitle{flex:1;min-width:0;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qb{flex:none;border:1px solid #ffffff40;background:#ffffff18;color:#fff;border-radius:9px;padding:6px 12px;font-weight:700;font-size:13px;text-decoration:none;line-height:1.3}
.qb.gold{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.qb.dark{background:var(--navy);border-color:var(--navy)}
.qmapbtn{display:none}
.timer{flex:none;direction:ltr;unicode-bidi:isolate;min-width:84px;text-align:center;padding:6px 10px;border-radius:9px;background:#ffffff1f;border:1px solid #ffffff40;color:#fff;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.timer.low{background:var(--bad);border-color:var(--bad)}
.qprog{flex:none;height:5px;background:#dfe7f0}
.qprog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--gold));transition:width .25s}
.qbody{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:12px;padding:10px 12px}
.qcard{min-height:0;min-width:0;display:flex;flex-direction:column;gap:8px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px #1027460f;padding:10px;overflow:hidden}
.qmeta{flex:none;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted);line-height:1.3}
.qmeta .fb{font-weight:700}.qmeta .fb.good{color:var(--ok)}.qmeta .fb.bad{color:var(--bad)}
.imgbox{flex:1 1 0;min-height:70px;position:relative;background:#fff;border:1px solid #cfd9e5;border-radius:12px;overflow:hidden}
.imgbox img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;cursor:zoom-in}
.zoombtn{position:absolute;left:8px;bottom:8px;border:1px solid var(--line);background:#fffffff0;color:var(--navy);border-radius:8px;padding:3px 10px;font-size:12px;font-weight:700}
.opts{flex:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.opt{height:48px;border:2px solid var(--line);background:#fff;color:var(--navy);border-radius:12px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;min-width:0;padding:0 4px}
.opt b{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#edf2f7;color:var(--blue);font-size:16px}
.opt.selected{border-color:var(--blue);background:#edf5ff}.opt.selected b{background:var(--blue);color:#fff}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}.opt.correct b{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}.opt.wrong b{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.qctl{display:contents}
.qnav{flex:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
.qnav .btn{min-height:42px;padding:8px 16px;white-space:nowrap}
.qnav .btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.flag{background:#fff;border:1px solid var(--line);color:var(--muted)}
.btn.flag.on{background:#fff7df;border-color:var(--gold);color:#956d12}
.qside{min-height:0;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 8px 24px #1027460d}
.qside h3,.mapbox h3{margin:0 0 8px;color:var(--navy);font-size:16px}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--muted);margin-bottom:8px}
.lg{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:4px;vertical-align:middle}
.lg.a{background:#8db8e0}.lg.f{background:var(--gold);border-radius:50%}.lg.c{border:2px solid var(--navy);background:#fff}
.map{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;align-content:start;padding:2px}
.map button{position:relative;height:34px;min-width:0;border:1px solid var(--line);background:#f8fafc;border-radius:8px;font-size:12px;color:var(--muted);padding:0}
.map button.answered{background:#e8f2ff;border-color:#8db8e0;color:var(--blue)}
.map button.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.map button.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.map button.current{outline:2px solid var(--navy);outline-offset:1px}
.map button.flagged::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;background:var(--gold);border-radius:50%}
.mapmodal{position:fixed;inset:0;z-index:30;background:#07182bcc;display:grid;place-items:center;padding:12px}
.mapmodal[hidden]{display:none}
.mapbox{width:min(460px,100%);max-height:80vh;max-height:80dvh;background:#fff;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.mapbox-h{display:flex;justify-content:space-between;align-items:center}.mapbox-h h3{margin:0}
.mapbox .map{grid-template-columns:repeat(6,1fr)}
@media(max-width:899px){
  .qbody{grid-template-columns:minmax(0,1fr);padding:6px}
  .qside{display:none}
  .qmapbtn{display:inline-block}
  .qlogo{display:none}
}
@media(max-width:620px){
  .qbar{gap:6px;padding:6px 8px}
  .qtitle{font-size:12px}
  .qb{padding:5px 8px;font-size:12px}
  .timer{min-width:66px;padding:5px 6px;font-size:12px}
  .qcard{padding:7px;gap:6px;border-radius:13px}
  .qmeta{font-size:11px}
  .opt{height:42px;font-size:14px}.opt span{display:none}
  .opt b{width:28px;height:28px}
  .qnav .btn{min-height:38px;padding:6px 10px;font-size:13px}
}
@media(max-height:700px){.opt{height:40px}.qnav .btn{min-height:36px;padding:5px 12px}.qmeta{font-size:12px}}
@media(max-height:520px){
  .qmeta{display:none}.qbar{padding:4px 10px}.qlogo{display:none}
  .qcard{gap:5px;padding:6px}.opt{height:34px}.opt b{width:24px;height:24px;font-size:13px}.qnav .btn{min-height:32px;padding:3px 10px;font-size:12px}
  .qbody{padding:5px}
}
@media(max-height:520px) and (min-width:560px){
  .qcard{flex-direction:row;gap:8px}
  .qctl{display:flex;flex-direction:column;justify-content:center;gap:8px;width:136px;flex:none}
  .opts{grid-template-columns:1fr 1fr;gap:6px}
  .opt span{display:none}.opt{height:38px}
  .qnav{flex-direction:column;align-items:stretch;gap:6px}
  .qnav .btn{min-height:34px}
}
/* ===== نوافذ ===== */
.dlg,.imgmodal{position:fixed;inset:0;z-index:60;background:#07182bd9;display:grid;place-items:center;padding:14px}
.dlg[hidden],.imgmodal[hidden]{display:none}
.dlg-box{width:min(420px,100%);background:#fff;border-radius:18px;padding:20px;box-shadow:0 20px 70px #0008;text-align:center}
.dlg-box p{margin:0 0 16px;line-height:1.9;color:var(--ink)}
.dlg-box .warn{color:#956d12;font-weight:700}
.dlg-box .actions{justify-content:center}
.imgmodal img{max-width:96vw;max-height:92vh;max-height:92dvh;object-fit:contain;background:#fff;border-radius:12px;cursor:zoom-out}
/* ===== التقرير ===== */
.result{max-width:900px;margin:22px auto}
.result-card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:24px;text-align:center}
.result-card h1{margin:0;color:var(--navy);font-size:clamp(22px,4vw,30px)}
.score{font-size:clamp(48px,12vw,68px);line-height:1.1;font-weight:700;margin:8px 0}.score small{font-size:.4em;color:var(--muted)}
.score.hi{color:var(--ok)}.score.mid{color:#b9851c}.score.lo{color:var(--bad)}
.result-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;margin:16px 0}
.result-stat{border:1px solid var(--line);border-radius:12px;padding:10px 8px;background:#fafcfe}
.result-stat b{display:block;font-size:22px;color:var(--navy)}.result-stat span{font-size:13px;color:var(--muted)}
.result-stat.ok b{color:var(--ok)}.result-stat.bad b{color:var(--bad)}.result-stat.skip b{color:#b9851c}
.actions.center{justify-content:center;margin:14px 0}
.feedback{margin:14px 0;padding:12px 14px;border-radius:12px;font-weight:700}.feedback.good{background:var(--ok-bg);color:var(--ok)}
.rv-h{margin:26px 0 10px;color:var(--navy);font-size:20px}
.rv-tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:12px}
.rv-tabs button{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px}
.rv-tabs button.active{background:var(--navy);border-color:var(--navy);color:#fff}
.review{display:grid;gap:12px;text-align:right}
.review-item{border:1px solid var(--line);border-right:5px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:8px}
.review-item.ok{border-right-color:var(--ok)}.review-item.bad{border-right-color:var(--bad)}.review-item.skip{border-right-color:var(--gold)}
.review-item img{width:100%;height:auto;max-height:70vh;object-fit:contain;background:#fff;border:1px solid #e3eaf2;border-radius:8px;cursor:zoom-in}
.r-head{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.r-ans{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;font-size:14px;color:var(--navy)}
.okc{color:var(--ok)}
.pill{border-radius:999px;padding:2px 12px;font-weight:700;font-size:12px}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.skip{background:#fff7df;color:#956d12}
.empty{color:var(--muted);padding:18px}
/* ===== الرئيسية على الجوال ===== */
@media(max-width:850px){.build-grid{grid-template-columns:1fr}.controls{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.wrap{width:min(100% - 20px,1160px)}.top-in{min-height:74px}.brand img{width:48px;height:48px}.brand b{font-size:16px}.top-pill{padding:6px 11px;font-size:12px}.hero{padding-top:28px}.panel{padding:16px;border-radius:17px}.controls{grid-template-columns:1fr}.models{grid-template-columns:1fr}.result-card{padding:16px}}

.tm{direction:ltr;unicode-bidi:isolate}
.panel.wrap{margin:18px auto}
</style>
</head>

<script>
const LETTERS=["أ","ب","ج","د"];
const AR=n=>String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
const KEY="201212022211110201223020112213230313123213121000001130221213212002001003233132230103121322121212202202021210200333130023133131203001032233102120100022303211023021303012223112000210102120212100211333100311000000220230211201220111100202112022000113301202231030223203110013100102111022200202211112122121331010002130301201121023020012110011122012013221012320120302023101212123201002300101120301023101122100100323013311010022130011032213321122013013232100111111100201022232100001312210211100002202003101100300303123021230032012122332021001031120011211100011203211121000102023021131022331311030112131302021002020030112023022033013322230130020202011102120121300120010211313013012023012120102201112110122220022002201012100020122302032201101201301310200131320020201202003231213001100201003002323302012102130331231002213011200221113100020021223211331301121220121120230130233201211230011020100312030011201103211";
const BANK=Array.from(KEY,(c,i)=>({id:i+1,a:+c,src:"warky-kamy-img/"+(i+1)+".webp"}));
const TOTAL=BANK.length,MODEL_SIZE=50,MODEL_COUNT=Math.ceil(TOTAL/MODEL_SIZE);
const $=s=>document.querySelector(s);
const app=$("#app");
const mem={};
const UID=(new URLSearchParams(location.search).get("uid")||"").replace(/[^\w-]/g,"");
const SFX=UID?"-"+UID:"";
const store={
  get(k){try{return localStorage.getItem(k+SFX)}catch(e){return mem[k+SFX]===undefined?null:mem[k+SFX]}},
  set(k,v){try{localStorage.setItem(k+SFX,v)}catch(e){mem[k+SFX]=v}},
  del(k){try{localStorage.removeItem(k+SFX)}catch(e){delete mem[k+SFX]}}
};
const TIMERS=[30,45,90,120];
function loadTimer(){const v=store.get("warky1447.timer");if(v==="null")return null;const n=Number(v);return TIMERS.includes(n)?n:90}
let prefs={mode:store.get("warky1447.mode")==="train"?"train":"exam",timer:loadTimer()};
function savePrefs(){store.set("warky1447.mode",prefs.mode);store.set("warky1447.timer",String(prefs.timer))}
let state=null,tickId=null;
const ERROR_KEY="warky1447.errors";
function errorIds(){try{const a=JSON.parse(store.get(ERROR_KEY)||"[]");return a.filter(n=>Number.isInteger(n)&&n>=1&&n<=TOTAL)}catch(e){return[]}}
function saveErrors(set){store.set(ERROR_KEY,JSON.stringify([...set].sort((a,b)=>a-b)))}
const shuffle=arr=>{for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr};
function fmtT(sec){sec=Math.max(0,Math.floor(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;const p=n=>String(n).padStart(2,"0");return AR(h?h+":"+p(m)+":"+p(s):p(m)+":"+p(s))}
function timerLabel(sec){return sec===null?"بدون مؤقت":sec===30?"٣٠ ثانية لكل سؤال":sec===45?"٤٥ ثانية لكل سؤال":sec===90?"دقيقة ونصف لكل سؤال":"دقيقتان لكل سؤال"}
function modelQuestions(i){return BANK.slice(i*MODEL_SIZE,(i+1)*MODEL_SIZE)}
const inFrame=(()=>{try{return window.self!==window.top}catch(e){return true}})();

/* ---------- نوافذ مشتركة ---------- */
function ask(msg,okText,cb,noText){
  $("#dlgMsg").innerHTML=msg;$("#dlgOk").textContent=okText;$("#dlgNo").textContent=noText||"رجوع";
  const d=$("#dlg");d.hidden=false;
  $("#dlgOk").onclick=()=>{d.hidden=true;cb()};
  $("#dlgNo").onclick=()=>{d.hidden=true};
}
function openZoom(src){$("#zoomImg").src=src;$("#zoomModal").hidden=false}
function closeZoom(){$("#zoomModal").hidden=true;$("#zoomImg").removeAttribute("src")}
$("#zoomModal").addEventListener("click",closeZoom);
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeZoom();const m=$("#mapModal");if(m)m.hidden=true}});
function enterFs(){try{const el=document.documentElement;if(!document.fullscreenElement&&el.requestFullscreen){const p=el.requestFullscreen();if(p&&p.catch)p.catch(()=>{})}}catch(e){}}
function leaveFs(){try{if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{})}catch(e){}}

/* ---------- الرئيسية ---------- */
function home(){
  clearInterval(tickId);leaveFs();document.body.classList.remove("quiz-active");state=null;window.scrollTo(0,0);

  app.innerHTML=`<section class="hero wrap"><h1>بنك <span>تجميعات الورقي 1447 هـ</span></h1><p>تدرّب على ${AR(TOTAL)} سؤالًا مصوّرًا من تجميعات القدرات الورقية، مع تصحيح دقيق وتقرير واضح عن مستواك.</p><div class="stats"><div class="stat"><b>${AR(TOTAL)}</b><small>سؤالًا</small></div><div class="stat"><b>${AR(MODEL_COUNT)}</b><small>نموذجًا</small></div><div class="stat"><b>${AR(MODEL_SIZE)}</b><small>سؤال في النموذج</small></div></div><div class="actions" style="justify-content:center;margin-top:18px"><button class="btn outline" id="errorsHome">مجلد أخطائي (${AR(errorIds().length)})</button></div></section>

/* ---------- شاشة الاختبار (شاشة واحدة بدون تمرير) ---------- */
function start(qs,title){
  clearInterval(tickId);
  const limit=prefs.timer===null?null:prefs.timer*qs.length;
  state={qs,title,i:0,answers:Array(qs.length).fill(null),flags:Array(qs.length).fill(false),limit,t0:Date.now(),done:false};
  enterFs();buildQuiz();update();tick();tickId=setInterval(tick,1000);
}
function elapsed(){return Math.floor((Date.now()-state.t0)/1000)}
function tick(){
  if(!state||state.done)return;
  const el=elapsed(),t=$("#timer");
  if(state.limit!==null){const rem=state.limit-el;if(rem<=0){finish();return}if(t){t.textContent=fmtT(rem);t.classList.toggle("low",rem<=60)}}
  else if(t)t.textContent=fmtT(el);
}
function mapHTML(){return state.qs.map((_,k)=>`<button data-go="${k}">${AR(k+1)}</button>`).join("")}

  $("#qTitle").textContent=state.title+" ("+AR(state.qs.length)+" سؤالًا)";

function pick(k){
  const train=prefs.mode==="train";
  if(train&&state.answers[state.i]!==null)return;
  state.answers[state.i]=k;update();
}
function scrollMap(sel){const c=document.querySelector(sel+" .current");if(c&&c.scrollIntoView)c.scrollIntoView({block:"center"})}
function update(){
  if(!state||state.done)return;
  const n=state.qs.length,i=state.i,q=state.qs[i],ans=state.answers[i],train=prefs.mode==="train",locked=train&&ans!==null;
  const answered=state.answers.filter(x=>x!==null).length;
  $("#qN").textContent=`السؤال ${AR(i+1)} من ${AR(n)}`;
  $("#qAns").textContent=`تمت الإجابة: ${AR(answered)} / ${AR(n)}`;
  const fb=$("#qFb");
  if(locked){fb.textContent=ans===q.a?"إجابة صحيحة":"إجابة خاطئة، الصحيحة: "+LETTERS[q.a];fb.className=ans===q.a?"fb good":"fb bad"}else{fb.textContent="";fb.className=""}
  const img=$("#qImg"),want=q.src;
  if(img.getAttribute("src")!==want){img.setAttribute("src",want)}
  img.alt="صورة السؤال رقم "+AR(q.id);
  document.querySelectorAll("#opts .opt").forEach((b,k)=>{
    b.className="opt"+(ans===k?" selected":"")+(locked&&k===q.a?" correct":"")+(locked&&ans===k&&ans!==q.a?" wrong":"");
    b.disabled=locked;
  });
  $("#qPrev").disabled=i===0;
  $("#qFlag").textContent=state.flags[i]?"إلغاء التعليم":"علّم للمراجعة";
  $("#qFlag").classList.toggle("on",state.flags[i]);
  $("#qNext").textContent=i===n-1?"إنهاء وتسليم":"التالي";
  $("#qProg").style.width=(answered/n*100)+"%";
  document.querySelectorAll("[data-go]").forEach(b=>{
    const k=Number(b.dataset.go),a=state.answers[k];
    let c=(a!==null?"answered ":"")+(k===i?"current ":"")+(state.flags[k]?"flagged ":"");
    if(train&&a!==null)c+=a===state.qs[k].a?"ok":"bad";
    b.className=c.trim();
  });
  scrollMap("#map");
  const nx=state.qs[i+1];if(nx){const p=new Image();p.src=nx.src}
  fit();setTimeout(fit,120);
}
function fit(){
  const card=$("#qcard"),box=$("#imgbox");if(!card||!box)return;
  const cs=getComputedStyle(card),gap=parseFloat(cs.rowGap)||0;
  let used=parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom),cnt=0;
  const kids=[];for(const c of card.children){if(c===box)continue;if(getComputedStyle(c).display==="contents")kids.push(...c.children);else kids.push(c)}
  for(const c of kids){if(getComputedStyle(c).display==="none")continue;used+=c.offsetHeight;cnt++}
  used+=gap*cnt;
  if(cs.flexDirection==="row"){
    box.style.flex="1 1 0";box.style.height=Math.max(70,Math.floor(card.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)))+"px";return;
  }
  const h=Math.max(70,Math.floor(card.clientHeight-used));
  box.style.flex="none";box.style.height=h+"px";
}
["resize","orientationchange","fullscreenchange"].forEach(ev=>window.addEventListener(ev,()=>{fit();setTimeout(fit,120)}));
if(window.visualViewport)window.visualViewport.addEventListener("resize",()=>{fit();setTimeout(fit,120)});

function askSubmit(){
  const n=state.qs.length,answered=state.answers.filter(x=>x!==null).length,left=n-answered,fl=state.flags.filter(Boolean).length;
  let msg=`<b>هل تريد تسليم الاختبار؟</b><br>تمت الإجابة على ${AR(answered)} من ${AR(n)} سؤالًا.`;
  if(left)msg+=`<br><span class="warn">الأسئلة بلا إجابة: ${AR(left)}</span>`;
  if(fl)msg+=`<br><span class="warn">الأسئلة المعلّمة للمراجعة: ${AR(fl)}</span>`;
  ask(msg,"تسليم الآن",finish,"العودة للاختبار");
}

/* ---------- تقرير النتيجة ---------- */
function finish(){
  if(!state||state.done)return;
  state.done=true;clearInterval(tickId);leaveFs();
  document.body.classList.remove("quiz-active");
  const dlg=$("#dlg");if(dlg)dlg.hidden=true;
  const used=state.limit!==null?Math.min(state.limit,elapsed()):elapsed();
  const rows=state.qs.map((q,i)=>{const a=state.answers[i];return{q,i,a,st:a===null?"skip":a===q.a?"ok":"bad"}});
  const cnt={ok:0,bad:0,skip:0};rows.forEach(r=>cnt[r.st]++);
  const N=rows.length,pct=Math.round(cnt.ok/N*100);
  const errs=new Set(errorIds());
  rows.forEach(r=>{if(r.st==="ok")errs.delete(r.q.id);else errs.add(r.q.id)});
  saveErrors(errs);
  state.rows=rows;state.cnt=cnt;
  const cls=pct>=70?"hi":pct>=50?"mid":"lo";
  const redo=rows.filter(r=>r.st!=="ok").length;
  const first=cnt.bad?"bad":cnt.skip?"skip":"ok";
  window.scrollTo(0,0);
  app.innerHTML=`<div class="wrap result"><div class="result-card">
<h1>تقرير النتيجة</h1><p class="hint">${state.title}</p>
<div class="score ${cls}">${AR(pct)}<small>٪</small></div>
<div class="result-stats">
<div class="result-stat"><b>${AR(N)}</b><span>إجمالي الأسئلة</span></div>
<div class="result-stat ok"><b>${AR(cnt.ok)}</b><span>الإجابات الصحيحة</span></div>
<div class="result-stat bad"><b>${AR(cnt.bad)}</b><span>الإجابات الخاطئة</span></div>
<div class="result-stat skip"><b>${AR(cnt.skip)}</b><span>الأسئلة المتروكة</span></div>
<div class="result-stat"><b class="tm">${fmtT(used)}</b><span>الوقت المستغرق</span></div></div>
<div class="actions center">
${redo?`<button class="btn gold" id="wrongTest">اختبار الأخطاء والمتروك (${AR(redo)})</button>`:""}
<button class="btn primary" id="again">إعادة الاختبار</button>
<button class="btn outline" id="homeBtn">العودة للرئيسية</button></div>
${redo?"":'<p class="feedback good">ممتاز، لا توجد أخطاء أو أسئلة متروكة.</p>'}
<h2 class="rv-h">مراجعة الأسئلة</h2>
<div class="rv-tabs" id="rvTabs">
<button data-f="ok">الصحيحة (${AR(cnt.ok)})</button><button data-f="bad">الخاطئة (${AR(cnt.bad)})</button><button data-f="skip">المتروكة (${AR(cnt.skip)})</button><button data-f="all">الكل (${AR(N)})</button></div>
<div class="review" id="rvList"></div><div class="actions center"><button class="btn outline hidden" id="rvMore">عرض المزيد</button></div>
</div></div>`;
  $("#again").onclick=()=>start(state.qs,state.title);
  $("#homeBtn").onclick=home;
  if($("#wrongTest"))$("#wrongTest").onclick=()=>start(state.rows.filter(r=>r.st!=="ok").map(r=>r.q),"اختبار الأخطاء والمتروك");
  $("#rvTabs").addEventListener("click",e=>{const b=e.target.closest("[data-f]");if(b)showReview(b.dataset.f)});
  $("#rvMore").onclick=()=>moreReview();
  $("#rvList").addEventListener("click",e=>{const im=e.target.closest("img[data-zoom]");if(im)openZoom(im.getAttribute("src"))});
  showReview(cnt[first]?first:"all");
}
const PAGE=12;let rv={f:"all",shown:0,list:[]};
const ST_LABEL={ok:"صحيحة",bad:"خاطئة",skip:"متروكة"};
function showReview(f){
  document.querySelectorAll("#rvTabs button").forEach(b=>b.classList.toggle("active",b.dataset.f===f));
  rv={f,shown:0,list:state.rows.filter(r=>f==="all"||r.st===f)};
  $("#rvList").innerHTML="";
  if(!rv.list.length){$("#rvList").innerHTML='<p class="empty">لا توجد أسئلة في هذا القسم.</p>';$("#rvMore").classList.add("hidden");return}
  moreReview();
}
function moreReview(){
  const part=rv.list.slice(rv.shown,rv.shown+PAGE);rv.shown+=part.length;
  $("#rvList").insertAdjacentHTML("beforeend",part.map(r=>`<article class="review-item ${r.st}"><div class="r-head"><span>السؤال ${AR(r.i+1)}، رقم البنك ${AR(r.q.id)}</span><span class="pill ${r.st}">${ST_LABEL[r.st]}</span></div><img data-zoom="1" loading="lazy" src="${r.q.src}" alt="السؤال ${AR(r.q.id)}"><div class="r-ans"><span>إجابتك: <b>${r.a===null?"لم تُجب":LETTERS[r.a]}</b></span><span>الإجابة الصحيحة: <b class="okc">${LETTERS[r.q.a]}</b></span></div></article>`).join(""));
  $("#rvMore").classList.toggle("hidden",rv.shown>=rv.list.length);
  $("#rvMore").textContent=`عرض المزيد (${AR(rv.list.length-rv.shown)})`;
}

/* ---------- مجلد الأخطاء ---------- */
function showErrors(){
  document.body.classList.remove("quiz-active");window.scrollTo(0,0);
  const ids=errorIds(),qs=ids.map(id=>BANK[id-1]).filter(Boolean);
  app.innerHTML=`<div class="wrap result"><div class="result-card"><h1>مجلد أخطائي</h1><p class="hint">الأسئلة التي أخطأت فيها أو تركتها محفوظة لك، وتُحذف منه تلقائيًا عند الإجابة عنها إجابة صحيحة.</p>${qs.length?`<div class="actions center"><button class="btn gold" id="folderTest">اختبرني في أخطائي (${AR(qs.length)})</button><button class="btn danger" id="clearFolder">مسح المجلد</button><button class="btn outline" id="folderHome">العودة للرئيسية</button></div><div class="review" id="rvList"></div><div class="actions center"><button class="btn outline hidden" id="rvMore">عرض المزيد</button></div>`:'<p class="feedback good">مجلد الأخطاء فارغ حاليًا.</p><div class="actions center"><button class="btn outline" id="folderHome">العودة للرئيسية</button></div>'}</div></div>`;
  $("#folderHome").onclick=home;
  if(!qs.length)return;
  state={rows:qs.map((q,i)=>({q,i,a:null,st:"bad",folder:true}))};
  rv={f:"all",shown:0,list:state.rows};
  const draw=()=>{const part=rv.list.slice(rv.shown,rv.shown+PAGE);rv.shown+=part.length;
    $("#rvList").insertAdjacentHTML("beforeend",part.map(r=>`<article class="review-item bad"><div class="r-head"><span>السؤال ${AR(r.i+1)}، رقم البنك ${AR(r.q.id)}</span><span>الإجابة الصحيحة: <b class="okc">${LETTERS[r.q.a]}</b></span></div><img data-zoom="1" loading="lazy" src="${r.q.src}" alt="السؤال ${AR(r.q.id)}"></article>`).join(""));
    $("#rvMore").classList.toggle("hidden",rv.shown>=rv.list.length);$("#rvMore").textContent=`عرض المزيد (${AR(rv.list.length-rv.shown)})`};
  draw();$("#rvMore").onclick=draw;
  $("#rvList").addEventListener("click",e=>{const im=e.target.closest("img[data-zoom]");if(im)openZoom(im.getAttribute("src"))});
  $("#folderTest").onclick=()=>start(qs,"تدريب الأخطاء");
  $("#clearFolder").onclick=()=>ask("هل تريد مسح مجلد الأخطاء بالكامل؟","مسح",()=>{store.del(ERROR_KEY);showErrors()});
}
home();
</script>
</body></html>
