<style>
:root{--ink:#172b4d;--muted:#6b7c93;--brand:#1769aa;--navy:#12345a;--accent:#19b8c9;--bg:#eef4f9;--card:#fff;--line:#e0ebf3;--soft:#f5f9fc;--ok:#1e8a4c;--okbg:#dff3e6;--bad:#c0392b;--badbg:#fbe1de;--warn:#8a6200;--warnbg:#fff1cc}
*{box-sizing:border-box}html,body{margin:0}body{background:linear-gradient(135deg,#eef7fb,#f7fbff 50%,#edf3fa);font-family:Cairo,Tahoma,Arial,sans-serif;color:var(--ink);font-size:14px;min-height:100vh}

a.btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;border-radius:11px;padding:9px 14px;background:#e3ebf3;color:var(--navy);font-weight:700}a.btn.wa{background:#1fa855;color:#fff}a.btn.tg{background:#229ed9;color:#fff}a.btn.sm{padding:5px 10px;font-size:12px;border-radius:9px}
input,textarea,select{padding:9px 11px;border:1px solid #cbdce8;border-radius:11px;width:100%;background:#fff;transition:border .15s,box-shadow .15s}input:focus,textarea:focus,select:focus{outline:none;border-color:#56b8cc;box-shadow:0 0 0 4px #19b8c91c}textarea{min-height:96px;resize:vertical}input[type=checkbox]{width:auto;accent-color:var(--brand)}
label.f{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600}
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px;max-width:1500px;margin:auto;padding:16px}
.side{background:linear-gradient(180deg,#102a43,#123b5b 70%,#0e2439);border-radius:22px;padding:20px 12px;color:#dceefa;box-shadow:0 18px 42px #12345a2b;position:sticky;top:16px;height:calc(100vh - 32px);display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px;border-bottom:1px solid #ffffff20}.mark{display:grid;place-items:center;width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#19b8c9,#4dd9c0);color:#07334d;font-weight:900;font-size:18px}.brand b{display:block;color:#fff;font-size:14px}.brand small{color:#a8c8dc;font-size:11px}
.nav{display:grid;gap:4px;margin-top:16px;overflow:auto}.nav a{color:#b9d1df;text-decoration:none;padding:10px 12px;border-radius:12px;font-size:13.5px;display:flex;gap:10px;align-items:center;transition:.15s;font-weight:600}.nav a i{font-style:normal;width:20px;text-align:center;opacity:.9}.nav a:hover{background:#ffffff12;color:#fff}.nav a.on{background:#ffffff1f;color:#fff;box-shadow:inset 3px 0 0 #4dd9c0}.nav a .cnt{margin-right:auto;background:#19b8c9;color:#06303f;border-radius:99px;font-size:11px;padding:0 7px;font-weight:800}
.me{margin-top:auto;border:1px solid #ffffff1c;background:#ffffff0d;border-radius:15px;padding:12px;font-size:12px;color:#b9d1df}.me b{color:#fff;display:block;font-size:13px}.me .role{display:inline-block;margin-top:4px;background:#ffffff1a;border-radius:99px;padding:1px 9px;font-size:11px}.me button{margin-top:10px;width:100%;background:#ffffff14;font-size:12px}
.main,.side,.two>*{min-width:0}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 2px 14px;flex-wrap:wrap}.top h1{margin:0;font-size:24px;color:var(--navy)}.top p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 10px 28px #173a5a0a}.card h2{margin:0 0 12px;font-size:17px;color:var(--navy);display:flex;align-items:center;gap:8px;flex-wrap:wrap}.card h2 .m{font-weight:400}.card h2 .sp{margin-right:auto}
.m{color:var(--muted);font-size:12.5px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.two{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}.kpi{position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px}.kpi:after{content:'';position:absolute;width:70px;height:70px;border-radius:50%;left:-26px;bottom:-26px;background:#18b8c91b}.kpi span{color:var(--muted);font-size:12px}.kpi strong{display:block;font-size:28px;line-height:1.3;color:var(--navy);margin-top:4px}.kpi small{color:#8b9aaa;font-size:11px}.kpi.c strong{color:#0f9eae}.kpi.g strong{color:#168a62}.kpi.o strong{color:#c27a18}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px 7px;border-bottom:1px solid #e9f0f5;text-align:right;white-space:nowrap;vertical-align:middle}th{color:var(--muted);font-weight:600;background:#f6fafc;position:sticky;top:0}tr:hover td{background:#fafcfe}
.b{display:inline-block;padding:2px 10px;border-radius:99px;font-size:11.5px;font-weight:700}.ok{background:var(--okbg);color:var(--ok)}.no{background:var(--badbg);color:var(--bad)}.mu{background:#e9eef3;color:#5b6b7b}.wn{background:var(--warnbg);color:var(--warn)}.in{background:#e1f0fb;color:#1769aa}
code{direction:ltr;display:inline-block;background:#f3f8fc;padding:2px 8px;border-radius:8px;letter-spacing:1.5px;font-weight:700;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
.rank{display:grid;grid-template-columns:26px minmax(90px,1fr) 1fr 44px;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #edf2f6;font-size:12.5px}.rank:last-child{border:0}.rank .n{display:grid;place-items:center;width:24px;height:24px;border-radius:8px;background:#edf7fa;color:#138b9e;font-weight:800}.bar{height:7px;border-radius:99px;background:#eaf1f5;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#19b8c9,#4dd9c0)}.day{display:grid;grid-template-columns:82px 1fr 40px;align-items:center;gap:8px;color:#66788a;font-size:12px;padding:3px 0}.day .bar i{background:linear-gradient(90deg,#1769aa,#19b8c9)}
.empty{padding:20px;text-align:center;color:#8a9aaa;font-size:12.5px}
.perm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}.pg{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--soft)}.pg>label{display:flex;gap:8px;align-items:center;font-weight:800;color:var(--navy);padding-bottom:6px;margin-bottom:6px;border-bottom:1px dashed #d6e4ee;cursor:pointer}.pg .it{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;padding:4px 0;cursor:pointer;line-height:1.5}.pg .it input{margin-top:3px}.perm-grid.dis{opacity:.55;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:4px}.chip{background:#eef5fa;border:1px solid #dfeaf2;border-radius:8px;padding:1px 7px;font-size:11px;color:#3b5068}
.mode-pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.mode-pick label{border:1.5px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;display:block;transition:.15s}.mode-pick label:hover{border-color:#9cc3e3}.mode-pick input{display:none}.mode-pick input:checked+div{color:var(--navy)}.mode-pick label.on{border-color:var(--brand);background:#f1f8fd;box-shadow:0 0 0 3px #1769aa14}.mode-pick b{display:block;margin-bottom:3px}
.ov{position:fixed;inset:0;background:#0b1f3366;backdrop-filter:blur(2px);z-index:100;display:flex;align-items:center;justify-content:center;padding:14px}.dlg{background:#fff;border-radius:18px;width:min(760px,100%);max-height:92vh;overflow:auto;box-shadow:0 30px 70px #0b1f3355;padding:20px}.dlg.sm{width:min(420px,100%)}.dlg h3{margin:0 0 12px;color:var(--navy);font-size:18px}.dlg .acts{display:flex;gap:8px;justify-content:flex-start;margin-top:16px;flex-wrap:wrap}
.toasts{position:fixed;bottom:16px;left:16px;z-index:200;display:grid;gap:8px}.toast{background:#12345a;color:#fff;padding:10px 16px;border-radius:12px;box-shadow:0 10px 26px #0004;font-weight:600;font-size:13px;animation:tin .2s ease-out}.toast.err{background:var(--bad)}.toast.ok{background:var(--ok)}@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.login{max-width:400px;margin:12vh auto;padding:26px}.login h1{margin:0 0 6px;color:var(--navy);font-size:22px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.tabs button{background:#eef4f9;color:var(--navy);font-weight:600;padding:6px 12px;font-size:12.5px}.tabs button.on{background:var(--navy);color:#fff}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--muted)}
@media(max-width:980px){.shell{grid-template-columns:1fr;padding:10px;gap:10px}.side{position:relative;top:0;height:auto;padding:12px}.brand{padding-bottom:10px}.nav{display:flex;margin-top:10px;overflow-x:auto;padding-bottom:4px}.nav a{white-space:nowrap}.nav a.on{box-shadow:inset 0 -3px 0 #4dd9c0}.me{display:none}.two{grid-template-columns:1fr}}
@media(max-width:560px){.top h1{font-size:20px}.kpi strong{font-size:23px}.card{padding:14px;border-radius:15px}}

<script>
'use strict';
var NM={'aksam kamy':'أقسام الكمي','aksam lafzi':'أقسام اللفظي','muhaky mohawsab':'المحاكي المحوسب','muhaky warky1':'الورقي – النموذج الأول','muhaky warky2':'الورقي – النموذج الثاني','tasis lafzi':'تأسيس اللفظي','waraqi':'المحاكيات الورقية','home':'الصفحة الرئيسية','index':'الصفحة الرئيسية'};
var TR=[[120,'ساعتان'],[720,'١٢ ساعة'],[1440,'يوم'],[2880,'يومان'],[10080,'أسبوع'],[14400,'١٠ أيام'],[43200,'شهر']];
var VD=[[0,'دائم (بدون انتهاء)'],[7,'٧ أيام'],[30,'٣٠ يومًا'],[90,'٩٠ يومًا'],[180,'٦ شهور'],[365,'سنة']];
var LS={new:['in','جديد'],contacted:['wn','تم التواصل'],added:['ok','أُضيف للمجموعة'],subscribed:['ok','مشترك'],not_interested:['mu','غير مهتم']};
var AU={login:'تسجيل دخول',create:'إنشاء',update:'تعديل',delete:'حذف',block:'حظر',unblock:'تفعيل',resetdev:'تصفير الأجهزة',setting:'إعدادات',unban:'رفع حظر',reset:'تصفير',password:'كلمة المرور',member_add:'إضافة أعضاء',member_remove:'إزالة أعضاء',content:'تعديل أسئلة',revert:'رجوع للأصل',course_assign:'إسناد مقرر',course_remove:'إلغاء إسناد مقرر'};
var AT={staff:'حساب عامل',student:'طالب',group:'مجموعة',lead:'مهتم',settings:'المنصة',course:'مقرر'};
var MODEL={bank:'بنك أسئلة بأقسام',raw:'أسئلة نصية',key:'مفتاح إجابات (اختبار ورقي)',linked:'مرتبط بالكمي واللفظي'};
var D=null,view='',PL=[],st={q:'',status:'',group:'',pg:'',lf:'',lq:''},app=document.getElementById('app'),auditRows=null;

/* ---------- أدوات ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function nm(p){return NM[p]||p}
function fmtC(c){return c?c.slice(0,4)+'-'+c.slice(4):''}
function ago(t){if(!t)return'—';var m=Math.round((Date.now()-new Date(t))/60000);return m<1?'الآن':m<60?'قبل '+m+' د':m<1440?'قبل '+Math.round(m/60)+' س':'قبل '+Math.round(m/1440)+' يوم'}
function dt(t){return t?new Date(t).toLocaleDateString('ar-EG'):'∞'}
function dtt(t){return t?new Date(t).toLocaleString('ar-EG',{dateStyle:'medium',timeStyle:'short'}):'—'}
function opts(a,sel){return a.map(function(x){return'<option value="'+esc(x[0])+'"'+(String(x[0])===String(sel)?' selected':'')+'>'+esc(x[1])+'</option>'}).join('')}
function can(k){return !!D&&(D.actor.role==='super_admin'||D.actor.perms.indexOf(k)>=0)}
function canAny(a){return a.some(can)}
function $(i){return document.getElementById(i)}
function toast(t,k){var e=document.createElement('div');e.className='toast'+(k?' '+k:'');e.textContent=t;$('toasts').appendChild(e);setTimeout(function(){e.remove()},3200)}
function isExp(s){return s.expires_at&&s.expires_at<new Date().toISOString()}
function isPaused(s){return s.pause_until&&s.pause_until>Date.now()}
function sStatus(s){return s.status!=='active'?['no','محظور']:isPaused(s)?['wn','استراحة']:isExp(s)?['wn','منتهي']:['ok','مفعّل']}
function waNum(n){return String(n||'').replace(/\D/g,'')}
async function api(p,b){var r=await fetch('/api/admin/'+p,b===undefined?{credentials:'same-origin'}:{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify(b)});var d=await r.json().catch(function(){return{}});if(r.status===401&&d.error==='auth'){D=null;login();throw 0}if(!r.ok)throw new Error(d.error||'حدث خطأ');return d}
async function act(fn,okMsg){try{await fn();if(okMsg)toast(okMsg,'ok');await load()}catch(e){if(e)toast(e.message||'حدث خطأ','err')}}
function csv(name,rows){var c='﻿'+rows.map(function(r){return r.map(function(x){return'"'+String(x==null?'':x).replace(/"/g,'""')+'"'}).join(',')}).join('\n');var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv;charset=utf-8'}));a.download=name;a.click()}

/* ---------- نوافذ ---------- */
function dialog(html,cls){var o=document.createElement('div');o.className='ov';o.innerHTML='<div class="dlg '+(cls||'')+'" role="dialog" aria-modal="true">'+html+'</div>';document.body.appendChild(o);o.addEventListener('mousedown',function(e){if(e.target===o)o.remove()});document.addEventListener('keydown',function k(e){if(e.key==='Escape'){o.remove();document.removeEventListener('keydown',k)}});var f=o.querySelector('input,select,textarea');if(f)setTimeout(function(){f.focus()},30);return o}
function confirmBox(msg,danger){return new Promise(function(res){var o=dialog('<h3>تأكيد</h3><p style="line-height:1.8">'+msg+'</p><div class="acts"><button class="'+(danger?'r':'')+'" data-y>تأكيد</button><button class="g" data-n>إلغاء</button></div>','sm');o.querySelector('[data-y]').onclick=function(){o.remove();res(true)};o.querySelector('[data-n]').onclick=function(){o.remove();res(false)};o.addEventListener('mousedown',function(e){if(e.target===o)res(false)})})}
function promptBox(title,val,type){return new Promise(function(res){var o=dialog('<h3>'+esc(title)+'</h3><input id="pbv" type="'+(type||'text')+'" value="'+esc(val==null?'':val)+'"><div class="acts"><button data-y>حفظ</button><button class="g" data-n>إلغاء</button></div>','sm');var i=o.querySelector('#pbv');var ok=function(){o.remove();res(i.value)};o.querySelector('[data-y]').onclick=ok;i.onkeydown=function(e){if(e.key==='Enter')ok()};o.querySelector('[data-n]').onclick=function(){o.remove();res(null)}})}

/* ---------- الدخول ---------- */
function login(msg){app.innerHTML='<div class="card login"><h1>🔒 لوحة التحكم</h1><p class="m" style="margin:0 0 14px">ادخل بحساب العامل الخاص بك، أو اترك اسم المستخدم فارغًا وادخل بكلمة مرور المدير العام.</p><label class="f" for="un">اسم المستخدم</label><input id="un" dir="ltr" autocomplete="username" placeholder="username"><label class="f" for="pw" style="margin-top:10px">كلمة المرور</label><input id="pw" type="password" autocomplete="current-password"><div class="m" id="le" style="color:var(--bad);min-height:22px;margin:8px 0">'+esc(msg||'')+'</div><button id="lb" style="width:100%">دخول</button></div>';
 var go=async function(){$('lb').disabled=true;try{var r=await fetch('/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:$('un').value,password:$('pw').value})});var d=await r.json().catch(function(){return{}});if(!r.ok)throw new Error(d.error||'تعذر الدخول');load()}catch(e){login(e.message)}};
 $('lb').onclick=go;$('pw').onkeydown=$('un').onkeydown=function(e){if(e.key==='Enter')go()};$('un').focus()}

/* ---------- الأقسام (لا يظهر أي قسم بدون صلاحيته) ---------- */
var SECTIONS=[
 {id:'overview',icon:'◉',title:'نظرة عامة',sub:'متابعة النشاط والأداء في مكان واحد',show:function(){return can('dashboard.view')},draw:drawOverview},
 {id:'students',icon:'♙',title:'الطلاب والأكواد',sub:'إضافة الأكواد وإدارتها ومتابعة كل طالب',show:function(){return can('students.view')},draw:drawStudents,count:function(){return D.students?D.students.length:0}},
 {id:'reports',icon:'▤',title:'النتائج والتقارير',sub:'مين حلّ ومين لسه، ونتائج كل قسم',show:function(){return can('reports.view')},draw:drawReports},
 {id:'groups',icon:'❖',title:'المجموعات',sub:'دفعات الطلاب ومتابعتها معًا',show:function(){return can('groups.view')},draw:drawGroups,count:function(){return D.groups?D.groups.length:0}},
 {id:'leads',icon:'◎',title:'المهتمون',sub:'الزوار الذين تركوا رقم الواتساب',show:function(){return can('leads.view')},draw:drawLeads,count:function(){return D.leads?D.leads.filter(function(x){return x.status==='new'}).length:0}},
 {id:'settings',icon:'⚙',title:'إعدادات المنصة',sub:'نمط الدخول والباقات والتواصل والحماية',show:function(){return canAny(['settings.access','settings.plans','settings.contact','settings.guard'])},draw:drawSettings},
 {id:'staff',icon:'♚',title:'فريق العمل والصلاحيات',sub:'حسابات المعلمين والمشرفين وصلاحيات كل حساب',show:function(){return D.actor.role==='super_admin'},draw:drawStaff,count:function(){return D.staff?D.staff.length:0}},
 {id:'courses',icon:'▣',title:'المقررات',sub:'الاختبارات بأنواعها، والمعلمون المسندون لكل مقرر وصلاحياتهم',show:function(){return D.actor.role==='super_admin'||D.actor.role==='teacher'||!!(D.courses&&D.courses.length)},draw:drawCourses},
 {id:'audit',icon:'☰',title:'سجل العمليات',sub:'من فعل ماذا ومتى',show:function(){return can('audit.view')},draw:drawAudit},
 {id:'account',icon:'☺',title:'حسابي',sub:'بياناتك وصلاحياتك وكلمة المرور',show:function(){return true},draw:drawAccount}
];
function visible(){return SECTIONS.filter(function(s){return s.show()})}

async function load(){try{D=await api('data');var cs=SECTIONS.filter(function(x){return x.id==='courses'})[0];cs.title=D.actor.role==='super_admin'?'المقررات':'مقرراتي';cs.sub=D.actor.role==='super_admin'?'الاختبارات بأنواعها، والمعلمون المسندون لكل مقرر وصلاحياتهم':'المقررات المسندة لك: ادخلها كمعلم لتعديل الأسئلة، وتابع تقاريرها';PL=(D.plans||[]).map(function(x){return{name:x.name,days:x.days,price:x.price}});render()}catch(e){if(e)toast(e.message,'err')}}

function render(){

function wireGrid(root){var grid=root.querySelector('[data-grid]');if(!grid)return;var N=D.needs||{};
 var box=function(k){return grid.querySelector('[data-perm="'+k+'"]')};
 var sync=function(){grid.querySelectorAll('[data-gall]').forEach(function(a){var it=grid.querySelectorAll('[data-g="'+a.dataset.gall+'"]');a.checked=[].every.call(it,function(i){return i.checked})})};
 var on=function(k){var b=box(k);if(b&&!b.checked){b.checked=true;(N[k]||[]).forEach(on)}else if(b)(N[k]||[]).forEach(on)};
 var off=function(k){Object.keys(N).forEach(function(c){if(N[c].indexOf(k)>=0){var b=box(c);if(b&&b.checked){b.checked=false;off(c)}}})};
 grid.addEventListener('change',function(e){var t=e.target;if(t.dataset.gall){grid.querySelectorAll('[data-g="'+t.dataset.gall+'"]').forEach(function(i){i.checked=t.checked;if(t.checked)on(i.dataset.perm);else off(i.dataset.perm)})}else if(t.dataset.perm){if(t.checked)on(t.dataset.perm);else off(t.dataset.perm)}sync()});sync()}
function readGrid(root){return[].map.call(root.querySelectorAll('[data-perm]:checked'),function(i){return i.dataset.perm})}
function setGrid(root,list){root.querySelectorAll('[data-perm]').forEach(function(i){i.checked=list.indexOf(i.dataset.perm)>=0});root.querySelectorAll('[data-gall]').forEach(function(a){a.checked=[].every.call(root.querySelectorAll('[data-g="'+a.dataset.gall+'"]'),function(i){return i.checked})})}

function permLabel(k){for(var i=0;i<D.catalog.length;i++)for(var j=0;j<D.catalog[i].items.length;j++)if(D.catalog[i].items[j][0]===k)return D.catalog[i].items[j][1];return k}
