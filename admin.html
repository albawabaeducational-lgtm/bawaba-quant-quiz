<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>لوحة التحكم | البوابة التعليمية</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef3f8;font-family:Cairo,Tahoma,Arial,sans-serif;color:#1d2b3a;padding:14px}
.w{max-width:1100px;margin:auto}h1{margin:0 0 12px;color:#12345a;font-size:22px}h2{margin:0 0 10px;font-size:17px;color:#12345a}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #12345a14}
.cs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.st{background:#f3f8fc;border-radius:12px;padding:12px;text-align:center}.st b{display:block;font-size:24px;color:#1769aa}.st span{font-size:13px;color:#5b6b7b}
button,select,input,textarea{font:inherit}button{border:0;border-radius:10px;padding:8px 14px;background:#12345a;color:#fff;cursor:pointer;font-weight:700}button.g{background:#e3ebf3;color:#12345a}button.r{background:#c0392b}button.o{background:#1e8a4c}
input,textarea,select{padding:10px;border:2px solid #cfdde8;border-radius:10px;width:100%;background:#fff}textarea{min-height:90px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 6px;border-bottom:1px solid #e6edf3;text-align:right;white-space:nowrap}th{color:#5b6b7b;font-weight:600}.sc{overflow-x:auto}
.b{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700}.ok{background:#dff3e6;color:#1e8a4c}.no{background:#fbe1de;color:#c0392b}.mu{background:#e9eef3;color:#5b6b7b}.wn{background:#fff1cc;color:#8a6200}
code{direction:ltr;display:inline-block;background:#f3f8fc;padding:2px 8px;border-radius:8px;letter-spacing:2px;font-weight:700}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}.m{color:#5b6b7b;font-size:13px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:10px}.g3 label{font-size:13px;color:#5b6b7b;display:block;margin-bottom:4px}hr{border:0;border-top:1px solid #e6edf3;margin:14px 0}
</style></head><body><div class="w" id="app"></div>
<script>
var NM={'aksam kamy':'أقسام الكمي','aksam lafzi':'أقسام اللفظي','muhaky mohawsab':'المحاكي المحوسب','muhaky warky1':'الورقي – النموذج الأول','muhaky warky2':'الورقي – النموذج الثاني','tasis lafzi':'تأسيس اللفظي'};
var TR=[[0,'بدون تجربة (الدخول بالكود فقط)'],[120,'ساعتان'],[720,'١٢ ساعة'],[1440,'يوم'],[2880,'يومان'],[10080,'أسبوع'],[14400,'١٠ أيام'],[43200,'شهر']];
var VD=[[0,'دائم (بدون انتهاء)'],[7,'٧ أيام'],[30,'٣٠ يومًا'],[90,'٩٠ يومًا'],[180,'٦ شهور'],[365,'سنة']];
var D=null,pg='',q='',app=document.getElementById('app');
var nm=function(p){return NM[p]||p};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var fmtC=function(c){return c.slice(0,4)+'-'+c.slice(4)};
var opts=function(a,sel){return a.map(function(x){return'<option value="'+x[0]+'"'+(x[0]===sel?' selected':'')+'>'+x[1]+'</option>'}).join('')};
async function api(p,b){var r=await fetch('/api/admin/'+p,b===undefined?{}:{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});var d=await r.json().catch(function(){return{}});if(r.status===401&&d.error==='auth'){D=null;login();throw 0}if(!r.ok)throw new Error(d.error||'خطأ');return d}
function login(msg){app.innerHTML='<div class="card" style="max-width:360px;margin:12vh auto"><h1>🔒 لوحة التحكم</h1><input id="pw" type="password" placeholder="كلمة مرور المشرف"><div class="m" id="le" style="color:#c0392b;min-height:20px;margin:6px 0">'+esc(msg||'')+'</div><button id="lb" style="width:100%">دخول</button></div>';
var go=async function(){try{var r=await fetch('/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:document.getElementById('pw').value})});var d=await r.json();if(!r.ok)throw new Error(d.error);load()}catch(e){login(e.message)}};
document.getElementById('lb').onclick=go;document.getElementById('pw').onkeydown=function(e){if(e.key==='Enter')go()}}
async function load(){try{D=await api('data');if(!pg){var ps=pages();pg=ps[0]||''}draw()}catch(e){if(e)alert(e.message)}}
function pages(){var s={};D.pages.forEach(function(r){s[r.page]=1});Object.keys(NM).forEach(function(k){s[k]=1});return Object.keys(s)}
function ago(t){if(!t)return'—';var m=Math.round((Date.now()-new Date(t))/60000);return m<1?'الآن':m<60?'قبل '+m+' د':m<1440?'قبل '+Math.round(m/60)+' س':'قبل '+Math.round(m/1440)+' يوم'}
function dt(t){return t?new Date(t).toLocaleDateString('ar-EG'):'∞'}
function isExp(s){return s.expires_at&&s.expires_at<new Date().toISOString()}
function draw(){
 var fq=document.activeElement&&document.activeElement.id==='q',pos=fq?document.activeElement.selectionStart:0;
 var S=D.students,ST=D.settings,att=0,tot=0,sc=0,act=0;D.pages.forEach(function(r){att+=r.attempts});S.forEach(function(s){if(s.avg!=null){sc+=s.avg;tot++}if(s.last_seen&&Date.now()-new Date(s.last_seen)<7*864e5)act++});
 var pop={};D.pages.forEach(function(r){pop[r.page]=(pop[r.page]||0)+r.opens});var top=Object.keys(pop).sort(function(a,b){return pop[b]-pop[a]})[0];
 var h='<div class="row sp"><h1>🛠 لوحة التحكم</h1><button class="g" id="rf">تحديث</button></div>';
 h+='<div class="card"><div class="cs"><div class="st"><b>'+S.length+'</b><span>كود / طالب</span></div><div class="st"><b>'+act+'</b><span>نشط آخر ٧ أيام</span></div><div class="st"><b>'+att+'</b><span>محاولة محلولة</span></div><div class="st"><b>'+(tot?Math.round(sc/tot):'—')+'٪</b><span>متوسط الدرجات</span></div><div class="st"><b style="font-size:15px">'+esc(top?nm(top):'—')+'</b><span>الأكثر فتحًا</span></div></div></div>';
 h+='<div class="card"><h2>⚙ الدخول والتجربة المجانية</h2><div class="row sp"><div>اشتراط الدخول بالكود: <span class="b '+(ST.require_login?'ok':'mu')+'">'+(ST.require_login?'مفعّل':'غير مفعّل — الموقع مفتوح للجميع')+'</span><div class="m">فعّله بعد ما توزّع الأكواد. التجربة المجانية تعمل فقط والاشتراط مفعّل.</div></div><button id="rq" class="'+(ST.require_login?'r':'o')+'">'+(ST.require_login?'إيقاف الاشتراط':'تفعيل الاشتراط')+'</button></div>'
  +'<div class="g3"><div><label>مدة التجربة المجانية للزائر الجديد</label><select id="tr">'+opts(TR,ST.trial_minutes)+'</select></div><div><label>رقم واتساب المنصة (يظهر في صفحة الدخول)</label><div class="row" style="flex-wrap:nowrap"><input id="ct" dir="ltr" value="'+esc(ST.contact)+'" placeholder="9665XXXXXXXX"><button id="cts" class="g">حفظ</button></div></div></div></div>';
 h+='<div class="card"><h2>➕ إضافة أكواد</h2><textarea id="nn" placeholder="اكتب اسم كل طالب في سطر (أو اسم المجموعة للكود الجماعي)"></textarea>'
  +'<div class="g3"><div><label>نوع الكود</label><select id="kd"><option value="single">فردي — لطالب واحد</option><option value="group">جماعي — لعدة أشخاص</option></select></div>'
  +'<div><label>أقصى عدد أجهزة (٠ = بلا حد)</label><input id="md" type="number" min="0" placeholder="فردي ٢ — جماعي ٣٠"></div>'
  +'<div><label>مدة الصلاحية</label><select id="vd">'+opts(VD,0)+'</select></div></div>'
  +'<div class="row" style="margin-top:10px"><button id="ad">إضافة وتوليد الأكواد</button></div><div id="added"></div></div>';
 var f=q.trim().toLowerCase(),L=S.filter(function(s){return!f||s.name.toLowerCase().indexOf(f)>=0||s.code.toLowerCase().indexOf(f)>=0});
 h+='<div class="card"><div class="row sp"><h2 style="margin:0">👥 الأكواد والطلاب ('+L.length+')</h2><input id="q" style="max-width:240px" placeholder="🔎 بحث بالاسم أو الكود" value="'+esc(q)+'"></div><div class="sc" style="margin-top:8px"><table><tr><th>الاسم</th><th>النوع</th><th>الكود</th><th>الحالة</th><th>الأجهزة</th><th>الصلاحية</th><th>محاولات</th><th>المتوسط</th><th>الوقت</th><th>آخر دخول</th><th></th></tr>';
 L.forEach(function(s){var ex=isExp(s),stt=s.status!=='active'?['no','محظور']:ex?['wn','منتهي']:['ok','مفعّل'];
  h+='<tr><td>'+esc(s.name)+'</td><td><span class="b mu">'+(s.kind==='group'?'جماعي':'فردي')+'</span></td><td><code>'+fmtC(s.code)+'</code></td><td><span class="b '+stt[0]+'">'+stt[1]+'</span></td><td>'+s.devices+' / '+(s.max_devices||'∞')+'</td><td>'+dt(s.expires_at)+'</td><td>'+s.attempts+'</td><td>'+(s.avg!=null?s.avg+'٪':'—')+'</td><td>'+Math.round(s.secs/60)+' د</td><td>'+ago(s.last_seen)+'</td>'
  +'<td><select data-s="'+s.id+'" style="width:130px;padding:6px"><option value="">إجراءات…</option><option value="tg">'+(s.status==='active'?'حظر':'تفعيل')+'</option><option value="e30">تمديد ٣٠ يومًا</option><option value="e365">تمديد سنة</option><option value="ne">جعل الصلاحية دائمة</option><option value="md">تغيير حد الأجهزة</option><option value="rd">تصفير الأجهزة</option><option value="wa">رسالة واتساب</option><option value="del">حذف</option></select></td></tr>'});
 h+=(L.length?'':'<tr><td colspan="11" class="m">لا يوجد نتائج.</td></tr>')+'</table></div><div class="row" style="margin-top:10px"><button class="g" id="cs">⬇ تصدير Excel/CSV</button></div></div>';
 h+='<div class="card"><h2>✅ مين حلّ ومين لسه</h2><select id="ps">'+pages().map(function(p){return'<option value="'+esc(p)+'"'+(p===pg?' selected':'')+'>'+esc(nm(p))+'</option>'}).join('')+'</select><div class="sc" style="margin-top:10px"><table><tr><th>الطالب</th><th>الحالة</th><th>مرات الفتح</th><th>محاولات</th><th>أفضل درجة</th><th>آخر نشاط</th></tr>';
 var done=0;S.forEach(function(s){var r=D.pages.filter(function(x){return x.student_id===s.id&&x.page===pg})[0]||{opens:0,attempts:0};var ok=r.attempts>0;if(ok)done++;
  h+='<tr><td>'+esc(s.name)+'</td><td><span class="b '+(ok?'ok':r.opens?'mu':'no')+'">'+(ok?'حلّ':r.opens?'فتح فقط':'لم يفتح')+'</span></td><td>'+r.opens+'</td><td>'+r.attempts+'</td><td>'+(r.best!=null?r.best+'٪':'—')+'</td><td>'+ago(r.last)+'</td></tr>'});
 h+='</table></div><div class="m" style="margin-top:8px">حلّ '+done+' من '+S.length+'. الاختبارات الورقية تُحسب «حلّ» عند ظهور النتيجة النهائية. الكود الجماعي يظهر كوحدة واحدة.</div></div>';
 h+='<div class="card"><h2>🕒 آخر الأنشطة</h2>'+(D.feed.length?D.feed.map(function(x){return'<div style="padding:6px 0;border-bottom:1px solid #eef3f8;font-size:14px"><b>'+esc(x.name)+'</b> '+(x.kind==='attempt'?'حلّ <b>'+esc(nm(x.page))+'</b>'+(x.sub?' ('+esc(x.sub)+')':'')+(x.score!=null?' — '+x.score+'٪':''):'فتح <b>'+esc(nm(x.page))+'</b>')+' <span class="m">· '+ago(x.created_at)+'</span></div>'}).join(''):'<p class="m">لا يوجد نشاط بعد.</p>')+'</div>';
 app.innerHTML=h;
 if(fq){var n=document.getElementById('q');n.focus();n.setSelectionRange(pos,pos)}
 var $=function(i){return document.getElementById(i)};
 $('rf').onclick=load;
 $('rq').onclick=async function(){if(!ST.require_login&&!confirm('بعد التفعيل لن يدخل الموقع إلا من معه كود (أو في فترة التجربة). متأكد؟'))return;await api('setting',{key:'require_login',value:!ST.require_login});load()};
 $('tr').onchange=async function(e){await api('setting',{key:'trial_minutes',value:+e.target.value});load()};
 $('cts').onclick=async function(){await api('setting',{key:'contact',value:$('ct').value});load()};
 $('ad').onclick=async function(){var v=$('nn').value;if(!v.trim())return;var r=await api('add',{names:v,kind:$('kd').value,max_devices:$('md').value,days:+$('vd').value});await load();var t=r.added.map(function(a){return a.name+'\t'+fmtC(a.code)}).join('\n');
  $('added').innerHTML='<p class="m">تمت الإضافة. انسخ القائمة وابعت لكل شخص كوده (أو استخدم «رسالة واتساب» من قائمة الإجراءات):</p><textarea readonly>'+esc(t)+'</textarea>'};
 $('ps').onchange=function(e){pg=e.target.value;draw()};
 $('q').oninput=function(e){q=e.target.value;draw()};
 $('cs').onclick=function(){var rows=[['الاسم','النوع','الكود','الحالة','الأجهزة','الصلاحية','محاولات','المتوسط','دقائق','آخر دخول']].concat(S.map(function(s){return[s.name,s.kind==='group'?'جماعي':'فردي',fmtC(s.code),s.status==='active'?(isExp(s)?'منتهي':'مفعّل'):'محظور',s.devices+'/'+(s.max_devices||'∞'),s.expires_at||'',s.attempts,s.avg==null?'':s.avg,Math.round(s.secs/60),s.last_seen||'']}));
  var c='\ufeff'+rows.map(function(r){return r.map(function(x){return'"'+String(x).replace(/"/g,'""')+'"'}).join(',')}).join('\n');var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv'}));a.download='students.csv';a.click()};
 app.querySelectorAll('select[data-s]').forEach(function(sel){sel.onchange=async function(){var id=+sel.dataset.s,v=sel.value,s=S.filter(function(x){return x.id===id})[0];if(!v)return;
  try{
   if(v==='tg')await api('status',{id:id,status:s.status==='active'?'blocked':'active'});
   else if(v==='e30')await api('update',{id:id,add_days:30});
   else if(v==='e365')await api('update',{id:id,add_days:365});
   else if(v==='ne')await api('update',{id:id,no_expiry:1});
   else if(v==='md'){var n=prompt('أقصى عدد أجهزة لهذا الكود (٠ = بلا حد):',s.max_devices);if(n===null){draw();return}await api('update',{id:id,max_devices:n})}
   else if(v==='rd'){if(!confirm('سيُمسح تسجيل الأجهزة ويقدر الكود يدخل من أجهزة جديدة. متأكد؟')){draw();return}await api('resetdev',{id:id})}
   else if(v==='wa'){var t='السلام عليكم '+s.name+'\nمرحبًا بك في منصة البوابة التعليمية\nالرابط: '+location.origin+'\nكودك: '+fmtC(s.code)+'\nاكتب الكود مرة واحدة عند أول دخول.';window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank');draw();return}
   else if(v==='del'){if(!confirm('حذف الكود ونتائجه نهائيًا؟')){draw();return}await api('delete',{id:id})}
   load()}catch(e){if(e)alert(e.message);draw()}}});
}
load();
</script></body></html>
