/* ---------- نوافذ ---------- */
function dialog(html,cls){var o=document.createElement('div');o.className='ov';o.innerHTML='<div class="dlg '+(cls||'')+'" role="dialog" aria-modal="true">'+html+'</div>';document.body.appendChild(o);o.addEventListener('mousedown',function(e){if(e.target===o)o.remove()});document.addEventListener('keydown',function k(e){if(e.key==='Escape'){o.remove();document.removeEventListener('keydown',k)}});var f=o.querySelector('input,select,textarea');if(f)setTimeout(function(){f.focus()},30);return o}

function permGrid(sel,locked){var s={};(sel||[]).forEach(function(k){s[k]=1});

function wireGrid(root){var grid=root.querySelector('[data-grid]');if(!grid)return;var N=D.needs||{};
 var box=function(k){return grid.querySelector('[data-perm="'+k+'"]')};
 var sync=function(){grid.querySelectorAll('[data-gall]').forEach(function(a){var it=grid.querySelectorAll('[data-g="'+a.dataset.gall+'"]');a.checked=[].every.call(it,function(i){return i.checked})})};
 var on=function(k){var b=box(k);if(b&&!b.checked){b.checked=true;(N[k]||[]).forEach(on)}else if(b)(N[k]||[]).forEach(on)};
 var off=function(k){Object.keys(N).forEach(function(c){if(N[c].indexOf(k)>=0){var b=box(c);if(b&&b.checked){b.checked=false;off(c)}}})};
 grid.addEventListener('change',function(e){var t=e.target;if(t.dataset.gall){grid.querySelectorAll('[data-g="'+t.dataset.gall+'"]').forEach(function(i){i.checked=t.checked;if(t.checked)on(i.dataset.perm);else off(i.dataset.perm)})}else if(t.dataset.perm){if(t.checked)on(t.dataset.perm);else off(t.dataset.perm)}sync()});sync()}

function setGrid(root,list){root.querySelectorAll('[data-perm]').forEach(function(i){i.checked=list.indexOf(i.dataset.perm)>=0});root.querySelectorAll('[data-gall]').forEach(function(a){a.checked=[].every.call(root.querySelectorAll('[data-g="'+a.dataset.gall+'"]'),function(i){return i.checked})})}

 if(t.dataset.addm){var sid=+t.value;if(sid)act(function(){return api('groups/member',{group_id:+t.dataset.addm,student_id:sid,action:'add'})},'تمت إضافة الطالب');return}
 if(t.dataset.cr){var row=t.closest('tr'),b2={course:t.dataset.cr,staff_id:+t.dataset.sid};row.querySelectorAll('[data-cr]').forEach(function(i){b2[i.dataset.k]=i.checked});act(function(){return api('courses/assign',b2)},'تم تحديث صلاحيات المقرر');return}
 if(t.dataset.lead){act(function(){return api('leads/update',{id:+t.dataset.lead,status:t.value})},'تم تحديث الحالة');return}
 if(t.dataset.s){var id=+t.dataset.s,v2=t.value,s=D.students.filter(function(x){return x.id===id})[0];t.value='';if(!v2||!s)return;
  if(v2==='tg')return act(function(){return api('status',{id:id,status:s.status==='active'?'blocked':'active'})},s.status==='active'?'تم الحظر':'تم التفعيل');
  if(v2==='e30')return act(function(){return api('update',{id:id,add_days:30})},'تم التمديد ٣٠ يومًا');
  if(v2==='e365')return act(function(){return api('update',{id:id,add_days:365})},'تم التمديد سنة');
  if(v2==='ex'){var d=await promptBox('عدد الأيام المراد إضافتها','30','number');if(d&&+d>0)act(function(){return api('update',{id:id,add_days:+d})},'تم التمديد');return}
  if(v2==='ne'){if(await confirmBox('جعل صلاحية «'+esc(s.name)+'» دائمة بدون انتهاء؟'))act(function(){return api('update',{id:id,no_expiry:1})},'تم');return}
  if(v2==='rn'){var n=await promptBox('الاسم الجديد',s.name);if(n&&n.trim())act(function(){return api('update',{id:id,name:n})},'تم تعديل الاسم');return}
  if(v2==='md'){var mx=await promptBox('أقصى عدد أجهزة (٠ = بلا حد)',s.max_devices,'number');if(mx!==null)act(function(){return api('update',{id:id,max_devices:mx})},'تم الحفظ');return}
  if(v2==='ep')return act(function(){return api('update',{id:id,end_pause:1})},'تم إنهاء الاستراحة');
  if(v2==='rd'){if(await confirmBox('سيُمسح تسجيل الأجهزة ويقدر الكود يدخل من أجهزة جديدة. متأكد؟'))act(function(){return api('resetdev',{id:id})},'تم تصفير الأجهزة');return}
  if(v2==='wa'){var tx='السلام عليكم '+s.name+'\nمرحبًا بك في منصة البوابة التعليمية\nالرابط: '+location.origin+'\nكودك: '+fmtC(s.code)+'\nاكتب الكود مرة واحدة عند أول دخول.';window.open('https://wa.me/?text='+encodeURIComponent(tx),'_blank');return}
  if(v2==='cp'){navigator.clipboard.writeText(fmtC(s.code)).then(function(){toast('تم نسخ الكود','ok')});return}
  if(v2==='del'){if(await confirmBox('حذف كود «'+esc(s.name)+'» ونتائجه نهائيًا؟',true))act(function(){return api('delete',{id:id})},'تم الحذف');return}
 }
});
load();
</script></body></html>
