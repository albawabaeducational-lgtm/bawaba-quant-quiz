<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c2440">
  <title>اختبار تحديد المستوى | البوابة التعليمية</title>
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/bw-theme.css">
  <style>
    body.bwt-hub { color: #142338; line-height: 1.7; }
    .pw { width: min(860px, calc(100% - 32px)); margin: 36px auto 70px; }
    .pw h1 { font-size: clamp(26px, 3.4vw, 36px); color: var(--bw-navy); margin: 0 0 6px; }
    .sub { color: #5a6b80; margin: 0 0 22px; }
    .card { background: #fff; border: 1px solid var(--bw-line); border-radius: 20px; padding: 24px; margin-bottom: 18px; }
    .card h3 { margin: 0 0 6px; font-size: 19px; color: var(--bw-navy); }
    .btn { display: inline-flex; align-items: center; justify-content: center; font: 600 15px "IBM Plex Sans Arabic", Tahoma, sans-serif; text-decoration: none; border: 0; border-radius: 12px; padding: 11px 20px; cursor: pointer; white-space: nowrap; }
    .btn:disabled { opacity: .45; cursor: default; }
    .btn-gold { background: var(--bw-gold); color: var(--bw-night); }
    .btn-navy { background: var(--bw-navy); color: #fff; }
    .btn-soft { background: #eaf2f9; color: var(--bw-navy); }
    .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; margin: 18px 0 22px; border: 1px solid var(--bw-line); border-radius: 16px; }
    .facts div { padding: 14px 16px; border-inline-start: 1px solid var(--bw-line); }
    .facts div:first-child { border-inline-start: 0; }
    .facts b { display: block; font-family: "Readex Pro", sans-serif; font-size: 24px; color: var(--bw-navy); }
    .facts span { color: #5a6b80; font-size: 14px; }
    .how { margin: 0 0 20px; padding-inline-start: 20px; color: #3b4b60; }
    /* شاشة السؤال */
    .qhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; font-weight: 600; color: #5a6b80; font-size: 14.5px; }
    .qhead .sec { color: var(--bw-navy); }
    .track { height: 8px; background: #e3ebf3; border-radius: 99px; overflow: hidden; margin-bottom: 18px; }
    .track i { display: block; height: 100%; background: var(--bw-gold); border-radius: 99px; transition: width .2s; }
    .ty { display: inline-block; background: var(--bw-gold-soft); color: #7a5300; font-weight: 600; font-size: 13px; border-radius: 99px; padding: 2px 12px; margin-bottom: 10px; }
    .psg { background: var(--bw-paper); border: 1px solid var(--bw-line); border-radius: 14px; padding: 14px 16px; margin-bottom: 14px; max-height: 300px; overflow: auto; font-size: 15.5px; line-height: 2; }
    .stem { font-size: 19px; font-weight: 600; margin-bottom: 16px; line-height: 1.9; }
    .stem img { max-width: 100%; height: auto; border-radius: 10px; display: block; margin: 0 auto; }
    .opts { display: grid; gap: 10px; }
    .opts.grid4 { grid-template-columns: repeat(4, 1fr); }
    .opt { display: flex; gap: 10px; align-items: center; text-align: start; width: 100%; font: 500 16px "IBM Plex Sans Arabic", Tahoma, sans-serif; color: #142338; background: #fff; border: 1.5px solid var(--bw-line); border-radius: 14px; padding: 12px 14px; cursor: pointer; }
    .opt:hover { border-color: var(--bw-sea); }
    .opt .l { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: #eaf2f9; color: var(--bw-navy); font-weight: 700; }
    .opt.on { border-color: var(--bw-navy); background: #f1f6fb; }
    .opt.on .l { background: var(--bw-navy); color: #fff; }
    .opts.grid4 .opt { justify-content: center; font-size: 20px; font-weight: 700; }
    .nav { display: flex; gap: 10px; justify-content: space-between; margin-top: 20px; }
    .dots { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
    .dots button { width: 30px; height: 30px; border-radius: 9px; border: 1.5px solid var(--bw-line); background: #fff; font: 600 13px "IBM Plex Sans Arabic", sans-serif; cursor: pointer; color: #5a6b80; }
    .dots button.a { background: #eaf2f9; color: var(--bw-navy); border-color: #c9dbeb; }
    .dots button.c { border-color: var(--bw-gold); box-shadow: 0 0 0 1.5px var(--bw-gold); }
    /* النتيجة */
    .lvl { background: var(--bw-night); color: #fff; border-radius: 22px; padding: 26px; margin-bottom: 18px; box-shadow: -8px 8px 0 var(--bw-gold); }
    .lvl small { color: var(--bw-gold); font-weight: 600; }
    .lvl h2 { margin: 2px 0 6px; font-size: clamp(24px, 3vw, 32px); }
    .lvl p { margin: 0; color: #c3d3e4; }
    .score { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 18px; border-top: 1px solid #ffffff26; }
    .score div { padding: 14px 0 0; }
    .score b { display: block; font-family: "Readex Pro", sans-serif; font-size: 28px; }
    .score span { color: #c3d3e4; font-size: 14px; }
    .sk { display: grid; grid-template-columns: minmax(0, 1fr) 140px 54px; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid #eef3f8; font-size: 15px; }
    .sk:last-child { border-bottom: 0; }
    .bar { height: 8px; background: #eaf1f5; border-radius: 99px; overflow: hidden; }
    .bar i { display: block; height: 100%; border-radius: 99px; }
    .lv-r i { background: #c2412f; } .lv-o i { background: var(--bw-gold); } .lv-g i { background: #1d8a58; }
    .sk b { text-align: left; font-family: "Readex Pro", sans-serif; }
    .plan { list-style: none; margin: 0; padding: 0; counter-reset: s; }
    .plan li { counter-increment: s; display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 12px; padding: 14px 0; border-bottom: 1px solid #eef3f8; }
    .plan li:last-child { border-bottom: 0; }
    .plan li::before { content: counter(s, arabic-indic); width: 34px; height: 34px; border-radius: 50%; background: var(--bw-gold); color: var(--bw-night); font-weight: 700; display: grid; place-items: center; font-family: "Readex Pro", sans-serif; }
    .plan b { display: block; color: var(--bw-navy); font-size: 16.5px; }
    .plan p { margin: 2px 0 10px; color: #5a6b80; font-size: 14.5px; }
    .rv { border-top: 1px solid #eef3f8; padding: 14px 0; }
    .rv .stem { font-size: 16px; margin-bottom: 8px; }
    .rv .stem img { max-width: 420px; margin: 0; }
    .rv .ans { font-size: 14.5px; }
    .rv .ans .x { color: #c2412f; font-weight: 600; } .rv .ans .ok { color: #1d8a58; font-weight: 600; }
    .note { color: #5a6b80; font-size: 13.5px; text-align: center; }
    .prev { background: var(--bw-gold-soft); color: #6b4a00; border-radius: 14px; padding: 10px 14px; font-weight: 600; margin-bottom: 18px; font-size: 14.5px; }
    @media (max-width: 640px) {
      .facts, .score { grid-template-columns: 1fr 1fr 1fr; }
      .facts div { padding: 10px; } .facts b { font-size: 20px; }
      .card { padding: 18px; }
      .opts.grid4 { grid-template-columns: 1fr 1fr; }
      .sk { grid-template-columns: minmax(0, 1fr) 80px 46px; }
      .rv .stem img { max-width: 100%; }
    }
  </style>
</head>
<body class="bwt-hub">
  <div id="bw-shell"><a class="bws-brand" href="/"><img src="/icons/logo.jpg" alt=""><b>البوابة التعليمية<small>منصة الاختبارات</small></b></a><span class="bws-title">اختبار تحديد المستوى</span><span class="bws-tools"></span><a class="bws-back" href="/#tests">كل الاختبارات</a></div>
  <main class="pw" id="app"><p class="sub">جارٍ تجهيز الاختبار…</p></main>

<script>
(function () {
  'use strict';
  var app = document.getElementById('app'), L = ['أ', 'ب', 'ج', 'د'];
  var TYN = ['التناظر اللفظي', 'إكمال الجمل', 'الخطأ السياقي', 'استيعاب المقروء', 'المفردة الشاذة'];
  var TIP = ['حدّد العلاقة بين الكلمتين بجملة قصيرة، ثم طبّقها على كل خيار.', 'اقرأ الجملة كاملة بعد وضع الخيار؛ المعنى العام هو الحَكَم.', 'ابحث عن الكلمة التي تكسر معنى الجملة، لا عن الخطأ النحوي.', 'ارجع للنص قبل الإجابة، ولا تعتمد على معلوماتك خارجه.', 'ابحث عن الرابط المشترك بين ثلاث كلمات، والرابعة هي الشاذة.'];
  var AR = function (n) { return String(n).replace(/\d/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'[d]; }); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var BR = function (s) { return esc(s).replace(/\n/g, '<br>'); };
  var PK = 'bw-place-v1';
  var CNT = function (n, w1, w2, wp, ws) { return n === 1 ? w1 : n === 2 ? w2 : AR(n) + ' ' + (n <= 10 ? wp : ws); };
  function get(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function put(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function pick(a, n) { return shuffle(a.slice()).slice(0, n); }

  // لو لم تُحمَّل البنوك مع الصفحة (مثلًا بدون قاعدة بيانات) تُحمَّل هنا
  var need = ['aksam lafzi', 'aksam kamy'].filter(function (c) { return !(window.__BWD || {})[c]; }), left = need.length;
  if (!left) main(); else need.forEach(function (c) { var sc = document.createElement('script'); sc.src = '/api/exam/data?c=' + encodeURIComponent(c); sc.onload = sc.onerror = function () { if (!--left) main(); }; document.head.appendChild(sc); });
  function main() {
    // الأسئلة من بنكَي «أقسام اللفظي» و«أقسام الكمي» نفسيهما (مع تعديلات المعلمين)
    var bank = function (slug) { return window.__bwBank ? window.__bwBank(slug) : ((window.__BWD || {})[slug] || null); };
    var V = bank('aksam lafzi'), K = bank('aksam kamy');
    if (!V || !K || !V.qs || !K.qs) { app.innerHTML = '<div class="card"><h3>تعذّر تحميل الأسئلة</h3><p class="sub">تأكد من الاتصال بالإنترنت ثم أعد تحميل الصفحة.</p><button class="btn btn-navy" onclick="location.reload()">إعادة المحاولة</button></div>'; return; }
    var VN = {}, KN = {}; V.secs.forEach(function (s) { VN[s.id] = s.name; }); K.secs.forEach(function (s) { KN[s.id] = s.name; });

    function build() {
      var vq = V.qs.filter(function (a) { return VN[a[1]] !== undefined && a[5] && a[5].length === 4; }), out = [];
      var byT = {}; vq.forEach(function (a) { (byT[a[2]] = byT[a[2]] || []).push(a); });
      [[0, 2], [1, 2], [2, 2], [4, 1]].forEach(function (x) { pick(byT[x[0]] || [], x[1]).forEach(function (a) { out.push({ s: 'v', a: a }); }); });
      // استيعاب المقروء: نص واحد مع ٣ من أسئلته
      var byP = {}; (byT[3] || []).forEach(function (a) { if (a[3] >= 0) (byP[a[1] + ':' + a[3]] = byP[a[1] + ':' + a[3]] || []).push(a); });
      var ps = Object.keys(byP).filter(function (k) { return byP[k].length >= 3; }), pk = ps.length ? ps[Math.floor(Math.random() * ps.length)] : null;
      if (pk) byP[pk].slice(0, 3).forEach(function (a) { out.push({ s: 'v', a: a }); });
      // الكمي: سؤال واحد من ١٠ اختبارات موزعة على كامل البنك (من الأسهل للأصعب تقريبًا)
      var ks = K.secs.map(function (s) { return s.id; }).filter(function (id) { return K.qs.some(function (a) { return a[1] === id; }); }), n = Math.min(10, ks.length);
      for (var i = 0; i < n; i++) { var sid = ks[Math.floor(i * ks.length / n + Math.random() * ks.length / n)], pool = K.qs.filter(function (a) { return a[1] === sid; }); if (pool.length) out.push({ s: 'k', a: pool[Math.floor(Math.random() * pool.length)] }); }
      return out;
    }

    var Q = [], ans = {}, pos = 0, t0 = 0, live = false, tick = null;
    function kimg(a) {
      return String(a[4] || '').replace(/(<img\b[^>]*\bsrc=")([^"]+)(")/i, function (_, x, s, y) { return x + (/^\/api\/exam\/img\/\d+$/.test(s) ? s : 'img/' + a[0] + '.webp') + y; }).replace(/<img\b/i, '<img decoding="async" alt="صورة السؤال"');
    }
    function stemHtml(q, noPsg) {
      var a = q.a;
      if (q.s === 'k') return '<div class="stem">' + kimg(a) + '</div>';
      return (!noPsg && a[3] >= 0 && V.ps && V.ps[a[3]] ? '<div class="psg">' + BR(V.ps[a[3]]) + '</div>' : '') + '<div class="stem">' + BR(a[4]) + '</div>';
    }
    function fmt(s) { return AR(Math.floor(s / 60)) + ':' + AR(String(s % 60).padStart(2, '0')); }

    function intro() {
      var last = (get(PK, []) || []).slice(-1)[0];
      app.innerHTML = '<h1>اختبار تحديد المستوى</h1><p class="sub">٢٠ سؤالًا من الكمي واللفظي تعرف بها مستواك الآن، ومن أين تبدأ، وأي المهارات تحتاج تركيزك.</p>'
        + (last ? '<div class="prev">آخر مرة: ' + esc(last.lvl) + ' بنسبة ' + AR(last.p) + '٪ (' + new Date(last.d).toLocaleDateString('ar-SA-u-nu-arab', { day: 'numeric', month: 'long' }) + '). أعد الاختبار لترى تقدمك.</div>' : '')
        + '<div class="card"><div class="facts" style="margin-top:0"><div><b>' + AR(Q.length) + '</b><span>سؤالًا</span></div><div><b>~' + AR(Q.length) + '</b><span>دقيقة تقريبًا</span></div><div><b>٥</b><span>مهارات لفظية + الكمي</span></div></div>'
        + '<ul class="how"><li>الأسئلة مختارة عشوائيًا من بنوك المنصة، فكل محاولة مختلفة.</li><li>لا يوجد مؤقت إجباري، لكن حاول أن تجيب في دقيقة تقريبًا لكل سؤال كالاختبار الحقيقي.</li><li>أجب حتى لو لم تكن متأكدًا؛ الهدف معرفة مستواك الحقيقي.</li><li>في النهاية تحصل على مستواك وخطة تبدأ بها، وتُحفظ أخطاؤك في مجلد الأسئلة الخاطئة.</li></ul>'
        + '<button class="btn btn-gold" id="go">ابدأ الاختبار</button></div>';
      document.getElementById('go').onclick = start;
    }
    function start() {
      Q = build(); ans = {}; pos = 0; t0 = Date.now(); live = true;
      clearInterval(tick); tick = setInterval(function () { var e = document.getElementById('tm'); if (e) e.textContent = fmt(Math.floor((Date.now() - t0) / 1000)); }, 1000);
      show(); scrollTo(0, 0);
    }
    function show() {
      var q = Q[pos], a = q.a, nA = Object.keys(ans).length, last = pos === Q.length - 1;
      var h = '<div class="qhead"><span class="sec">' + (q.s === 'k' ? 'القسم الكمي' : 'القسم اللفظي') + ' · سؤال ' + AR(pos + 1) + ' من ' + AR(Q.length) + '</span><span id="tm">' + fmt(Math.floor((Date.now() - t0) / 1000)) + '</span></div>'
        + '<div class="track"><i style="width:' + Math.round(nA / Q.length * 100) + '%"></i></div><div class="card">'
        + (q.s === 'v' ? '<span class="ty">' + TYN[a[2]] + '</span>' : '') + stemHtml(q)
        + '<div class="opts' + (q.s === 'k' ? ' grid4' : '') + '">' + (q.s === 'k' ? L : a[5]).map(function (o, i) { return '<button type="button" class="opt' + (ans[pos] === i ? ' on' : '') + '" data-o="' + i + '">' + (q.s === 'k' ? esc(o) : '<span class="l">' + L[i] + '</span><span>' + esc(o) + '</span>') + '</button>'; }).join('') + '</div>'
        + '<div class="nav"><button class="btn btn-soft" id="pv"' + (pos ? '' : ' disabled') + '>السابق</button>' + (last ? '<button class="btn btn-gold" id="fin">إنهاء الاختبار وعرض مستواي</button>' : '<button class="btn btn-navy" id="nx">التالي</button>') + '</div>'
        + '<div class="dots">' + Q.map(function (_, i) { return '<button type="button" class="' + (ans[i] !== undefined ? 'a' : '') + (i === pos ? ' c' : '') + '" data-g="' + i + '" aria-label="سؤال ' + (i + 1) + '">' + AR(i + 1) + '</button>'; }).join('') + '</div></div>';
      app.innerHTML = h;
    }
    app.addEventListener('click', function (e) {
      if (!live) return;
      var b = e.target.closest('button'); if (!b) return;
      if (b.dataset.o !== undefined) { ans[pos] = +b.dataset.o; if (pos < Q.length - 1) { show(); var at = pos; setTimeout(function () { if (live && pos === at) { pos++; show(); } }, 220); } else show(); return; }
      if (b.dataset.g !== undefined) { pos = +b.dataset.g; show(); return; }
      if (b.id === 'pv' && pos) { pos--; show(); }
      else if (b.id === 'nx') { pos++; show(); }
      else if (b.id === 'fin') {
        var miss = Q.length - Object.keys(ans).length;
        if (miss && !confirm('تركت ' + CNT(miss, 'سؤالًا واحدًا', 'سؤالين', 'أسئلة', 'سؤالًا') + ' بدون إجابة. هل تريد الإنهاء؟')) return;
        finish();
      }
    });
    addEventListener('beforeunload', function (e) { if (live && Object.keys(ans).length) { e.preventDefault(); e.returnValue = ''; } });

    function level(p) { return p >= 80 ? ['متقدم', 'مستواك قوي. ركّز الآن على السرعة والاختبارات الكاملة بالمؤقت.'] : p >= 60 ? ['جيد', 'أساسك جيد، وتحتاج تدريبًا مركزًا على المهارات الأضعف لترفع درجتك.'] : p >= 40 ? ['متوسط', 'عندك أساس، لكن تحتاج تدريبًا منتظمًا على كل المهارات قبل المحاكاة الكاملة.'] : ['مرحلة التأسيس', 'ابدأ بالتأسيس خطوة بخطوة؛ الأقسام القصيرة أولًا ثم الاختبارات الكاملة.']; }
    function lv(p) { return p >= 80 ? 'g' : p >= 50 ? 'o' : 'r'; }
    function finish() {
      live = false; clearInterval(tick);
      var used = Math.floor((Date.now() - t0) / 1000), R = { v: [0, 0], k: [0, 0], t: {} }, wrong = [], date = new Date().toISOString();
      var EV = get('verbal-quiz-errors-v1', {}) || {}, EK = get('quant-quiz-errors-v1', {}) || {};
      Q.forEach(function (q, i) {
        var a = q.a, ok = ans[i] === a[6], S = R[q.s]; S[1]++; if (ok) S[0]++;
        if (q.s === 'v') { var t = R.t[a[2]] || (R.t[a[2]] = [0, 0]); t[1]++; if (ok) t[0]++; }
        if (!ok) { wrong.push(i); (q.s === 'k' ? EK : EV)[a[0]] = { id: a[0], sectionId: a[1], selected: ans[i] === undefined ? null : ans[i], correct: a[6], date: date }; }
      });
      put('verbal-quiz-errors-v1', EV); put('quant-quiz-errors-v1', EK);
      var pc = function (x) { return x[1] ? Math.round(x[0] / x[1] * 100) : 0; }, P = pc([R.v[0] + R.k[0], R.v[1] + R.k[1]]), pv = pc(R.v), pk = pc(R.k), L2 = level(P);
      var hist = get(PK, []) || []; hist.push({ d: date, p: P, v: pv, k: pk, t: R.t, lvl: L2[0], u: used }); put(PK, hist.slice(-10));

      // الخطة: خطوات مرتبة حسب نتيجتك
      var weakT = Object.keys(R.t).map(function (k) { return { t: +k, p: pc(R.t[k]) }; }).filter(function (x) { return x.p < 60; }).sort(function (a, b) { return a.p - b.p; }).slice(0, 3);
      var wv = [], wk = []; wrong.forEach(function (i) { var q = Q[i]; var arr = q.s === 'k' ? wk : wv; if (arr.indexOf(q.a[1]) < 0) arr.push(q.a[1]); });
      var steps = [];
      if (pv < 50 || (R.t[0] && pc(R.t[0]) < 50)) steps.push(['ابدأ بتأسيس اللفظي (التناظر)', 'التناظر أكثر أسئلة اللفظي تكرارًا، وتأسيسه يرفع درجتك بسرعة. حلّ اختبارات التأسيس بالترتيب.', '<a class="btn btn-navy" href="/tasis%20lafzi.html.html">افتح تأسيس اللفظي</a>']);
      if (weakT.length) steps.push(['ركّز على: ' + weakT.map(function (x) { return TYN[x.t]; }).join('، '), weakT.map(function (x) { return TIP[x.t]; }).join(' '), wv.length ? '<button class="btn btn-navy" data-pr="lafzi" data-ids="' + wv.slice(0, 5).join(',') + '">تدرّب على أقسام اللفظي التي أخطأت فيها</button>' : '']);
      else if (pv >= 60) steps.push(['لفظيك جيد، حافظ عليه', 'حلّ قسمًا لفظيًا واحدًا يوميًا على الأقل حتى لا تفقد المستوى.', '<a class="btn btn-soft" href="/aksam%20lafzi.html">افتح أقسام اللفظي</a>']);
      var kfirst = K.secs.slice(0, 3).map(function (s) { return s.id; });
      if (pk < 60) steps.push(['الكمي: ابدأ من أول الأقسام بالترتيب', 'نتيجتك في الكمي ' + AR(pk) + '٪. أقسام الكمي مرتبة، فابدأ من الأوائل وراجع كل سؤال تخطئ فيه قبل أن تنتقل.', '<button class="btn btn-navy" data-pr="kamy" data-ids="' + kfirst.join(',') + '">ابدأ أول ٣ أقسام كمي</button>']);
      else steps.push(['الكمي: تدرّب على ما أخطأت فيه ثم تقدّم', 'نتيجتك في الكمي ' + AR(pk) + '٪. ثبّت المهارة بحل الأقسام التي جاءت منها أخطاؤك.', wk.length ? '<button class="btn btn-navy" data-pr="kamy" data-ids="' + wk.slice(0, 5).join(',') + '">تدرّب على أقسام الكمي التي أخطأت فيها</button>' : '<a class="btn btn-soft" href="/aksam%20kamy.html">افتح أقسام الكمي</a>']);
      if (P >= 70) steps.push(['اختبر نفسك في المحاكي المحوسب', 'مستواك يسمح بالتدريب على الاختبار الكامل بالمؤقت. اجعله مرة في الأسبوع على الأقل.', '<a class="btn btn-gold" href="/muhaky%20mohawsab.html">ادخل المحاكي المحوسب</a>']);
      if (wrong.length) steps.push(['راجع أخطاء هذا الاختبار', 'حُفظ ' + CNT(wrong.length, 'سؤال واحد', 'سؤالان', 'أسئلة', 'سؤالًا') + ' في مجلد الأسئلة الخاطئة لتراجعها لاحقًا، وتجد حلولها في الأسفل الآن.', '<a class="btn btn-soft" href="#review">اعرض الحلول</a>']);
      steps.push(['تابع تقدمك', 'صفحة «تقدمي» تقترح عليك خطوتك التالية بعد كل تدريب. أعد هذا الاختبار بعد أسبوعين لترى الفرق.', '<a class="btn btn-soft" href="/progress.html">افتح تقدمي</a>']);

      var h = '<section class="lvl"><small>مستواك الآن</small><h2>' + L2[0] + '</h2><p>' + L2[1] + '</p><div class="score"><div><b>' + AR(P) + '٪</b><span>النتيجة العامة</span></div><div><b>' + AR(pv) + '٪</b><span>اللفظي</span></div><div><b>' + AR(pk) + '٪</b><span>الكمي</span></div></div></section>';
      h += '<div class="card"><h3>مهاراتك في هذا الاختبار</h3>' + Object.keys(R.t).sort().map(function (k) { var x = R.t[k], p = pc(x); return '<div class="sk lv-' + lv(p) + '"><span>' + TYN[k] + '</span><span class="bar"><i style="width:' + Math.max(4, p) + '%"></i></span><b>' + AR(x[0]) + '/' + AR(x[1]) + '</b></div>'; }).join('')
        + '<div class="sk lv-' + lv(pk) + '"><span>الكمي</span><span class="bar"><i style="width:' + Math.max(4, pk) + '%"></i></span><b>' + AR(R.k[0]) + '/' + AR(R.k[1]) + '</b></div>'
        + '<p class="note" style="text-align:start;margin:10px 0 0">الوقت: ' + fmt(used) + ' دقيقة · عدد الأسئلة قليل، فاعتبر النتيجة مؤشرًا للبداية وليست درجة نهائية.</p></div>';
      h += '<div class="card"><h3>خطتك من الآن</h3><ol class="plan">' + steps.map(function (s) { return '<li><div><b>' + esc(s[0]) + '</b><p>' + esc(s[1]) + '</p>' + s[2] + '</div></li>'; }).join('') + '</ol></div>';
      if (wrong.length) h += '<div class="card" id="review"><h3>حلول الأسئلة التي أخطأت فيها</h3>' + wrong.map(function (i, j) { var q = Q[i], a = q.a, pq = j ? Q[wrong[j - 1]].a : null, same = q.s === 'v' && pq && a[3] >= 0 && pq[3] === a[3] && pq[1] === a[1], opt = function (k) { return q.s === 'k' ? L[k] : L[k] + ') ' + esc(a[5][k]); }; return '<div class="rv">' + (q.s === 'v' ? '<span class="ty">' + TYN[a[2]] + '</span>' : '') + stemHtml(q, same) + '<div class="ans">' + (ans[i] === undefined ? '<span class="x">لم تجب</span>' : 'إجابتك: <span class="x">' + opt(ans[i]) + '</span>') + ' · الصحيحة: <span class="ok">' + opt(a[6]) + '</span></div></div>'; }).join('') + '</div>';
      h += '<p style="text-align:center"><button class="btn btn-soft" id="again">أعد اختبار تحديد المستوى</button></p>';
      app.innerHTML = h; scrollTo(0, 0);
    }
    app.addEventListener('click', function (e) {
      if (live) return;
      var b = e.target.closest('button'); if (!b) return;
      if (b.dataset.pr) { try { localStorage.setItem(b.dataset.pr === 'kamy' ? 'bw-sel-v1' : 'bwv-sel-v1', JSON.stringify(b.dataset.ids.split(',').map(Number))); } catch (x) { } location.href = b.dataset.pr === 'kamy' ? '/aksam%20kamy.html' : '/aksam%20lafzi.html'; }
      else if (b.id === 'again') start();
    });
    Q = build(); intro();
  }
})();
</script>
