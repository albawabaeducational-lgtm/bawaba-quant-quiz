  <link rel="stylesheet" href="bw-theme.css">
  <style>
    /* ألوان وخطوط المنصة (تعمل حتى لو فُتحت الصفحة وحدها من الجهاز) */
    :root { --bw-night: #0c2440; --bw-navy: #12345a; --bw-sea: #1d5c8f; --bw-gold: #e3a92b; --bw-gold-soft: #fbefd2; --bw-paper: #f5f8fb; --bw-line: #dbe5ee; }
    body { margin: 0; font-family: "IBM Plex Sans Arabic", Tahoma, Arial, sans-serif; background: var(--bw-paper); }
    h1, h2, h3 { font-family: "Readex Pro", "IBM Plex Sans Arabic", Tahoma, sans-serif; }
    #bw-shell { position: sticky; top: 0; z-index: 30; min-height: 64px; background: var(--bw-night); color: #fff; display: flex; align-items: center; gap: 12px; padding: 0 max(16px, calc((100% - 1180px) / 2)); box-shadow: 0 2px 0 var(--bw-gold); }
    #bw-shell .bws-brand { display: flex; align-items: center; gap: 10px; color: #fff; text-decoration: none; }
    #bw-shell .bws-brand img { width: 40px; height: 40px; border-radius: 11px; background: #fff; padding: 3px; object-fit: contain; }
    #bw-shell .bws-brand b { font-family: "Readex Pro", sans-serif; }
    #bw-shell .bws-title { color: var(--bw-gold); font-weight: 600; padding-inline-start: 12px; border-inline-start: 1px solid #ffffff2e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #bw-shell .bws-tools { margin-inline-start: auto; display: flex; gap: 8px; align-items: center; }
    #bw-shell .bws-back { color: #fff; text-decoration: none; font-weight: 600; font-size: 14px; border-radius: 10px; padding: 8px 14px; box-shadow: inset 0 0 0 1.5px #ffffff4d; white-space: nowrap; }
    #timer { background: var(--bw-gold); color: var(--bw-night); }
    #timer.urgent { background: #fbe6e2; color: #c2412f; }
    @media (max-width: 700px) { #bw-shell .bws-brand b, #bw-shell .bws-title { display: none; } #bw-shell .bws-back { font-size: 0; padding: 7px 10px; line-height: 1; } #bw-shell .bws-back::before { content: "☰"; font-size: 18px; } }
    body.bwt-hub { color: #142338; line-height: 1.7; }
    .mw { width: min(1080px, calc(100% - 32px)); margin: 28px auto 70px; }
    .hidden { display: none !important; }
    #timer { display: inline-block; font: 700 16px "Readex Pro", sans-serif; border-radius: 10px; padding: 6px 14px; min-width: 70px; text-align: center; direction: ltr; }
    .card { background: #fff; border: 1px solid var(--bw-line); border-radius: 20px; padding: 22px; margin-bottom: 16px; }
    .card h2 { margin: 0 0 6px; font-size: 20px; color: var(--bw-navy); }
    .m { color: #5a6b80; font-size: 14.5px; margin: 0; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font: 600 15px "IBM Plex Sans Arabic", Tahoma, sans-serif; text-decoration: none; border: 0; border-radius: 12px; padding: 11px 18px; cursor: pointer; white-space: nowrap; background: var(--bw-navy); color: #fff; }
    .btn:disabled { opacity: .45; cursor: default; }
    .btn.gold { background: var(--bw-gold); color: var(--bw-night); }
    .btn.soft { background: #eaf2f9; color: var(--bw-navy); }
    .btn.ghost { background: #fff; color: var(--bw-navy); box-shadow: inset 0 0 0 1.5px var(--bw-line); }
    .btn.red { background: #fbe6e2; color: #b4321f; }
    .btn.sm { padding: 7px 12px; font-size: 13.5px; border-radius: 10px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    /* الواجهة */
    .hero { background: var(--bw-night) radial-gradient(circle at 1.5px 1.5px, #ffffff12 1.5px, transparent 0) 0 0 / 26px 26px; color: #fff; border-radius: 22px; padding: 26px; margin-bottom: 16px; box-shadow: -8px 8px 0 var(--bw-gold); }
    .hero .tag { display: inline-block; background: var(--bw-gold); color: var(--bw-night); font-weight: 700; font-size: 13px; border-radius: 99px; padding: 2px 12px; }
    .hero h1 { margin: 10px 0 6px; font-size: clamp(26px, 4vw, 38px); line-height: 1.3; }
    .hero p { margin: 0; color: #c3d3e4; }
    .bank { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; margin-top: 18px; background: #ffffff12; border-radius: 16px; padding: 14px 16px; }
    .bank b { font-family: "Readex Pro", sans-serif; font-size: 26px; color: var(--bw-gold); }
    .bank .track { height: 10px; background: #ffffff26; border-radius: 99px; overflow: hidden; }
    .bank .track i { display: block; height: 100%; background: var(--bw-gold); border-radius: 99px; }
    .bank small { color: #c3d3e4; display: block; margin-top: 4px; }
    .lbl { font-weight: 700; color: var(--bw-navy); margin: 18px 0 8px; display: block; }
    .lbl:first-child { margin-top: 0; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip { font: 600 15px "IBM Plex Sans Arabic", Tahoma, sans-serif; border: 1.5px solid var(--bw-line); background: #fff; color: #142338; border-radius: 14px; padding: 10px 16px; cursor: pointer; min-width: 64px; text-align: center; }
    .chip small { display: block; font-size: 12px; color: #5a6b80; font-weight: 500; }
    .chip.on { background: var(--bw-navy); border-color: var(--bw-navy); color: #fff; }
    .chip.on small { color: #c3d3e4; }
    .build { display: grid; grid-template-columns: 1fr 1fr 1.3fr; gap: 14px; margin-top: 12px; }
    .opt-g { background: var(--bw-paper); border: 1px solid var(--bw-line); border-radius: 16px; padding: 14px; }
    .opt-g .lbl { margin-top: 0; }
    .opt-g .chips { gap: 6px; }
    .opt-g .chip { padding: 9px 12px; flex: 1 1 auto; }
    .go-row { display: flex; gap: 14px; align-items: center; justify-content: space-between; margin-top: 14px; flex-wrap: wrap; }
    .go-row .est { margin-top: 0; flex: 1 1 260px; }
    @media (max-width: 900px) { .build { grid-template-columns: 1fr; } .go-row .btn { width: 100%; } }
    .est { margin-top: 16px; padding: 12px 14px; background: var(--bw-paper); border-radius: 14px; color: #3b4b60; font-size: 14.5px; }
    .resume { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--bw-gold-soft); color: #6b4a00; border-radius: 16px; padding: 12px 16px; margin-bottom: 16px; font-weight: 600; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    /* الاختبار */
    .qwrap { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 16px; align-items: start; }
    .qhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; color: #5a6b80; font-weight: 600; font-size: 14.5px; margin-bottom: 8px; }
    .qhead .mode { background: #eaf2f9; color: var(--bw-navy); border-radius: 99px; padding: 2px 10px; font-size: 12.5px; }
    .qtrack { height: 6px; background: #e3ebf3; border-radius: 99px; overflow: hidden; margin-bottom: 14px; }
    .qtrack i { display: block; height: 100%; background: linear-gradient(90deg, var(--bw-sea), var(--bw-gold)); border-radius: 99px; transition: width .2s; }
    .qimg { position: relative; background: #fff; border-radius: 14px; overflow: hidden; cursor: zoom-in; min-height: 120px; }
    .qimg img { display: block; width: 100%; height: auto; }
    .qimg .zoom { position: absolute; bottom: 10px; left: 10px; background: #0c2440cc; color: #fff; font-size: 12.5px; border-radius: 99px; padding: 3px 10px; pointer-events: none; }
    .opts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 14px; }
    .opt { font: 700 22px "Readex Pro", sans-serif; border: 2px solid var(--bw-line); background: #fff; color: var(--bw-navy); border-radius: 14px; padding: 12px 0; cursor: pointer; }
    .opt:hover { border-color: var(--bw-sea); }
    .opt.on { background: var(--bw-navy); border-color: var(--bw-navy); color: #fff; }
    .opt.ok { background: #e1f4ea; border-color: #1d8a58; color: #17633f; }
    .opt.no { background: #fbe6e2; border-color: #c2412f; color: #b4321f; }
    .fb { margin-top: 12px; border-radius: 12px; padding: 10px 14px; font-weight: 600; }
    .fb.ok { background: #e1f4ea; color: #17633f; } .fb.no { background: #fbe6e2; color: #b4321f; }
    .qnav { display: flex; gap: 8px; justify-content: space-between; margin-top: 14px; flex-wrap: wrap; }
    .side h3 { margin: 0 0 10px; font-size: 16px; color: var(--bw-navy); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(36px, 1fr)); gap: 6px; }
    .grid button { height: 36px; border-radius: 10px; border: 1.5px solid var(--bw-line); background: #fff; font: 600 13px "IBM Plex Sans Arabic", sans-serif; color: #5a6b80; cursor: pointer; position: relative; }
    .grid button.a { background: #eaf2f9; border-color: #c3d6e8; color: var(--bw-navy); }
    .grid button.f::after { content: ""; position: absolute; top: 3px; left: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--bw-gold); }
    .grid button.c { box-shadow: 0 0 0 2px var(--bw-navy); }
    .grid button.ok { background: #e1f4ea; border-color: #9fd6b9; color: #17633f; } .grid button.no { background: #fbe6e2; border-color: #f0b9ae; color: #b4321f; }
    .legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; font-size: 12.5px; color: #5a6b80; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 4px; vertical-align: middle; }
    .keys { margin-top: 12px; font-size: 12.5px; color: #8494a8; line-height: 1.8; }
    .flagbtn.on { background: var(--bw-gold); color: var(--bw-night); box-shadow: none; }

    .res p { margin: 0; color: #c3d3e4; }
    .kp { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 16px; border-top: 1px solid #ffffff26; }
    .kp div { padding-top: 12px; }
    .kp b { display: block; font-family: "Readex Pro", sans-serif; font-size: 24px; }
    .kp span { color: #c3d3e4; font-size: 13.5px; }
    .advice { margin: 0; padding-inline-start: 20px; line-height: 1.9; }
    .rv { border-top: 1px solid #eef3f8; padding: 14px 0; display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 14px; align-items: center; }
    .rv img { width: 100%; border-radius: 10px; border: 1px solid var(--bw-line); cursor: zoom-in; display: block; }
    .rv .st { font-weight: 700; } .rv .st.ok { color: #17633f; } .rv .st.no { color: #b4321f; } .rv .st.na { color: #8a5a00; }
    .rv .ans { margin-top: 4px; font-size: 14.5px; }
    .hist { display: flex; align-items: flex-end; gap: 8px; height: 140px; border-bottom: 1px solid var(--bw-line); padding-top: 8px; }
    .hist div { flex: 1; max-width: 44px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; height: 100%; font-size: 12px; color: #5a6b80; }
    .hist i { display: block; width: 100%; background: var(--bw-navy); border-radius: 8px 8px 0 0; min-height: 4px; }
    .hist div:last-child i { background: var(--bw-gold); }
    .tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
    .tbl td, .tbl th { padding: 8px 6px; border-bottom: 1px solid #eef3f8; text-align: start; }
    .tbl th { color: #5a6b80; font-weight: 600; }
    /* تكبير الصورة */
    .lb { position: fixed; inset: 0; z-index: 2147483400; background: #0c2440ee; display: grid; place-items: center; padding: 16px; cursor: zoom-out; }
    .lb img { max-width: 100%; max-height: 92vh; border-radius: 12px; background: #fff; }
    .dlg { position: fixed; inset: 0; z-index: 2147483300; background: #0c244099; display: grid; place-items: center; padding: 16px; }
    .dlg > div { background: #fff; border-radius: 18px; padding: 22px; width: min(420px, 100%); border-top: 4px solid var(--bw-gold); }
    .dlg h3 { margin: 0 0 8px; color: var(--bw-navy); }
    .dlg p { margin: 0 0 14px; color: #3b4b60; }

      .keys { display: none; }
    }

<script>
(function () {

  var L = ['أ', 'ب', 'ج', 'د'], SIZES = [10, 20, 50, 55];

  var app = document.getElementById('app'), timerEl = document.getElementById('timer');
  var AR = function (n) { return String(n).replace(/\d/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'[d]; }); };

  function get(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function put(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }
  function img(id) { return 'mt/' + String(id).padStart(4, '0') + '.webp'; }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function fmt(s) { s = Math.max(0, Math.round(s)); var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return AR((h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0')); }
  function cnt(n, one, two, few, many) { return n === 1 ? one : n === 2 ? two : AR(n) + ' ' + (n <= 10 ? few : many); }
  function minutesTxt(m) { return m === 1 ? 'دقيقة' : m === 2 ? 'دقيقتان' : AR(m) + (m <= 10 ? ' دقائق' : ' دقيقة'); }

  // ===== ما رآه الطالب: لا يتكرر سؤال حتى يُنهي البنك كله =====
  function seenState() { var s = get(K.seen, null); if (!s || !s.ids) s = { round: 1, ids: [] }; var ok = {}; s.ids = s.ids.filter(function (i) { if (!BY[i] || ok[i]) return false; ok[i] = 1; return true; }); return s; }
  function pick(n) {
    var S = seenState(), seen = {}; S.ids.forEach(function (i) { seen[i] = 1; });
    var fresh = shuffle(Q.filter(function (q) { return !seen[q.id]; }).map(function (q) { return q.id; }));
    if (fresh.length >= n) return { ids: fresh.slice(0, n), newRound: false };
    // البنك قارب على الانتهاء: الباقي كله + أسئلة من دور جديد
    var rest = shuffle(Q.map(function (q) { return q.id; }).filter(function (i) { return fresh.indexOf(i) < 0; }));
    return { ids: fresh.concat(rest.slice(0, n - fresh.length)), newRound: true, fresh: fresh.length };
  }
  function markSeen(ids, newRound) {

    if (newRound) { var left = Q.filter(function (q) { return S.ids.indexOf(q.id) < 0; }).map(function (q) { return q.id; }); S = { round: S.round + 1, ids: ids.filter(function (i) { return left.indexOf(i) < 0; }) }; }

  function save() { if (R && !R.done) put(K.run, R); }

      + '</div><div class="opt-g"><span class="lbl">٢. نوع الاختبار</span><div class="chips" id="md"><button type="button" class="chip' + (pref.mode === 'sim' ? ' on' : '') + '" data-m="sim">محاكاة<small>الإجابات في النهاية</small></button><button type="button" class="chip' + (pref.mode === 'train' ? ' on' : '') + '" data-m="train">تدريب<small>تصحيح فوري</small></button></div>'
      + '</div><div class="opt-g"><span class="lbl">٣. وقت الاختبار</span><div class="chips" id="pr">' + [[60, 'دقيقة للسؤال'], [90, 'دقيقة ونصف'], [45, '٤٥ ثانية'], [0, 'بدون مؤقت']].map(function (p) { return '<button type="button" class="chip' + (pref.per === p[0] ? ' on' : '') + '" data-p="' + p[0] + '"' + (p[0] === 0 && pref.mode === 'sim' ? ' disabled style="opacity:.4"' : '') + '>' + p[1] + '</button>'; }).join('') + '</div>'

    h += '<div class="two"><div class="card"><h2>مجلد الأخطاء</h2><p class="m">' + (errs ? cnt(errs, 'سؤال واحد', 'سؤالان', 'أسئلة', 'سؤالًا') + ' أخطأت فيها. يخرج السؤال من المجلد بعد أن تجيبه صحيحًا ٣ مرات.' : 'كل سؤال تخطئ فيه يُحفظ هنا لتعيد حله.') + '</p><div class="row" style="margin-top:12px"><button class="btn soft" data-a="errs"' + (errs ? '' : ' disabled') + '>افتح المجلد</button><button class="btn ghost" data-a="errtrain"' + (errs ? '' : ' disabled') + '>تدرّب عليها</button></div></div>'
      + '<div class="card"><h2>سجل محاولاتك</h2>' + histHtml(hist) + '</div></div>';
    h += '<div class="card"><h2>تعليمات</h2><ul class="advice"><li><b>المحاكاة:</b> مؤقت ثابت مثل يوم الاختبار، والإجابات الصحيحة تظهر في التقرير النهائي فقط. عند انتهاء الوقت يُسلَّم الاختبار تلقائيًا.</li><li><b>التدريب:</b> ترى التصحيح بعد كل إجابة، ويمكنك إيقاف المؤقت.</li><li>تنقّل بين الأسئلة بحرية من خريطة الأسئلة، وعلّم أي سؤال للمراجعة.</li><li>اضغط على صورة السؤال لتكبيرها. اختصارات لوحة المفاتيح: ١–٤ للإجابة، الأسهم للتنقل، F لتعليم السؤال.</li><li>يُحفظ اختبارك أولًا بأول؛ لو أغلقت الصفحة تكمله من حيث توقفت.</li>' + (done ? '<li><button class="btn ghost sm" data-a="reset">ابدأ البنك من جديد</button> <span class="m">(يعيد كل الأسئلة لقائمة «لم تُحل»)</span></li>' : '') + '</ul></div>';

    clearRun(); save(); test();
  }
  function resume() { var r = get(K.run, null); if (!r || !r.ids) return home(); R = r; if (R.total && R.paused) { R.t0 = Date.now() - (R.total - R.paused) * 1000; delete R.paused; } test(); }
  function stopTimer() { clearInterval(tick); tick = null; timerEl.classList.add('hidden'); }
  function startTimer() {
    stopTimer(); if (!R.total) return;
    timerEl.classList.remove('hidden');
    var t = function () { var l = left(); timerEl.textContent = fmt(l); timerEl.classList.toggle('urgent', l < 60); if (l <= 0) { stopTimer(); finish(true); } };
    t(); tick = setInterval(t, 1000);
  }
  function test() {
    document.body.classList.add('testing'); startTimer(); draw(); window.scrollTo(0, 0);
  }
  function draw() {
    var n = R.ids.length, id = R.ids[R.pos], q = BY[id], a = R.ans[R.pos], answered = Object.keys(R.ans).length, train = R.mode === 'train', shown = train && R.shown[R.pos];
    var h = '<div class="qwrap"><div><div class="qhead"><span>السؤال ' + AR(R.pos + 1) + ' من ' + AR(n) + '</span><span class="mode">' + (R.kind === 'errors' ? 'مراجعة الأخطاء' : train ? 'تدريب' : 'محاكاة') + '</span></div><div class="qtrack"><i style="width:' + (answered / n * 100) + '%"></i></div>'
      + '<div class="card" style="padding:14px"><div class="qimg" data-z="' + id + '"><img src="' + img(id) + '" alt="السؤال ' + AR(R.pos + 1) + '" decoding="async"><span class="zoom">🔍 اضغط للتكبير</span></div>'
      + '<div class="opts">' + L.map(function (l, i) { var c = 'opt'; if (shown) { if (i === q.c) c += ' ok'; else if (i === a) c += ' no'; } else if (a === i) c += ' on'; return '<button type="button" class="' + c + '" data-o="' + i + '"' + (shown ? ' disabled' : '') + ' aria-pressed="' + (a === i) + '">' + l + '</button>'; }).join('') + '</div>'
      + (shown ? '<div class="fb ' + (a === q.c ? 'ok">✓ إجابة صحيحة' : 'no">✗ الإجابة الصحيحة: ' + L[q.c]) + '</div>' : '')
      + '<div class="qnav"><button class="btn ghost" data-a="prev"' + (R.pos ? '' : ' disabled') + '>السابق</button><button class="btn ghost flagbtn' + (R.flag[R.pos] ? ' on' : '') + '" data-a="flag">⚑ ' + (R.flag[R.pos] ? 'معلَّم' : 'علّم للمراجعة') + '</button>' + (R.pos < n - 1 ? '<button class="btn" data-a="next">التالي</button>' : '<button class="btn gold" data-a="end">إنهاء الاختبار</button>') + '</div></div></div>'
      + '<aside class="card side"><h3>خريطة الأسئلة</h3><div class="grid">' + R.ids.map(function (x, i) { var c = ''; if (train && R.shown[i]) c = R.ans[i] === BY[x].c ? 'ok' : 'no'; else if (R.ans[i] !== undefined) c = 'a'; if (R.flag[i]) c += ' f'; if (i === R.pos) c += ' c'; return '<button type="button" class="' + c + '" data-g="' + i + '">' + AR(i + 1) + '</button>'; }).join('') + '</div>'
      + '<div class="legend"><span><i style="background:#eaf2f9;border:1px solid #c3d6e8"></i>مجاب</span><span><i style="background:#fff;border:1px solid var(--bw-line)"></i>لم يُجب</span><span><i style="background:var(--bw-gold);border-radius:50%"></i>معلَّم</span></div>'
      + '<div class="row" style="margin-top:14px"><button class="btn red sm" data-a="end">إنهاء الاختبار</button>' + (train && R.total ? '<button class="btn ghost sm" data-a="pause">' + (R.paused ? '▶ استئناف المؤقت' : '⏸ إيقاف المؤقت') + '</button>' : '') + '</div>'
      + '<div class="keys">⌨ ١–٤ أو أ–د للإجابة · ← → للتنقل · F للتعليم</div></aside></div>';
    app.innerHTML = h;
    // تحميل مسبق للسؤال التالي
    if (R.pos < n - 1) { var pre = new Image(); pre.src = img(R.ids[R.pos + 1]); }
  }
  function answer(i) {
    if (R.mode === 'train' && R.shown[R.pos]) return;
    R.ans[R.pos] = i;
    if (R.mode === 'train') R.shown[R.pos] = 1;
    save(); draw();
    if (R.mode === 'sim' && R.pos < R.ids.length - 1) { var at = R.pos; setTimeout(function () { if (R && !R.done && R.pos === at) { R.pos++; save(); draw(); } }, 260); }
  }
  function confirmEnd() {
    var n = R.ids.length, na = n - Object.keys(R.ans).length, fl = Object.keys(R.flag).length;
    var d = document.createElement('div'); d.className = 'dlg';
    d.innerHTML = '<div><h3>إنهاء الاختبار؟</h3><p>' + (na ? 'تركت ' + cnt(na, 'سؤالًا واحدًا', 'سؤالين', 'أسئلة', 'سؤالًا') + ' بدون إجابة. ' : 'أجبت عن كل الأسئلة. ') + (fl ? 'وعندك ' + cnt(fl, 'سؤال واحد معلَّم', 'سؤالان معلَّمان', 'أسئلة معلَّمة', 'سؤالًا معلَّمًا') + ' للمراجعة.' : '') + (R.total ? '<br>الوقت المتبقي: ' + fmt(left()) : '') + '</p><div class="row"><button class="btn red" data-y>نعم، أنهِ الاختبار</button><button class="btn ghost" data-n>متابعة الحل</button></div></div>';
    document.body.appendChild(d);
    d.querySelector('[data-n]').onclick = function () { d.remove(); };
    d.querySelector('[data-y]').onclick = function () { d.remove(); finish(false); };
  }

  // ===== النتيجة =====
  function finish(auto) {
    stopTimer(); document.body.classList.remove('testing');
    var n = R.ids.length, g = 0, na = 0, used = Math.round(R.total ? Math.min(R.total, (Date.now() - R.t0) / 1000) : (Date.now() - R.t0) / 1000), E = get(K.err, {}) || {}, now = new Date().toISOString();
    R.ids.forEach(function (id, i) {
      var q = BY[id], a = R.ans[i];
      if (a === undefined) na++;
      if (a === q.c) { g++; var e = E[id]; if (e) { e.ok = (e.ok || 0) + 1; e.date = now; if (e.ok >= 3) delete E[id]; } }
      else E[id] = { id: id, sel: a === undefined ? null : a, date: now, ok: 0, m: q.m };
    });
    put(K.err, E);
    var p = Math.round(g / n * 100), hist = get(K.hist, []) || [], prev = null;
    if (R.kind === 'bank') { prev = hist.length ? hist[hist.length - 1] : null; hist.push({ d: now, n: n, g: g, p: p, u: used, m: R.mode }); put(K.hist, hist.slice(-50)); markSeen(R.ids, R.newRound); }
    R.done = true; clearRun();
    var res = { n: n, g: g, na: na, p: p, used: used, auto: auto, prev: prev };
    report(res, 'all');
  }
  function level(p) { return p >= 85 ? 'ممتاز' : p >= 70 ? 'جيد جدًا' : p >= 55 ? 'جيد' : p >= 40 ? 'يحتاج تدريبًا' : 'ابدأ بالتأسيس'; }
  var lastRes = null;
  function report(res, filter) {
    lastRes = res; var n = res.n, avg = Math.round(res.used / n), wrong = n - res.g - res.na;
    var h = '<section class="res"><small>' + (res.auto ? 'انتهى الوقت وسُلِّم الاختبار تلقائيًا' : 'نتيجة الاختبار') + '</small><h2>' + AR(res.g) + ' / ' + AR(n) + ' · ' + AR(res.p) + '٪</h2><p>المستوى: ' + level(res.p) + (res.prev ? ' · محاولتك السابقة ' + AR(res.prev.p) + '٪ (' + (res.p > res.prev.p ? '+' + AR(res.p - res.prev.p) : res.p < res.prev.p ? '−' + AR(res.prev.p - res.p) : 'نفس المستوى') + ')' : '') + '</p>'
      + '<div class="kp"><div><b>' + AR(res.g) + '</b><span>صحيحة</span></div><div><b>' + AR(wrong) + '</b><span>خاطئة</span></div><div><b>' + AR(res.na) + '</b><span>بدون إجابة</span></div><div><b>' + fmt(res.used) + '</b><span>الوقت · ' + AR(avg) + ' ث للسؤال</span></div></div></section>';
    var adv = [];
    if (wrong + res.na) adv.push('<b>راجع أخطاءك الآن:</b> حُفظ ' + cnt(wrong + res.na, 'سؤال واحد', 'سؤالان', 'أسئلة', 'سؤالًا') + ' في مجلد الأخطاء، وتجد الحلول في الأسفل.');
    if (res.na) adv.push('<b>لا تترك سؤالًا بدون إجابة:</b> لا يوجد خصم للخطأ في اختبار القدرات.');
    if (avg > 75 && R.total) adv.push('<b>سرعتك:</b> ' + AR(avg) + ' ثانية للسؤال. حاول النزول تدريجيًا إلى أقل من دقيقة.');
    else if (avg < 25 && res.p < 60) adv.push('<b>تمهّل:</b> إجاباتك سريعة جدًا ودقتك منخفضة. اقرأ السؤال والخيارات كاملة.');
    if (res.p >= 85) adv.push('<b>أداء ممتاز!</b> جرّب اختبار ٥٥ سؤالًا بمؤقت المحاكاة لتختبر قدرتك على التركيز طوال الوقت.');
    h += '<div class="card"><h2>خطوتك التالية</h2><ul class="advice">' + adv.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul><div class="row" style="margin-top:12px"><button class="btn gold" data-a="home">اختبار جديد</button>' + (wrong + res.na ? '<button class="btn soft" data-a="retry">أعد الأسئلة الخاطئة (تدريب)</button>' : '') + '<a class="btn ghost" href="progress.html">تقدمي</a></div></div>';
    var F = { all: 'الكل', no: 'الخاطئة', na: 'بدون إجابة', f: 'المعلَّمة', ok: 'الصحيحة' };
    var items = R.ids.map(function (id, i) { var a = R.ans[i], q = BY[id]; return { i: i, id: id, a: a, q: q, st: a === undefined ? 'na' : a === q.c ? 'ok' : 'no', f: !!R.flag[i] }; });
    var shownItems = items.filter(function (x) { return filter === 'all' || (filter === 'f' ? x.f : x.st === filter); });
    h += '<div class="card"><h2>مراجعة الأسئلة</h2><div class="chips" style="margin:8px 0 4px">' + Object.keys(F).map(function (k) { var c = items.filter(function (x) { return k === 'all' || (k === 'f' ? x.f : x.st === k); }).length; return '<button type="button" class="chip' + (filter === k ? ' on' : '') + '" data-rf="' + k + '"' + (c ? '' : ' disabled style="opacity:.45"') + '>' + F[k] + ' (' + AR(c) + ')</button>'; }).join('') + '</div>'
      + (shownItems.map(function (x) { return '<div class="rv"><img src="' + img(x.id) + '" alt="السؤال ' + AR(x.i + 1) + '" loading="lazy" data-z="' + x.id + '"><div><div class="st ' + x.st + '">' + AR(x.i + 1) + '. ' + (x.st === 'ok' ? '✓ إجابة صحيحة' : x.st === 'no' ? '✗ إجابة خاطئة' : '— لم تُجب') + (x.f ? ' · ⚑ معلَّم' : '') + '</div><div class="ans">' + (x.a !== undefined ? 'إجابتك: <b>' + L[x.a] + '</b> · ' : '') + 'الصحيحة: <b style="color:#17633f">' + L[x.q.c] + '</b></div><div class="m" style="margin-top:4px">' + esc(MN[x.q.m] || '') + '</div></div></div>'; }).join('') || '<p class="m">لا توجد أسئلة هنا.</p>') + '</div>';
    app.innerHTML = h; window.scrollTo(0, 0);
  }

  // ===== مجلد الأخطاء =====
  function errorsView() {
    var E = get(K.err, {}) || {}, arr = Object.keys(E).map(function (k) { return E[k]; }).filter(function (e) { return BY[e.id]; }).sort(function (a, b) { return new Date(b.date) - new Date(a.date); });
    var h = '<div class="card"><div class="row" style="justify-content:space-between"><div><h2>مجلد الأخطاء (' + AR(arr.length) + ')</h2><p class="m">يخرج السؤال من المجلد بعد أن تجيبه صحيحًا ٣ مرات.</p></div><div class="row"><button class="btn" data-a="errtrain"' + (arr.length ? '' : ' disabled') + '>تدرّب عليها</button><button class="btn ghost" data-a="home">رجوع</button></div></div></div>';
    h += '<div class="card">' + (arr.map(function (e) { var q = BY[e.id]; return '<div class="rv"><img src="' + img(e.id) + '" alt="" loading="lazy" data-z="' + e.id + '"><div><div class="ans">' + (e.sel != null ? 'إجابتك: <b style="color:#b4321f">' + L[e.sel] + '</b> · ' : 'لم تُجب · ') + 'الصحيحة: <b style="color:#17633f">' + L[q.c] + '</b></div>' + (e.ok ? '<div class="m" style="color:#17633f">✓ أجبته صحيحًا ' + (e.ok === 1 ? 'مرة' : 'مرتين') + ' من ٣</div>' : '') + '<div class="m">' + esc(MN[q.m] || '') + '</div><button class="btn red sm" style="margin-top:8px" data-del="' + e.id + '">حذف من المجلد</button></div></div>'; }).join('') || '<p class="m">المجلد فارغ. أحسنت!</p>') + '</div>';
    app.innerHTML = h; window.scrollTo(0, 0);
  }

  // ===== تكبير الصورة =====
  function zoom(id) { var d = document.createElement('div'); d.className = 'lb'; d.innerHTML = '<img src="' + img(id) + '" alt="">'; d.onclick = function () { d.remove(); }; document.body.appendChild(d); }

  // ===== الأحداث =====
  app.addEventListener('click', function (e) {
    var z = e.target.closest('[data-z]'); if (z) return zoom(z.getAttribute('data-z'));
    var b = e.target.closest('button'); if (!b || b.disabled) return;
    var d = b.dataset;
    if (d.n) { pref.n = +d.n; put(K.pref, pref); [].forEach.call(b.parentNode.children, function (x) { x.classList.toggle('on', x === b); }); return est(); }
    if (d.m) { pref.mode = d.m; if (d.m === 'sim' && !pref.per) pref.per = 60; put(K.pref, pref); return home(); }
    if (d.p !== undefined) { pref.per = +d.p; put(K.pref, pref); [].forEach.call(b.parentNode.children, function (x) { x.classList.toggle('on', x === b); }); return est(); }
    if (d.o !== undefined) return answer(+d.o);
    if (d.g !== undefined) { R.pos = +d.g; save(); return draw(); }
    if (d.rf) return report(lastRes, d.rf);
    if (d.del) { var E = get(K.err, {}) || {}; delete E[d.del]; put(K.err, E); return errorsView(); }
    switch (d.a) {
      case 'start': var p = pick(pref.n); return start(p.ids, { newRound: p.newRound });
      case 'resume': return resume();
      case 'drop': clearRun(); return home();
      case 'reset': if (confirm('سيعود كل البنك لقائمة «لم تُحل». سجل محاولاتك ومجلد الأخطاء يبقيان. متأكد؟')) { put(K.seen, { round: 1, ids: [] }); home(); } return;
      case 'errs': return errorsView();
      case 'errtrain': var ids = shuffle(Object.keys(get(K.err, {}) || {}).map(Number).filter(function (i) { return BY[i]; })).slice(0, 55); if (ids.length) start(ids, { mode: 'train', per: 0, kind: 'errors' }); return;
      case 'home': return home();
      case 'retry': var w = R.ids.filter(function (id, i) { return R.ans[i] !== BY[id].c; }); return start(shuffle(w), { mode: 'train', per: 0, kind: 'errors' });
      case 'prev': if (R.pos) { R.pos--; save(); draw(); } return;
      case 'next': if (R.pos < R.ids.length - 1) { R.pos++; save(); draw(); } return;
      case 'flag': if (R.flag[R.pos]) delete R.flag[R.pos]; else R.flag[R.pos] = 1; save(); return draw();
      case 'end': return confirmEnd();
      case 'pause':
        if (R.paused) { R.t0 = Date.now() - (R.total - R.paused) * 1000; delete R.paused; startTimer(); }
        else { R.paused = left(); stopTimer(); timerEl.classList.remove('hidden'); timerEl.textContent = '⏸ ' + fmt(R.paused); }
        save(); return draw();
    }
  });
  document.addEventListener('keydown', function (e) {
    if (!R || R.done || document.querySelector('.dlg,.lb')) { if (e.key === 'Escape') { var o = document.querySelector('.lb,.dlg'); if (o) o.remove(); } return; }
    if (/^(INPUT|TEXTAREA|SELECT)$/.test((e.target || {}).tagName || '')) return;
    var k = e.key, m = { '1': 0, '2': 1, '3': 2, '4': 3, '١': 0, '٢': 1, '٣': 2, '٤': 3, 'أ': 0, 'ب': 1, 'ج': 2, 'د': 3, 'a': 0, 'b': 1, 'c': 2, 'd': 3 };
    if (m[k] !== undefined) { e.preventDefault(); return answer(m[k]); }
    if (k === 'ArrowLeft') { e.preventDefault(); if (R.pos < R.ids.length - 1) { R.pos++; save(); draw(); } }
    else if (k === 'ArrowRight') { e.preventDefault(); if (R.pos) { R.pos--; save(); draw(); } }
    else if (k === 'f' || k === 'F') { if (R.flag[R.pos]) delete R.flag[R.pos]; else R.flag[R.pos] = 1; save(); draw(); }
  });
  addEventListener('beforeunload', function (e) { if (R && !R.done) { save(); } });
  // يكمل المؤقت من حيث كان عند العودة للصفحة
  var r0 = get(K.run, null);
  if (r0 && r0.ids && !r0.done && r0.total && !r0.paused && Date.now() - r0.t0 >= r0.total * 1000) { R = r0; finish(true); }
  else home();
})();
</script>
<script src="bw-shell.js"></script>
</body>
