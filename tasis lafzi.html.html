<!doctype html>
<html lang="ar" dir="rtl">
<head><meta name="color-scheme" content="only light">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بنك التناظر اللفظي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: one centered column; home = test grid, quiz = single question card with sticky top bar */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --ink:#18213a; --muted:#5d6680; --line:#dfe3ec;
  --stem:#c8102e; --accent:#1d3f8f; --accent-soft:#e7edfa;
  --ok:#147a4b; --ok-soft:#e2f4ea; --bad:#c8102e; --bad-soft:#fbe6e9; --flag:#b26b00; --flag-soft:#fff2db;
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--f-display);text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}

/* home */
.hero{padding-block:32px 20px;display:grid;gap:10px}
.hero h1{font-size:clamp(28px,6vw,40px);color:var(--ink)}
.hero h1 span{color:var(--stem)}
.hero p{margin:0;color:var(--muted);max-width:60ch}
.facts{display:flex;flex-wrap:wrap;gap:8px 20px;color:var(--muted);font-size:14px}
.facts b{color:var(--ink);font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px;margin-block:8px 22px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.lbl{font-size:13px;color:var(--muted);letter-spacing:.02em}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.hint{font-size:13px;color:var(--muted);margin:0}
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:10px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin-block:6px 12px}
.sec-h h2{font-size:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;text-align:right;display:grid;gap:4px}
.card:hover{border-color:var(--accent)}
.card .t{font-family:var(--f-display);font-size:17px}
.card .m{font-size:13px;color:var(--muted)}
.chip{justify-self:start;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--muted)}
.chip.good{background:var(--ok-soft);color:var(--ok)}
.chip.mid{background:var(--flag-soft);color:var(--flag)}
.chip.low{background:var(--bad-soft);color:var(--bad)}

/* quiz */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
.bar .row{flex-wrap:nowrap}
.bar .name{font-family:var(--f-display);font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.timer{font-weight:700;font-size:17px;padding:4px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.timer.low{color:var(--bad);border-color:var(--bad)}
.prog{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:18px;display:grid;gap:16px}
.qmeta{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted)}
.qask{font-size:14px;color:var(--muted);margin:0}
.stem{font-family:var(--f-display);font-size:clamp(26px,6vw,34px);color:var(--stem);text-align:center;padding-block:10px;border-block:1px dashed var(--line)}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;text-align:right;font-size:18px;font-weight:500;width:100%}
.opt .k{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-weight:700;font-size:15px;color:var(--accent)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);color:var(--surface)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default}
.feedback{font-weight:700;margin:0;font-size:15px}
.feedback.ok{color:var(--ok)} .feedback.no{color:var(--bad)}
.nav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:14px}
.nav .mid{display:flex;gap:10px}
.flagbtn[aria-pressed="true"]{border-color:var(--flag);color:var(--flag);background:var(--flag-soft)}
.map{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.map button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600;position:relative}
.map button.ans{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.map button.r{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.map button.w{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.map button.cur{outline:2px solid var(--ink);outline-offset:1px}
.map button.fl::after{content:"";position:absolute;top:3px;left:3px;width:7px;height:7px;border-radius:50%;background:var(--flag)}
.confirm{margin-top:14px;border:1px solid var(--flag);background:var(--flag-soft);border-radius:12px;padding:14px;display:grid;gap:10px}
.confirm p{margin:0}

/* results */
.res{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;margin-top:22px;display:grid;gap:16px;text-align:center}
.score{font-family:var(--f-display);font-size:56px;line-height:1}
.score small{font-size:22px;color:var(--muted)}
.stats{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 22px;font-size:15px}
.stats .ok{color:var(--ok)} .stats .no{color:var(--bad)}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.rv{display:grid;gap:10px;margin-top:20px}
.rvi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.rvi.bad{border-inline-start:4px solid var(--bad)}
.rvi.good{border-inline-start:4px solid var(--ok)}
.rvi .s{font-family:var(--f-display);color:var(--stem);font-size:20px}
.rvi .l{font-size:15px}
.rvi .l .y{color:var(--bad);text-decoration:line-through}
.rvi .l .c{color:var(--ok);font-weight:700}
.foot{margin-top:28px;font-size:13px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion: reduce){.prog i{transition:none}}
@media (max-width:480px){.nav .btn{padding:10px 12px}.qcard{padding:16px}}

.identity{direction:rtl;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:0 3px 14px rgba(29,63,143,.08)}.identity-logo{width:64px;height:64px;object-fit:contain;border-radius:50%;background:#fff;flex:none}.identity-copy{display:flex;flex-direction:column;gap:2px;min-width:0}.identity-copy b{font-family:var(--f-display);font-size:18px;color:var(--accent);font-weight:700}.identity-copy span,.identity-copy a{font-size:13px;color:var(--muted);text-decoration:none}.identity-copy a:hover{text-decoration:underline;color:var(--accent)}.hero-identity{margin-top:4px}.qr-card{display:grid;justify-items:center;gap:2px;text-decoration:none;color:var(--accent);font-size:11px;font-weight:700;padding:3px;border-radius:9px}.qr-card:hover{background:var(--accent-soft)}.qr-card img{width:66px;height:66px;background:#fff;border-radius:5px}.identity.compact{border:0;border-radius:8px;padding:5px 8px;background:color-mix(in srgb,var(--surface) 82%,transparent);box-shadow:none;gap:8px}.identity.compact .identity-logo{width:38px;height:38px}.identity.compact .identity-copy b{font-size:13px}.identity.compact .identity-copy span{font-size:11px}.qr-mini{display:block;padding:2px;border-radius:5px}.qr-mini:hover{background:var(--accent-soft)}.qr-mini img{display:block;width:38px;height:38px;background:#fff;border-radius:3px}.bar .identity{margin-top:0}.qcard{position:relative;isolation:isolate;overflow:hidden}.qcard::before{content:"";position:absolute;inset:0;background-image:url(data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh7/wAARCAGSAaQDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZ   m_("m-train",()=>setp("mode","train"));m_("m-exam",()=>setp("mode","exam"));
  m_("t-on",()=>setp("timer",true));m_("t-off",()=>setp("timer",false));
  m_("rand",()=>{const pool=TESTS.flat().slice();for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}start(pool.slice(0,PER),"اختبار عشوائي",null)});
  const r=document.getElementById("reset"); if(r) r.onclick=()=>{document.getElementById("resetbox").innerHTML=`<div class="confirm" style="margin-bottom:12px"><p>سيتم حذف كل النتائج المحفوظة على هذا الجهاز.</p><div class="actions" style="justify-content:flex-start"><button class="btn primary" id="rs-y">احذف النتائج</button><button class="btn" id="rs-n">إلغاء</button></div></div>`;
    m_("rs-y",()=>{best={};store.set("tanazur.best.50q.v1",best);home()});m_("rs-n",()=>{document.getElementById("resetbox").innerHTML=""})};
  app.querySelectorAll(".card").forEach(b=>b.onclick=()=>{const i=+b.dataset.t;start(TESTS[i],"اختبار "+AR(i+1),i)});
  window.scrollTo(0,0);
}
function m_(id,f){const e=document.getElementById(id);if(e)e.onclick=f}

function start(qs,name,idx){
  st={qs,name,idx,mode:prefs.mode,i:0,ans:Array(qs.length).fill(null),flag:Array(qs.length).fill(false),
      t0:Date.now(),limit:prefs.timer?qs.length*60:null,confirm:false,done:false};
  clearInterval(tick);
  tick=setInterval(()=>{const el=document.getElementById("timer");if(!el||!st)return;const e=Math.floor((Date.now()-st.t0)/1000);
    if(st.limit){const left=st.limit-e;el.textContent=fmt(left);el.classList.toggle("low",left<=60);if(left<=0)finish()}else el.textContent=fmt(e)},1000);
  quiz();
}
function quiz(){
  const q=st.qs[st.i],a=st.ans[st.i],train=st.mode==="train",locked=train&&a!=null;
  const answered=st.ans.filter(x=>x!=null).length;
  const e=Math.floor((Date.now()-st.t0)/1000);
  app.innerHTML=`
  <div class="bar"><div class="row"><span class="name">${st.name}</span>
    <span class="tq num">أجبت <b>${AR(answered)}</b> · متبقٍ <b>${AR(st.qs.length-answered)}</b></span><span class="timer num" id="timer">${st.limit?fmt(st.limit-e):fmt(e)}</span><button class="btn primary tsub" id="end3" type="button">تسليم</button></div>
    ${academyIdentity(true)}
    <div class="prog"><i style="width:${answered/st.qs.length*100}%"></i></div></div>
  <article class="qcard">
    <div class="qmeta"><span class="num">السؤال ${AR(st.i+1)} من ${AR(st.qs.length)}</span><span class="num">رقم ${AR(q.id+1)} في البنك</span></div>
    <p class="qask">اختر الإجابة التي تحمل علاقة مشابهة:</p>
    <div class="stem">${esc(q.s)}</div>
    <div class="opts">${q.o.map((o,k)=>{let c="";
      if(locked){if(k===q.a)c="right";else if(k===a)c="wrong"}else if(a===k)c="sel";
      return `<button class="opt ${c}" data-k="${k}" ${locked?"disabled":""}><span class="k">${L[k]}</span><span>${esc(o)}</span></button>`}).join("")}</div>
    ${locked?`<p class="feedback ${a===q.a?"ok":"no"}">${a===q.a?"إجابة صحيحة":"إجابة خاطئة، الصحيحة: ("+L[q.a]+") "+esc(q.o[q.a])}</p>`:""}
  </article>
  <div class="nav">
    <button class="btn" id="prev" ${st.i===0?"disabled":""}>السابق</button>
    <div class="mid"><button class="btn flagbtn" id="flag" aria-pressed="${st.flag[st.i]}">${st.flag[st.i]?"مميز للمراجعة":"ميّز للمراجعة"}</button></div>
    ${st.i<st.qs.length-1?'<button class="btn primary" id="next">التالي</button>':'<button class="btn primary" id="end">تسليم</button>'}
  </div>
  <div id="cbox">${st.confirm?confirmBox():""}</div>
  <div class="map" aria-label="خريطة الأسئلة">${st.qs.map((qq,k)=>{let c="";const v=st.ans[k];
    if(v!=null)c=train?(v===qq.a?"r":"w"):"ans";if(k===st.i)c+=" cur";if(st.flag[k])c+=" fl";
    return `<button class="${c} num" data-g="${k}" aria-label="السؤال ${k+1}">${AR(k+1)}</button>`}).join("")}</div>
  <div class="nav" style="justify-content:flex-start"><button class="btn ghost" id="quit">رجوع للقائمة</button><button class="btn ghost" id="end2">تسليم الآن</button></div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.k));
  app.querySelectorAll(".map button").forEach(b=>b.onclick=()=>go(+b.dataset.g));
  m_("prev",()=>go(st.i-1));m_("next",()=>go(st.i+1));
  m_("flag",()=>{st.flag[st.i]=!st.flag[st.i];quiz()});
  m_("end",ask);m_("end2",ask);m_("end3",ask);m_("quit",home);
  bindConfirm();
}
function pick(k){
  if(st.mode==="train"&&st.ans[st.i]!=null)return;
  st.ans[st.i]=k;quiz();
  if(st.mode==="exam"&&st.i<st.qs.length-1)setTimeout(()=>{if(st&&!st.done)go(st.i+1)},220);
}
function go(i){if(i<0||i>=st.qs.length)return;st.i=i;st.confirm=false;quiz();window.scrollTo(0,0)}
function confirmBox(){const left=st.ans.filter(x=>x==null).length,fl=st.flag.filter(Boolean).length;
  return `<div class="confirm"><p>${left?`باقي <b class="num">${AR(left)}</b> سؤال بدون إجابة.`:"أجبت على كل الأسئلة."}${fl?` ولديك <b class="num">${AR(fl)}</b> سؤال مميز للمراجعة.`:""} هل تريد التسليم؟</p>
  <div class="actions" style="justify-content:flex-start"><button class="btn primary" id="c-y">نعم، سلّم</button><button class="btn" id="c-n">أكمل الحل</button></div></div>`}
function ask(){st.confirm=true;document.getElementById("cbox").innerHTML=confirmBox();bindConfirm();document.getElementById("cbox").scrollIntoView({block:"center"})}
function bindConfirm(){m_("c-y",finish);m_("c-n",()=>{st.confirm=false;document.getElementById("cbox").innerHTML=""})}

function finish(){
  if(!st||st.done)return; st.done=true; clearInterval(tick);
  const n=st.qs.length,right=st.qs.filter((q,k)=>st.ans[k]===q.a).length,blank=st.ans.filter(x=>x==null).length;
  const pct=Math.round(right/n*100),secs=Math.floor((Date.now()-st.t0)/1000);
  if(st.idx!=null&&(best[st.idx]==null||pct>best[st.idx])){best[st.idx]=pct;store.set("tanazur.best.50q.v1",best)}
  results({right,blank,pct,secs,onlyWrong:right<n});
}
function results(r){
  const n=st.qs.length,wrong=n-r.right-r.blank;
  const items=st.qs.map((q,k)=>({q,a:st.ans[k],k})).filter(x=>!r.onlyWrong||x.a!==x.q.a);
  app.innerHTML=window.bwRenderResultSummary({total:n,correct:r.right,wrong:wrong,skipped:r.blank,review:'#rvw',practice:'#wrongs'})+`
  ${academyIdentity(false)}
  <section class="res">
    <h2>${st.name}</h2>
    <div class="score num">${AR(r.right)}<small> / ${AR(n)}</small></div>
    <div class="stats num"><span class="ok">صحيحة ${AR(r.right)}</span><span class="no">خاطئة ${AR(wrong)}</span><span>بدون إجابة ${AR(r.blank)}</span><span>النسبة ${AR(r.pct)}٪</span><span>الوقت ${fmt(r.secs)}</span></div>
    <div class="actions">
      <button class="btn primary" id="again">أعد الاختبار</button>
      ${wrong+r.blank?'<button class="btn" id="rvw">📖 مراجعة الأخطاء</button><button class="btn" id="wrongs">🔁 اختبار الأخطاء</button>':""}
      <button class="btn" id="back">قائمة الاختبارات</button></div>
  </section>
  <div class="sec-h" style="margin-top:22px"><h2>مراجعة الإجابات</h2>
    <div class="seg" role="group"><button id="f-all" aria-pressed="${!r.onlyWrong}">الكل</button><button id="f-bad" aria-pressed="${r.onlyWrong}">الأخطاء</button></div></div>
  <div class="rv">${items.length?items.map(({q,a,k})=>{const ok=a===q.a;
    return `<div class="rvi ${ok?"good":"bad"}"><span class="lbl num">السؤال ${AR(k+1)}</span><span class="s">${esc(q.s)}</span>
      <span class="l">${ok?`<span class="c">✓ (${L[q.a]}) ${esc(q.o[q.a])}</span>`:
        `${a!=null?`<span class="y">(${L[a]}) ${esc(q.o[a])}</span> ← `:"لم تجب ← "}<span class="c">(${L[q.a]}) ${esc(q.o[q.a])}</span>`}</span></div>`}).join(""):'<p class="hint">لا توجد أخطاء. ممتاز!</p>'}</div>`;
  const {qs,name,idx}=st;
  m_("again",()=>start(qs,name,idx));
  m_("wrongs",()=>start(qs.filter((q,k)=>st.ans[k]!==q.a),name+" · الأخطاء",null));
  m_("back",home);
  m_("rvw",()=>{results({...r,onlyWrong:true});const v=document.querySelector(".rv");if(v)v.scrollIntoView({behavior:"smooth"})});
  m_("f-all",()=>results({...r,onlyWrong:false}));m_("f-bad",()=>results({...r,onlyWrong:true}));
  window.scrollTo(0,0);
}
document.addEventListener("keydown",e=>{
  if(!st||st.done||e.target.closest("input,textarea"))return;
  const m={"1":0,"2":1,"3":2,"4":3,"أ":0,"ب":1,"ج":2,"د":3}; // ب/ج/د keys on Arabic layout
  if(e.key in m){pick(m[e.key]);e.preventDefault()}
  else if(e.key==="ArrowLeft"){go(st.i+1)}else if(e.key==="ArrowRight"){go(st.i-1)}
});
home();
</script>
<script src="/bw-shell.js"></script>
<script src="/bw-theme-toggle.js" defer></script></body>
</html>
