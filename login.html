<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>دخول الطالب | البوابة التعليمية</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef7fb;font-family:Cairo,Tahoma,Arial,sans-serif;color:#1d2b3a}
.box{width:min(92vw,400px);background:#fff;border-radius:18px;padding:26px;box-shadow:0 10px 30px #12345a22;text-align:center}h1{margin:0 0 6px;color:#12345a;font-size:22px}p{margin:0 0 16px;color:#5b6b7b;font-size:14px}
input{width:100%;padding:13px;font-size:20px;text-align:center;letter-spacing:3px;border:2px solid #cfdde8;border-radius:12px;direction:ltr;text-transform:uppercase}input:focus{outline:none;border-color:#1769aa}
button{width:100%;margin-top:12px;padding:13px;font-size:17px;font-weight:700;border:0;border-radius:12px;background:#12345a;color:#fff;cursor:pointer}.e{color:#c0392b;min-height:22px;margin-top:10px;font-size:14px}
.n{background:#fff6dd;color:#8a6200;border-radius:12px;padding:10px;font-size:14px;margin-bottom:14px;display:none}
.sep{display:none;margin:20px 0 12px;color:#8a98a6;font-size:13px;align-items:center;gap:10px}.sep:before,.sep:after{content:"";flex:1;border-top:1px solid #e3ebf2}
.wa{display:none;align-items:center;gap:12px;text-align:right;padding:12px 14px;border:1.5px solid #d6e4f0;border-radius:14px;background:#f5f9fd;color:#12345a;text-decoration:none;transition:.15s}.wa:hover{background:#eaf3fb;border-color:#9cc3e3;transform:translateY(-1px)}
.wa svg{width:34px;height:34px;flex:none;fill:#25a55f}.wa b{display:block;font-size:15px}.wa small{display:block;color:#5b6b7b;font-size:12.5px;margin-top:2px;direction:ltr;text-align:right}.wa .ar{margin-right:auto;color:#7aa6c9;font-size:20px}
</style></head>
<body><form class="box" id="f"><h1>منصة البوابة التعليمية</h1><div class="n" id="n"></div><p>اكتب الكود الخاص بك للدخول</p><input id="c" autocomplete="off" autocapitalize="characters" maxlength="12" placeholder="XXXXXXXX" autofocus><button>دخول</button><div class="e" id="e"></div>
<div class="sep" id="sep">ليس لديك كود؟</div>

</form>
<script>
var q=new URLSearchParams(location.search),e=document.getElementById('e'),n=document.getElementById('n');
var W={blocked:'تم إيقاف كودك. تواصل مع المنصة.',expired:'انتهت صلاحية كودك. تواصل مع المنصة للتجديد.',trial_ended:'انتهت فترة التجربة المجانية. سجّل دخولك بكودك لمتابعة التدريب.',need:'الدخول لهذه المنصة بالكود الخاص بك.'};
if(W[q.get('why')]){n.textContent=W[q.get('why')];n.style.display='block'}
fetch('/api/public').then(function(r){return r.json()}).then(function(d){if(d.contact){var a=document.getElementById('wa');a.href='https://wa.me/'+d.contact+'?text='+encodeURIComponent('السلام عليكم، أريد الاشتراك في منصة البوابة التعليمية');document.getElementById('wn').textContent='0'+d.contact.replace(/^966/,'');a.style.display='flex';document.getElementById('sep').style.display='flex'}}).catch(function(){});
document.getElementById('f').onsubmit=async function(ev){ev.preventDefault();e.textContent='';
try{var r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code:document.getElementById('c').value})}),d=await r.json();
if(r.ok){var x=q.get('next')||'/';location.href=(x.charAt(0)==='/'&&x.charAt(1)!=='/')?x:'/'}else e.textContent=d.error||'حدث خطأ'}catch(x){e.textContent='تعذّر الاتصال، حاول مرة أخرى'}};
</script></body></html>
