<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>دخول الطالب | البوابة التعليمية</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef7fb;font-family:Cairo,Tahoma,Arial,sans-serif;color:#1d2b3a}
.box{width:min(92vw,380px);background:#fff;border-radius:18px;padding:26px;box-shadow:0 10px 30px #12345a22;text-align:center}h1{margin:0 0 6px;color:#12345a;font-size:22px}p{margin:0 0 16px;color:#5b6b7b;font-size:14px}
input{width:100%;padding:13px;font-size:20px;text-align:center;letter-spacing:3px;border:2px solid #cfdde8;border-radius:12px;direction:ltr;text-transform:uppercase}input:focus{outline:none;border-color:#1769aa}
button{width:100%;margin-top:12px;padding:13px;font-size:17px;font-weight:700;border:0;border-radius:12px;background:#12345a;color:#fff;cursor:pointer}.e{color:#c0392b;min-height:22px;margin-top:10px;font-size:14px}</style></head>
<body><form class="box" id="f"><h1>منصة البوابة التعليمية</h1><p>اكتب الكود الخاص بك للدخول</p><input id="c" autocomplete="off" autocapitalize="characters" maxlength="12" placeholder="XXXXXXXX" autofocus><button>دخول</button><div class="e" id="e"></div></form>
<script>
var q=new URLSearchParams(location.search),e=document.getElementById('e');
if(q.get('blocked'))e.textContent='تم إيقاف حسابك. تواصل مع المشرف.';
document.getElementById('f').onsubmit=async function(ev){ev.preventDefault();e.textContent='';
try{var r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code:document.getElementById('c').value})}),d=await r.json();
if(r.ok){var n=q.get('next')||'/';location.href=(n.charAt(0)==='/'&&n.charAt(1)!=='/')?n:'/'}else e.textContent=d.error||'حدث خطأ'}catch(x){e.textContent='تعذّر الاتصال، حاول مرة أخرى'}};
</script></body></html>
