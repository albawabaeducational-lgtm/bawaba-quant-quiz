<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>دخول الطالب | البوابة التعليمية</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef7fb;font-family:Cairo,Tahoma,Arial,sans-serif;color:#1d2b3a;padding:18px 0}
.box{width:min(92vw,430px);background:#fff;border-radius:18px;padding:26px;box-shadow:0 10px 30px #12345a22;text-align:center}h1{margin:0 0 6px;color:#12345a;font-size:22px}h2{margin:0 0 10px;color:#12345a;font-size:17px}p{margin:0 0 16px;color:#5b6b7b;font-size:14px}
input{width:100%;padding:13px;font-size:20px;text-align:center;letter-spacing:3px;border:2px solid #cfdde8;border-radius:12px;direction:ltr;text-transform:uppercase}input:focus{outline:none;border-color:#1769aa}
button.m{width:100%;margin-top:12px;padding:13px;font-size:17px;font-weight:700;border:0;border-radius:12px;background:#12345a;color:#fff;cursor:pointer}button.s{width:100%;margin-top:10px;padding:11px;font-size:15px;font-weight:700;border:2px solid #12345a;border-radius:12px;background:#fff;color:#12345a;cursor:pointer;display:none}.e{color:#c0392b;min-height:22px;margin-top:10px;font-size:14px}
.n{background:#fff6dd;color:#8a6200;border-radius:12px;padding:10px;font-size:14px;margin-bottom:14px;display:none;line-height:1.7}.n.r{background:#fde8e6;color:#9b2c2c}
.sep{margin:22px 0 12px;color:#8a98a6;font-size:13px;display:flex;align-items:center;gap:10px}.sep:before,.sep:after{content:"";flex:1;border-top:1px solid #e3ebf2}
.pl{display:none;flex-direction:column;gap:10px;text-align:right}.pl a{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1.5px solid #d6e4f0;border-radius:14px;background:#f5f9fd;color:#12345a;text-decoration:none;transition:.15s}.pl a:hover{background:#eaf3fb;border-color:#9cc3e3}
.pl b{font-size:15px;display:block}.pl small{color:#5b6b7b;font-size:12.5px}.pl .pr{margin-right:auto;text-align:left;font-weight:800;font-size:19px;color:#1769aa;white-space:nowrap}.pl .pr small{display:block;font-weight:400}
.wa{display:none;align-items:center;gap:12px;text-align:right;padding:12px 14px;border:1.5px solid #d6e4f0;border-radius:14px;background:#f5f9fd;color:#12345a;text-decoration:none;transition:.15s;margin-top:10px}.wa:hover{background:#eaf3fb;border-color:#9cc3e3}
.wa svg{width:34px;height:34px;flex:none;fill:#25a55f}.wa b{display:block;font-size:15px}.wa small{display:block;color:#5b6b7b;font-size:12.5px;margin-top:2px;direction:ltr;text-align:right}.wa .ar{margin-right:auto;color:#7aa6c9;font-size:20px}</style></head>
<body><form class="box" id="f"><h1>منصة البوابة التعليمية</h1><div class="n" id="n"></div><p id="lead">اكتب الكود الخاص بك للدخول</p><input id="c" autocomplete="off" autocapitalize="characters" maxlength="12" placeholder="XXXXXXXX" autofocus><button class="m">دخول</button><button type="button" class="s" id="rs">إنهاء الاستراحة والدخول الآن</button><div class="e" id="e"></div>
<div id="pw" style="display:none"><div class="sep" id="plans">باقات الاشتراك</div><div class="pl" id="pl"></div></div>
<div class="sep" id="sep" style="display:none">ليس لديك كود؟</div>
<a class="wa" id="wa" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg><span><b>تواصل معنا على واتساب</b><small id="wn"></small></span><span class="ar">‹</span></a></form>
<script>
var q=new URLSearchParams(location.search),e=document.getElementById('e'),n=document.getElementById('n'),why=q.get('why')||'';
function num(x){try{return Number(x).toLocaleString('ar-EG')}catch(_){return x}}
var W={blocked:'تم إيقاف كودك. تواصل مع المنصة.',expired:'انتهت صلاحية كودك. اختر باقة من الأسفل للتجديد.',trial_ended:'انتهت فترة التجربة المجانية. سجّل دخولك بكودك أو اختر باقة للاشتراك.',need:'الدخول لهذه المنصة بالكود الخاص بك.',
 warn2:'تنبيه ٢ من ٢: رُصد مسح بيانات المتصفح لتجديد التجربة المجانية أكثر من مرة. لذلك أُوقفت التجربة المجانية على هذا الجهاز، ولا يمكن الدخول إلا بكود صحيح.',
 banned:'رُصد تكرار مسح بيانات المتصفح لتجديد التجربة المجانية بعد تحذيرين، لذلك مُنعت التجربة المجانية من شبكتك لمدة ٣٠ يومًا. الدخول بكود صحيح فقط. إن كان هذا خطأ تواصل معنا.'};
if(why==='paused'){var u=+q.get('until');n.textContent='حسابك في استراحة'+(u?' حتى '+new Date(u).toLocaleString('ar-EG',{dateStyle:'medium',timeStyle:'short'}):'')+'. العد العكسي متوقف، وتُضاف مدة الاستراحة لاشتراكك.';n.style.display='block';document.getElementById('rs').style.display='block'}
else if(W[why]){n.textContent=W[why];n.className='n'+(why==='warn2'||why==='banned'?' r':'');n.style.display='block'}
fetch('/api/public').then(function(r){return r.json()}).then(function(d){
 var wa=function(t){return 'https://wa.me/'+d.contact+'?text='+encodeURIComponent(t)};
 if(d.plans&&d.plans.length){var pl=document.getElementById('pl');pl.innerHTML=d.plans.map(function(p){var days=p.days>=30&&p.days%30===0?num(p.days/30)+' شهر':num(p.days)+' يوم';return '<a'+(d.contact?' target="_blank" rel="noopener" href="'+wa('السلام عليكم، أريد الاشتراك في ('+p.name+') بسعر '+p.price+' ريال')+'"':'')+'><span><b>'+p.name+'</b><small>'+days+' — اشترك عبر واتساب</small></span><span class="pr">'+num(p.price)+' ريال</span></a>'}).join('');pl.style.display='flex';document.getElementById('pw').style.display='block'}
 if(d.contact){var a=document.getElementById('wa');a.href=wa('السلام عليكم، أريد الاستفسار عن منصة البوابة التعليمية');document.getElementById('wn').textContent='0'+d.contact.replace(/^966/,'');a.style.display='flex';document.getElementById('sep').style.display='flex'}
 if(location.hash==='#plans')document.getElementById('plans').scrollIntoView()}).catch(function(){});
async function post(u,b){var r=await fetch(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});return[r.ok,await r.json().catch(function(){return{}})]}
async function enter(){var code=document.getElementById('c').value,x=await post('/api/login',{code:code});
 if(x[0]){var nx=q.get('next')||'/';location.href=(nx.charAt(0)==='/'&&nx.charAt(1)!=='/')?nx:'/'}else if(x[1].paused){e.textContent='حسابك في استراحة. اضغط «إنهاء الاستراحة» للدخول الآن.';document.getElementById('rs').style.display='block'}else e.textContent=x[1].error||'حدث خطأ'}
document.getElementById('f').onsubmit=async function(ev){ev.preventDefault();e.textContent='';try{await enter()}catch(_){e.textContent='تعذّر الاتصال، حاول مرة أخرى'}};
document.getElementById('rs').onclick=async function(){e.textContent='';var code=document.getElementById('c').value;if(!code.trim()){e.textContent='اكتب كودك أولًا';return}
 try{var x=await post('/api/resume',{code:code});if(!x[0]){e.textContent=x[1].error||'حدث خطأ';return}await enter()}catch(_){e.textContent='تعذّر الاتصال، حاول مرة أخرى'}};
</script></body></html>
